name: Android PR smoke (unsigned debug)

# All pull requests get an independent APK build. No release signing secrets,
# no RuStore publishing and no production deployment.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'web/**'
      - 'server/**'
      - 'scripts/verify-approved.mjs'
      - 'scripts/verify-brand.mjs'
      - '.github/workflows/android-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: https://traksos.ru
      RUSTORE_PROJECT_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble exact PR web assets
        run: |
          npm install
          node scripts/verify-brand.mjs
          npm -w web run build
          node scripts/verify-approved.mjs
          mkdir -p android/app/src/main/assets/www
          cp -a web/dist/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/index.html
          test -s android/app/src/main/assets/www/app.js
          test -s android/app/src/main/assets/www/app.css
          test -s android/app/src/main/assets/www/tracksos-approved-scania-r520.webp

      - name: Build debug APK without release credentials
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Check bundled pages and installed package metadata
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          for asset in index.html app.js app.css tracksos-approved-scania-r520.webp; do
            unzip -Z1 "$APK" | grep -Fx "assets/www/$asset"
          done
          grep -F '"applicationId": "ru.traksos.app.preview"' android/app/build/outputs/apk/debug/output-metadata.json
          sha256sum "$APK"
          echo '### Android PR smoke' >> "$GITHUB_STEP_SUMMARY"
          echo '- Built debug APK, without release signing credentials.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Bundled actual PR web assets and Scania R520.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Physical-device notifications and calls remain unverified.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tracksos-pr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # A successful Gradle build does not prove that the app opens on a device.
  # Launch the exact uploaded APK under Android 10 and Android 15, collect native crash logs.
  runtime-launch:
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - name: Diagnose and enable KVM when available
        run: |
          if [ -c /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo 'KVM acceleration is available'
            else
              echo '::warning::KVM exists but is not accessible; using software emulator'
            fi
          else
            echo '::warning::This GitHub runner has no /dev/kvm; using software emulator'
          fi
      - uses: actions/download-artifact@v4
        with:
          name: tracksos-pr-debug-apk
          path: apk
      - name: Boot emulator, launch APK and fail on native crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: |
            set -eu
            adb install -r apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n ru.traksos.app.preview/ru.traksos.app.MainActivity
            # A running process is not proof that the actual React homepage appeared.
            # Wait for the debug-only, privacy-safe native WebView DOM readiness log.
            ready=0
            for attempt in $(seq 1 75); do
              adb logcat -d -s TrakSOSRuntime:I > runtime-ready.log
              if grep -Fq GUEST_UI_RENDERED runtime-ready.log && grep -Fq SPLASH_VISIBLE_MS= runtime-ready.log; then
                ready=1
                break
              fi
              sleep 2
            done
            adb logcat -d -s AndroidRuntime:E > runtime-errors.log
            adb shell dumpsys activity activities > activity-dump.txt
            adb exec-out screencap -p > emulator-screen.png
            # Screen hierarchy helps detect Android System UI ANR dialogs which
            # previously passed process-only checks. Keep it for visual QA.
            if timeout 30s adb shell uiautomator dump /sdcard/traksos-window.xml >/dev/null 2>&1; then
              adb exec-out cat /sdcard/traksos-window.xml > emulator-ui.xml || true
            fi
            if [ "$ready" -ne 1 ]; then
              echo 'FAIL: real guest React interface or splash dismissal not observed'
              tail -n 30 runtime-ready.log
              exit 1
            fi
            visible_ms=$(sed -n 's/.*SPLASH_VISIBLE_MS=\([0-9][0-9]*\).*/\1/p' runtime-ready.log | tail -1)
            if [ -z "$visible_ms" ] || [ "$visible_ms" -lt 3500 ]; then
              echo "FAIL: startup artwork was visible for only ${visible_ms:-unknown} ms"
              exit 1
            fi
            adb shell pidof ru.traksos.app.preview
            ! grep -F 'Process: ru.traksos.app.preview' runtime-errors.log
            grep -F 'ru.traksos.app.preview' activity-dump.txt
            if [ -s emulator-ui.xml ] && grep -Eiq "System UI isn.t responding|App isn.t responding" emulator-ui.xml; then
              echo 'FAIL: Android unresponsive-system dialog covers the application'
              exit 1
            fi
            echo "PASS: rendered TrakSOS guest interface after ${visible_ms}ms seasonal splash"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracksos-emulator-api-${{ matrix.api-level }}
          path: |
            runtime-errors.log
            activity-dump.txt
            emulator-screen.png
            emulator-ui.xml
            runtime-ready.log
          if-no-files-found: warn
