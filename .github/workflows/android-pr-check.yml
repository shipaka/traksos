name: Android PR smoke (unsigned debug)

# All pull requests get an independent APK build. No release signing secrets,
# no RuStore publishing and no production deployment.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'web/**'
      - 'server/**'
      - 'scripts/verify-approved.mjs'
      - 'scripts/verify-brand.mjs'
      - 'scripts/android-pr-runtime-smoke.sh'
      - 'scripts/verify-android-screen.py'
      - '.github/workflows/android-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: https://traksos.ru
      RUSTORE_PROJECT_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble exact PR web assets
        run: |
          npm install
          node scripts/verify-brand.mjs
          npm -w web run build
          node scripts/verify-approved.mjs
          mkdir -p android/app/src/main/assets/www
          cp -a web/dist/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/index.html
          test -s android/app/src/main/assets/www/app.js
          test -s android/app/src/main/assets/www/app.css
          test -s android/app/src/main/assets/www/tracksos-approved-scania-r520.webp

      - name: Build debug APK without release credentials
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Check bundled pages and installed package metadata
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          for asset in index.html app.js app.css tracksos-approved-scania-r520.webp; do
            unzip -Z1 "$APK" | grep -Fx "assets/www/$asset"
          done
          grep -F '"applicationId": "ru.traksos.app.preview"' android/app/build/outputs/apk/debug/output-metadata.json
          sha256sum "$APK"
          echo '### Android PR smoke' >> "$GITHUB_STEP_SUMMARY"
          echo '- Built debug APK, without release signing credentials.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Bundled actual PR web assets and Scania R520.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Physical-device notifications and calls remain unverified.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tracksos-pr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # A successful Gradle build does not prove that the app opens on a device.
  # Launch the exact uploaded APK under Android 10 and Android 15, collect native crash logs.
  runtime-launch:
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose and enable KVM when available
        run: |
          if [ -c /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo 'KVM acceleration is available'
            else
              echo '::warning::KVM exists but is not accessible; using software emulator'
            fi
          else
            echo '::warning::This GitHub runner has no /dev/kvm; using software emulator'
          fi
      - uses: actions/download-artifact@v4
        with:
          name: tracksos-pr-debug-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The public Android SDK mirror may close a large system-image download
      # mid-stream (Premature EOF). Prepare with bounded retries BEFORE trying
      # to boot. An image-download failure must not be reported as an APK crash.
      - name: Preinstall emulator image, retry transient SDK download failures
        env:
          API_LEVEL: ${{ matrix.api-level }}
        shell: bash
        run: |
          # GitHub ubuntu runner ships the official Android cmdline-tools
          # already; avoid third-party setup actions which reinstall the
          # removed legacy 'tools' package and fail before APK launch.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Preinstalled Android sdkmanager missing at $SDKMANAGER"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "system-images;android-${API_LEVEL};google_apis;x86_64" --channel=0 > sdk-image-install.log 2>&1; then
              echo "Android system image ${API_LEVEL} installed on attempt ${attempt}"
              exit 0
            fi
            cat sdk-image-install.log
            echo "::warning::SDK image install attempt ${attempt}/3 failed (transient mirror failure possible)"
            if [ "${attempt}" -lt 3 ]; then sleep "$((attempt * 12))"; fi
          done
          echo "::error::Failed downloading Android ${API_LEVEL} image after three attempts; no app was launched"
          exit 1
      - name: Boot emulator, launch APK and fail on native crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: bash scripts/android-pr-runtime-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracksos-emulator-api-${{ matrix.api-level }}
          path: |
            runtime-errors.log
            activity-dump.txt
            emulator-screen.png
            emulator-ui.xml
            runtime-ready.log
          if-no-files-found: warn
