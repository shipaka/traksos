name: Android

# Собирает APK для RuStore. Подпись — из двух секретов репозитория (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64 (файл ключа в base64), ANDROID_KEYSTORE_PASSWORD (пароль).
#   Имя ключа — traksos, пароль ключа = паролю хранилища (можно переопределить ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD).
# Настройки — из переменных (вкладка Variables): APP_URL (адрес сайта), RUSTORE_PROJECT_ID (проект RuStore Push).
# Без ключа подписи собирается отладочный APK — его можно поставить на телефон для проверки, но не в RuStore.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/src/**'
      - 'web/public/**'
      - 'web/index.html'
      - 'web/build.mjs'
      - 'web/sw.template.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Always build the most recent UI revision and cancel obsolete builds.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://traksos.ru' }}
      RUSTORE_PROJECT_ID: ${{ vars.RUSTORE_PROJECT_ID }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Встроить фронтенд в APK
        env:
          API_URL: ""
        run: |
          npm install
          npm -w web run build
          mkdir -p android/app/src/main/assets/www
          cp -a web/dist/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/index.html
          test -s android/app/src/main/assets/www/app.js
          test -s android/app/src/main/assets/www/app.css
          echo "Bundled web assets:"; du -sh android/app/src/main/assets/www

      - name: Ключ подписи
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ключ подписи не задан — собираю отладочный APK"
          fi

      - name: Сборка
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'traksos' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Проверка веб-ресурсов внутри APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep 'assets/www/index.html'
          unzip -l "$APK" | grep 'assets/www/app.js'
          unzip -l "$APK" | grep 'assets/www/app.css'
          echo "APK includes the public UI without network access"

      - uses: actions/upload-artifact@v4
        with:
          name: traksos-${{ steps.keystore.outputs.signed == 'true' && 'release' || 'debug' }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
