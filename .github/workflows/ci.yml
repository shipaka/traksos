name: Проверка

on:
  push:
    branches: [main, feature/vehicle-insurance-workflows]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: traksos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/traksos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Сервер — типы
        run: npm run typecheck
      - name: Сервер — тесты
        run: npm test
      - name: Веб — сборка
        run: npm -w web run build
      - name: Сквозной сценарий в браузере
        timeout-minutes: 15
        run: |
          npx playwright install --with-deps chromium
          psql -h 127.0.0.1 -U postgres -c 'create database traksos'
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/traksos ADMIN_PHONES=+79990000001 npm -w server start > /tmp/traksos-server.log 2>&1 &
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Сервер ТракSOS не ответил за 90 секунд:'
            cat /tmp/traksos-server.log
            exit 1
          fi
          timeout 2m node e2e/site.mjs e2e/shots
          timeout 4m node e2e/roles.mjs e2e/shots
          timeout 10m node e2e/flow.mjs e2e/shots
      - name: Снимки экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: e2e/shots
          if-no-files-found: ignore
