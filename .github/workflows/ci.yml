name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 01:00 Moscow time (UTC+3). Scheduled starts can be delayed by GitHub.
  schedule:
    - cron: '0 22 * * *'

# Only the most recent run matters during rapid pre-release iterations.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: traksos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/traksos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Предрелизная проверка Docker Compose и резервного копирования
        run: |
          bash -n deploy/launch.sh
          sh -n deploy/backup.sh
          bash -n deploy/doctor.sh
          bash -n deploy/update-site.sh
          bash -n deploy/diagnose-sms.sh
          bash -n deploy/configure-staff.sh
          bash -n deploy/configure-insurer.sh
          bash -n deploy/activate-primary-admin.sh
          # docker compose requires app.env_file to exist even for config-only checks.
          cp deploy/.env.example deploy/.env
          trap 'rm -f deploy/.env' EXIT
          DB_PASSWORD=ci-only-check APP_SECRET=ci-only-check docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
      - name: Сервер — типы
        run: npm run typecheck
      - name: Сервер — тесты
        run: npm test
      - name: Веб — сборка
        run: npm -w web run build
      - name: Сверка утверждённого дизайна и комплектации
        run: node scripts/verify-approved.mjs
      - name: Сквозной сценарий в браузере и контроль интерактивности
        run: |
          npx playwright install --with-deps chromium
          psql -h 127.0.0.1 -U postgres -c 'create database traksos'
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/traksos ADMIN_PHONES=+79990000001 MODERATOR_PHONES=+79990000147 npm -w server start &
          until curl -s localhost:8080/api/health >/dev/null; do sleep 1; done
          node e2e/ui-smoke.mjs
          node e2e/public-shots.mjs e2e/shots
          SHOTS_DIR=e2e/shots/public node e2e/public-layout.mjs
          node e2e/offline.mjs
          node e2e/flow.mjs e2e/shots
          node e2e/admin-ops.mjs e2e/shots
          SHOTS_DIR=e2e/shots/roles node e2e/role-matrix.mjs
          SHOTS_DIR=e2e/shots/insurance node e2e/insurance-flow.mjs
          node e2e/moderator-permission-check.mjs
          node e2e/admin-master-switch.mjs
          node e2e/staff-security.mjs
          node e2e/cabinet-navigation-audit.mjs
      - name: Снимки экранов каждой проверяемой версии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: e2e/shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Предрелизный отчёт — даже после ошибки
        if: always()
        run: |
          echo '### TrackSOS — контроль версии' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Проверены: Docker Compose, бэкапы, типы, сервер, веб, дизайн, браузер и офлайн.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Любая ошибка в шагах выше запрещает считать сборку готовой.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Скриншоты сохранены в screens, если браузер смог их создать.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ручные блокеры: VPS, SMS.ru, RuStore Push на физическом устройстве, юридические документы, платёжная схема.' >> "$GITHUB_STEP_SUMMARY"
      - name: Ночной итог проверки
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          echo '### Ночной контроль TrackSOS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Проверки HTML/CSS/JS, API, офлайн-режима и тестовых сценариев.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Снимки реальной веб-страницы находятся во вложении screens.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Этот процесс не меняет приложение и не публикует его в RuStore.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Время по Москве: 01:00; очередь GitHub может сдвинуть фактический запуск.' >> "$GITHUB_STEP_SUMMARY"
