name: Проверка

on:
  push:
    branches: [main, feature/vehicle-insurance-workflows]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: traksos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/traksos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Сервер — типы
        run: npm run typecheck
      - name: Сервер — тесты
        run: npm test
      - name: Веб — сборка
        run: npm -w web run build
      - name: Сквозной сценарий в браузере
        run: |
          npx playwright install --with-deps chromium
          psql -h 127.0.0.1 -U postgres -c 'create database traksos'
          DATABASE_URL=postgres://postgres@127.0.0.1:5432/traksos ADMIN_PHONES=+79990000001 npm -w server start &
          until curl -s localhost:8080/api/health >/dev/null; do sleep 1; done
          node e2e/flow.mjs e2e/shots
      - name: Снимки экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: e2e/shots
          if-no-files-found: ignore
