name: PR274 all 40 browser scenarios - collect failures
on:
  push:
    branches: ['ci-focus/pr274-remaining-20261124']
permissions:
  contents: read
concurrency:
  group: focused-pr274-remaining-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remaining-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: traksos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d traksos_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/traksos_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm -w web run build
      - name: Create verified disposable accounts and order history using real flow
        run: |
          npx playwright install --with-deps chromium
          psql -h 127.0.0.1 -U postgres -c 'create database traksos'
          TRAKSOS_LEGACY_CASH_FIXTURES=1 TRAKSOS_SHOP_FIXTURES=1 TRAKSOS_PAYMENT_FIXTURES=1 DATABASE_URL=postgres://postgres@127.0.0.1:5432/traksos ADMIN_PHONES=+79990000001 MODERATOR_PHONES=+79990000147 npm -w server start > /tmp/traksos-ci-server.log 2>&1 &
          bash scripts/ci-wait-health.sh "$!" /tmp/traksos-ci-server.log
          node e2e/flow.mjs e2e/shots
      - name: Continue remaining browser checks on the same disposable database
        run: |
          set -u
          mkdir -p e2e/shots
          results=e2e/shots/pr274-browser-results.tsv
          printf 'test\tstatus\texit_code\n' > "$results"
          passed=0; failed=0; timed_out=0
          run_case() {
            local name="$2" rc status
            echo "::group::$name"
            if timeout --kill-after=10s 240s "$@"; then
              rc=0; status=PASS; passed=$((passed+1))
            else
              rc=$?
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                status=TIMEOUT; timed_out=$((timed_out+1))
              else
                status=FAIL; failed=$((failed+1))
              fi
            fi
            echo '::endgroup::'
            printf '%s\t%s\t%s\n' "$name" "$status" "$rc" >> "$results"
            echo "RESULT $status $name (exit $rc)"
          }
          run_case node e2e/client-order-sections.mjs e2e/shots
          run_case node e2e/client-private-read-20261124.mjs
          run_case node e2e/client-account-switch-20261124.mjs
          run_case node e2e/performer-request-settings.mjs e2e/shots
          run_case node e2e/performer-profile-20261124.mjs
          run_case node e2e/performer-line-session-20261124.mjs
          run_case node e2e/ws-ticket-url.mjs
          run_case node e2e/admin-ops.mjs e2e/shots
          SHOTS_DIR=e2e/shots/roles run_case node e2e/role-matrix.mjs
          SHOTS_DIR=e2e/shots/insurance run_case node e2e/insurance-flow.mjs
          run_case node e2e/insurer-inspection-reliability-20261124.mjs
          run_case node e2e/admin-partner-finance-20261124.mjs
          run_case node e2e/admin-account-settings-20261124.mjs
          run_case node e2e/insurance-locked-ui.mjs
          run_case node e2e/offer-gate-role-ui.mjs
          run_case node e2e/offer-consent-guard.mjs
          run_case node e2e/economics-retry-20261124.mjs
          run_case node e2e/privacy-account-status-20261124.mjs
          run_case node e2e/moderator-permission-check.mjs
          run_case node e2e/moderator-workspace-tabs-20261124.mjs
          run_case node e2e/moderator-staff-route-20261124.mjs
          run_case node e2e/techbase-repair-hardening-20261124.mjs
          run_case node e2e/vehicle-service-history-20261124.mjs
          run_case node e2e/training-demo-kinds-20261124.mjs
          run_case node e2e/courier-offline-reliability-20261124.mjs
          run_case node e2e/ops-admin-reliability-20261124.mjs
          run_case node e2e/learning-role-hardening-20261124.mjs
          run_case node e2e/continuation-tour-role-20261124.mjs
          run_case node e2e/ecu-handoff-web-session-20261124.mjs
          run_case node e2e/roadside-map-gps-consent-20261124.mjs
          run_case node e2e/admin-master-switch.mjs
          run_case node e2e/staff-security.mjs
          run_case node e2e/cabinet-navigation-audit.mjs
          run_case node e2e/admin-navigation-ux.mjs
          run_case node e2e/cabinet-visual-sweep.mjs
          run_case node e2e/android-approved-workspaces.mjs
          run_case node e2e/cabinet-logout-and-shop.mjs
          run_case node e2e/approved-truck-hero.mjs
          run_case node e2e/visual-text-geometry.mjs
          run_case node e2e/preview-login.mjs
          echo "TOTAL: $passed PASS, $failed FAIL, $timed_out TIMEOUT"
          {
            echo '### PR274 — all 40 browser scenarios'
            echo "PASS: $passed / FAIL: $failed / TIMEOUT: $timed_out"
            echo '| Scenario | Result | Exit code |'
            echo '|---|---|---|'
            tail -n +2 "$results" | while IFS=$'\t' read -r name status rc; do
              printf '| %s | %s | %s |\n' "$name" "$status" "$rc"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          test "$((passed+failed+timed_out))" -eq 40
          test "$((failed+timed_out))" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-pr274-remaining-screenshots
          path: e2e/shots/
          if-no-files-found: ignore
