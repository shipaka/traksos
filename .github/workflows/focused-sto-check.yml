name: Focused remaining browser checks
on:
  push:
    branches: ['ci-focus/pr274-sto-20261124']
permissions:
  contents: read
concurrency:
  group: focused-sto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remaining-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: traksos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d traksos_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/traksos_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm -w web run build
      - name: Remaining browser checks after successful order flow
        run: |
          npx playwright install --with-deps chromium
          psql -h 127.0.0.1 -U postgres -c 'create database traksos'
          TRAKSOS_LEGACY_CASH_FIXTURES=1 TRAKSOS_SHOP_FIXTURES=1 TRAKSOS_PAYMENT_FIXTURES=1 DATABASE_URL=postgres://postgres@127.0.0.1:5432/traksos ADMIN_PHONES=+79990000001 MODERATOR_PHONES=+79990000147 npm -w server start > /tmp/traksos-ci-server.log 2>&1 &
          bash scripts/ci-wait-health.sh "$!" /tmp/traksos-ci-server.log
          set -x
          node e2e/sos-regional-pricing.mjs e2e/shots
          node e2e/archived-order-chat.mjs e2e/shots
          node e2e/client-order-sections.mjs e2e/shots
          # Verified production private-read hook, real customer account-switch UI and order chat.
          node e2e/client-private-read-20261124.mjs
          node e2e/client-account-switch-20261124.mjs
          node e2e/client-order-chat-20261124.mjs
          node e2e/performer-request-settings.mjs e2e/shots
          # Real performer React profile: same-route account isolation, schedule/finance and form contracts.
          node e2e/performer-profile-20261124.mjs
          # An unverified desktop master can work; old GPS sessions cannot leak.
          node e2e/performer-line-session-20261124.mjs
          node e2e/ws-ticket-url.mjs
          node e2e/admin-ops.mjs e2e/shots
          SHOTS_DIR=e2e/shots/roles node e2e/role-matrix.mjs
          SHOTS_DIR=e2e/shots/insurance node e2e/insurance-flow.mjs
          node e2e/insurer-inspection-reliability-20261124.mjs
          node e2e/admin-partner-finance-20261124.mjs
          node e2e/admin-account-settings-20261124.mjs
          node e2e/insurance-locked-ui.mjs
          # Mixed-role admin must not be covered by an inactive client offer.
          node e2e/offer-gate-role-ui.mjs
          # No consent while legal text is pending, failed or mismatched.
          node e2e/offer-consent-guard.mjs
          node e2e/economics-retry-20261124.mjs
          # Personal data/deletion actions must not leak across account changes.
          node e2e/privacy-account-status-20261124.mjs
          node e2e/moderator-permission-check.mjs
          # Real moderator React queues: deep-link tabs, mobile deduplication, staff rights.
          node e2e/moderator-workspace-tabs-20261124.mjs
          node e2e/moderator-staff-route-20261124.mjs
          node e2e/techbase-repair-hardening-20261124.mjs
          node e2e/vehicle-service-history-20261124.mjs
          # Real read-only role switching, courier training and per-account course progress.
          # Pure read-only courier/inspection training model and every role transition.
          node e2e/training-demo-kinds-20261124.mjs
          # Actual courier React: network retry, delivery-id/session isolation, no real writes.
          node e2e/courier-offline-reliability-20261124.mjs
          # Real admin demand, SLA, notices and worker discounts under failures/account changes.
          node e2e/ops-admin-reliability-20261124.mjs
          node e2e/learning-role-hardening-20261124.mjs
          node e2e/continuation-tour-role-20261124.mjs
          node e2e/ecu-handoff-web-session-20261124.mjs
          node e2e/roadside-map-gps-consent-20261124.mjs
          node e2e/admin-master-switch.mjs
          node e2e/staff-security.mjs
          node e2e/cabinet-navigation-audit.mjs
          node e2e/admin-navigation-ux.mjs
          node e2e/cabinet-visual-sweep.mjs
          node e2e/android-approved-workspaces.mjs
          node e2e/cabinet-logout-and-shop.mjs
          node e2e/approved-truck-hero.mjs
          node e2e/visual-text-geometry.mjs
          node e2e/preview-login.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-remaining-browser-screenshots
          path: e2e/shots/
          if-no-files-found: ignore
