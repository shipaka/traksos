name: Focused auth session browser check
on:
  push:
    branches: ['ci-focus/pr274-sto-20261124']
permissions:
  contents: read
concurrency:
  group: focused-sto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Isolated login session regression
        run: node e2e/auth-session-transition-hardening-20261124.mjs
