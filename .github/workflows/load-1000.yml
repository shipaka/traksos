name: Backend mixed-role load (1000 users)

# Run only when the dedicated scenario changes, or explicitly by operator.
# Do not add 1000-user load to every small PR/CI cycle.
on:
  pull_request:
    paths:
      - 'scripts/load-mixed-1000.mjs'
      - '.github/workflows/load-1000.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-1000-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mixed-load-1000:
    name: 1000 accounts / disposable PostgreSQL / no production writes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/traksos_load_1000
      PGPASSWORD: postgres
      CHECKPOINT_EVIDENCE_API_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies once
        run: npm install --no-audit --no-fund
      - name: Create isolated test database
        run: psql -h 127.0.0.1 -U postgres -c "create database traksos_load_1000"
      - name: Exactly 1000 accounts and mixed-role HTTP/PostgreSQL scenario
        run: node --import tsx scripts/load-mixed-1000.mjs
      - name: Upload anonymous latency and consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mixed-1000-report
          path: test-results/load-mixed-1000.json
          if-no-files-found: ignore
          retention-days: 14
