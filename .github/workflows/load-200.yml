name: Backend mixed-role load (200 users)

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/load-mixed-200.mjs'
      - '.github/workflows/load-200.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-load:
    name: 200 accounts / isolated PostgreSQL / no production writes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/traksos_load_test
      PGPASSWORD: postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Create disposable test database
        run: psql -h 127.0.0.1 -U postgres -c "create database traksos_load_test"
      - name: Exactly 200 real isolated accounts and mixed simultaneous workflows
        run: node --import tsx scripts/load-mixed-200.mjs
      - name: Upload latency and consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mixed-200-report
          path: test-results/load-mixed-200.json
          if-no-files-found: ignore
          retention-days: 14
