name: Mini Diagnostic Android demo
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'mini-diagnostic/**'
      - '.github/workflows/mini-diagnostic-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mini-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Test and assemble isolated debug APK
        working-directory: mini-diagnostic
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: traksos-mini-diagnostic-demo
          path: mini-diagnostic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  bench-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned tool
        run: python -m pip install platformio==6.1.18
      - name: Test offline CAN trace inspector
        working-directory: mini-diagnostic
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Test portable firmware state machine
        working-directory: mini-diagnostic/firmware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -Iinclude tools/test_bench_engine.cpp -o /tmp/traksos-bench-tests
          /tmp/traksos-bench-tests
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic -Iinclude tools/test_interface_guard.cpp -o /tmp/traksos-interface-tests
          /tmp/traksos-interface-tests
      - name: Build USB-only BLE bench firmware
        working-directory: mini-diagnostic/firmware
        run: pio run -e esp32_bench_ble
      - name: Package full factory image and Windows flash helper
        working-directory: mini-diagnostic/firmware
        run: |
          python -m pip install esptool==4.8.1
          python tools/package_bench.py
          python -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: traksos-mini-esp32-bench-ble
          path: mini-diagnostic/firmware/dist/
          if-no-files-found: error
          retention-days: 7
