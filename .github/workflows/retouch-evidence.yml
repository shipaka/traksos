name: Точная ретушь утверждённой фуры — до и после

on:
  push:
    branches: [fix/approved-truck-local-retouch-20261122]
  pull_request:
    paths:
      - 'scripts/retouch-approved-truck.py'
      - 'web/public/tracksos-approved-hero-owner-20261119.webp'
      - '.github/workflows/retouch-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precise-truck-retouch-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact original artwork
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools for local-only audited retouch
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Generate locally masked candidate images
        run: |
          python scripts/retouch-approved-truck.py
          python scripts/retouch-approved-pc-badges.py
      - name: Commit selected pixel-local retouch to the REVIEW branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/approved-truck-local-retouch-20261122'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/tracksos-approved-hero-owner-20261119-retouched.webp \
            web/public/owner20-photo-background-approved-retouched.webp \
            web/public/owner20-artwork-sprite-retouched.webp \
            android/app/src/main/res/drawable-nodpi/splash_truck.webp
          if git diff --cached --quiet; then
            echo "Review artifact already committed; nothing to push."
          else
            git commit -m "asset(retouch): locally restore grille on exact approved photo, keep TrakSOS trailer"
            git push origin HEAD:fix/approved-truck-local-retouch-20261122
          fi
      - name: Save the real original, candidates, 4x crops and difference masks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-truck-local-retouch-review
          path: |
            e2e/shots/approved-truck-retouch/*
            e2e/shots/approved-pc-badge-retouch/*
          if-no-files-found: error
          retention-days: 14
      - name: Do not silently publish before owner review
        if: always()
        run: |
          echo "### Approved TrakSOS art — localized grille emblem retouch" >> "$GITHUB_STEP_SUMMARY"
          echo "The exact original 617 PC atlas and hero are unchanged except two maker badges each." >> "$GITHUB_STEP_SUMMARY"
          echo "The 19 Nov original scene is unchanged except masked maker lettering pixels." >> "$GITHUB_STEP_SUMMARY"
          echo "TrakSOS on the trailer remains. No whole-image regeneration or new truck." >> "$GITHUB_STEP_SUMMARY"
          echo "This run emits review candidates only; no production image is replaced." >> "$GITHUB_STEP_SUMMARY"
