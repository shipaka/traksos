name: TrakSOS — проверка безопасности релизного workflow
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-vps-manual.yml'
      - '.github/workflows/vps-release-guard.yml'
      - 'scripts/verify-vps-release-workflow.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check YAML syntax, shell syntax and production release guarantees
        run: node scripts/verify-vps-release-workflow.mjs
