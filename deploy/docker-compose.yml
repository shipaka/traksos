# Запуск на сервере в России (152-ФЗ):
#   1. скопировать .env.example в .env и заполнить
#   2. docker compose up -d
# Caddy сам получает HTTPS-сертификат для домена из DOMAIN.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traksos
      POSTGRES_USER: traksos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traksos"]
      interval: 5s
      retries: 10

  app:
    image: ghcr.io/shipaka/traksos:latest
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://traksos:${DB_PASSWORD}@db:5432/traksos
      PUBLIC_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]

  # Daily verified custom-format PostgreSQL dump; restore must be tested separately.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/traksos-backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/traksos-backup.sh"]

volumes:
  db:
  caddy:
