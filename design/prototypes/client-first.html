'?'master':state.service==='tow'?'tow':'sto')}" alt="Фотография выбранного направления" style="width:100%;height:195px;object-fit:cover;border-radius:13px;margin-bottom:12px"><div class="card-title">Удобство в деталях</div><div class="meta">На телефоне направление, машина и адрес идут последовательно. На ПК форма и справка расположены рядом. SOS всегда возвращает пользователя к текущей заявке.</div></div></aside></div>`}
  function air(){return heading('Сообщество водителей · проект','Эфир TrakSOS','Бесплатное пространство для водителей. Город и маршрут выбираются добровольно.',sampleLabel())+
    `<div class="card card-pad air-hero"><img src="${photo('efir')}" alt="Рация в кабине грузовика на дороге"><div><div class="eyebrow">${I('radio',15)} Жизнь в дороге</div><h2 style="margin:5px 0 9px">Общайтесь по пути</h2><p class="meta">Советы коллег, городские комнаты, сообщения о маршрутах. Публичные координаты водителя не показываются.</p><span class="soft-status blue">Демо: без настоящих сообщений</span></div></div><div class="section-head"><h2>Комнаты по интересам</h2></div><div class="stack">${rooms.map(([name,desc],i)=>`<button class="room-row" data-room="${i}"><span class="room-ico">${I(i===1?'map':'radio')}</span><span class="room-info"><strong>${name}</strong><small>${desc}</small></span>${I('chevron')}</button>`).join('')}</div><div class="notice" style="margin-top:14px">За рулём не пишите сообщения. Здесь нет фиктивных участников, «онлайн» и дорожных предупреждений: реальные данные появятся только после подключения и проверки сообщества.</div>`}
  function room(){const r=rooms[Number(state.airRoom)]||rooms[0];const chatList=state.airMessages[r[0]]||[];return `<button class="back" data-go="air">${I('back',17)} Эфир</button>`+heading('Комната Эфира',r[0],r[1],sampleLabel())+`<div class="detail-layout"><section class="card card-pad"><div class="card-title">Лента сообщений</div>${chatList.length?`<div class="stack">${chatList.map(x=>`<div class="bubble self">${E(x)}</div>`).join('')}</div>`:`<div class="placeholder">${I('radio',32)}<strong>В демо-ленте пока пусто</strong><span class="meta">Здесь будут сообщения реальных водителей после запуска и модерации.</span></div>`}<form id="air-form" style="display:flex;gap:8px;margin-top:14px"><input class="input" name="message" maxlength="500" placeholder="Демосообщение — сохраняется только на экране" aria-label="Демосообщение"/><button class="btn" type="submit">${I('arrow',18)}</button></form></section><aside class="card card-pad" style="align-self:start"><div class="card-title">Безопасность и правила</div><p class="meta">Псевдоним вместо телефона. Жалобы и модерация. Нет автоматической публикации GPS и маршрута. Не используйте чат во время управления автомобилем.</p></aside></div>`}
  function vehicle(){return heading('Моя техника','Транспорт','В личном кабинете данные берутся из привязанного к вам автомобиля или автопарка.',sampleLabel())+`<div class="card card-pad" style="max-width:700px"><div class="vehicle"><img class="vehicle-image" style="width:160px;height:115px" src="${photo('highway')}" alt="Фото-иллюстрация грузовика"><div class="vehicle-content"><div class="eyebrow">Пример заполнения</div><strong>Renault Premium · 2010</strong><div class="meta">Данные не привязаны к аккаунту — это демонстрация оформления.</div><button class="btn secondary" data-go="new" style="margin-top:12px">Создать заявку для этой машины</button></div></div></div>`}
  function services(){return heading('Сервисы TrakSOS','Помощь, работа и сервисы','Здесь собраны направления, но их доступность зависит от региона и этапа запуска.')+`<section class="service-grid">${categories.map(([id,title,caption,img])=>`<button class="service" data-service="${id}"><img class="service-media" src="${photo(img)}" alt="${title}"><span class="service-body"><span class="service-name">${title}</span><span class="service-caption">${caption}</span></span></button>`).join('')}</section><div class="section-head"><h2>Другие направления</h2></div><section class="secondary-grid"><button class="module" data-go="insurance"><img src="${photo('insurance')}" alt="Специалист по страхованию"><span><strong>Страхование</strong><small>Оформление заявок на полисы</small></span></button><button class="module" data-go="parts"><img src="${photo('parts')}" alt="Запчасти"><span><strong>Запчасти</strong><small>Магазин пока закрыт</small></span></button><button class="module" data-go="air"><img src="${photo('efir')}" alt="Рация"><span><strong>Эфир</strong><small>Бесплатное сообщество водителей</small></span></button></section>`}
  function infoPage(title,desc,action){return heading('Единая экосистема TrakSOS',title,desc)+`<div class="card card-pad" style="max-width:740px"><div class="placeholder">${I('book',32)}<strong>${title}</strong><span class="meta">${desc}</span>${action||''}</div></div>`}
  function menu(){return heading('Личный кабинет','Все разделы','Редкие действия не перегружают главный рабочий экран.')+`<div class="stack">${[
    ['vehicle','Транспорт и парк','truck'],['insurance','Страхование и ТО','shield'],['parts','Запчасти · магазин закрыт','package'],['history','История и документы','file'],['air','Водительский Эфир','radio'],['ecu-desk','Предпросмотр: кабинет ЭБУ (демо)','cpu'],['settings','Настройки и безопасность','settings']
  ].map(([go,label,ico])=>`<button class="room-row" data-go="${go}"><span class="room-ico">${I(ico)}</span><span class="room-info"><strong>${label}</strong></span>${I('chevron')}</button>`).join('')}</div>`}
  function modal(kind){let body='';if(kind==='profile')body=`<div class="stack"><p class="meta">Это открытый интерактивный макет, без реальной авторизации.</p><button class="btn ghost full" data-popup="none">Закрыть</button></div>`;
    else if(kind==='region')body=`<p class="meta">TrakSOS позиционируется как федеральная экосистема, но услуги и тарифы запускаются по регионам.</p><div class="notice">Действующий расчёт выездов пока привязан к Санкт-Петербургу и Ленинградской области. Магазин запчастей на старте доступен только в СПб и пока закрыт.</div>`;
    else body=`<div class="placeholder" style="min-height:120px">${I('bell',28)}<strong>Уведомления в демо не подключены</strong></div>`;
    return `<div class="modal-back" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${E(kind)}"><div class="modal-top"><h2>${kind==='region'?'Выбор региона':kind==='profile'?'Профиль':'Уведомления'}</h2><button class="modal-close" data-popup="none" aria-label="Закрыть">${I('cross')}</button></div>${body}</div></div>`}
  function render(){let page;
    switch(state.route){case 'home':page=home();break;case 'new':page=newOrder();break;case 'orders':page=orders();break;case 'order':page=order();break;case 'air':page=air();break;case 'room':page=room();break;case 'vehicle':page=vehicle();break;case 'services':page=services();break;case 'menu':page=menu();break;case 'ecu-desk':page=ecuDesk();break;case 'ecu-add':page=ecuAdditional();break;case 'ecu-order':page=ecuOrder();break;case 'consult':page=infoPage('Консультация','Отдельный запрос на консультацию специалиста. В прототипе нет реального звонка или оплаты.');break;case 'insurance':page=infoPage('Страхование и техосмотр','Отдельный раздел страховых заявок и документов — без обещаний готового полиса.',`<button class="btn ghost" data-go="home">На главную</button>`);break;case 'parts':page=infoPage('Запчасти','Магазин пока закрыт. Цены и наличие не показываются без подтверждённого поставщика.');break;case 'history':page=infoPage('История и документы','Здесь будут записи о ремонтах, заявках и документах с разрешённым доступом.');break;case 'settings':page=infoPage('Настройки','Будущие параметры безопасности, уведомлений и доступа. PIN и биометрия — отдельный этап тестирования.');break;default:page=home()}
    document.getElementById('app').innerHTML=shell(page);
  }
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-go],[data-context],[data-popup],[data-room],[data-service],[data-service-pick],[data-tab],[data-action],[data-backdrop],[data-master-spec]');if(!el)return;
    if(el.dataset.go){navigate(el.dataset.go);return}
    if(el.dataset.context){state.context=el.dataset.context;render();return}
    if(el.dataset.popup){state.popup=el.dataset.popup==='none'?null:el.dataset.popup;render();return}
    if(el.dataset.backdrop&&!e.target.closest('.modal')){state.popup=null;render();return}
    if(el.dataset.room){state.airRoom=el.dataset.room;navigate('room');return}
    if(el.dataset.service){if(el.dataset.service==='consult'){navigate('consult');}else{state.service=el.dataset.service;navigate('new')}return}
    if(el.dataset.masterSpec){state.masterSpec=el.dataset.masterSpec;const loc=document.querySelector('[name="location"]');if(loc)state.location=loc.value;const desc=document.querySelector('[name="description"]');if(desc)state.description=desc.value;render();return}
    if(el.dataset.servicePick){state.service=el.dataset.servicePick;const loc=document.querySelector('[name="location"]');if(loc)state.location=loc.value;const desc=document.querySelector('[name="description"]');if(desc)state.description=desc.value;render();return}
    if(el.dataset.tab){state.orderTab=el.dataset.tab;render();return}
    if(el.dataset.action==='ecu-recommend'){if(state.primarySpec==='ecu'){toast('Специалист ЭБУ уже выбран в основной заявке');return}if(state.ecuOrderExists){toast('ЭБУ уже добавлен отдельной заявкой');return}state.ecuReferral='pending';toast('Демо: мастер рекомендовал ЭБУ; решение принимает клиент');return}
    if(el.dataset.action==='ecu-decline'){state.ecuReferral='declined';toast('Рекомендация отклонена: заказ ЭБУ не создан');return}
    if(el.dataset.action==='ecu-demo-stage'){state.ecuStage=(state.ecuStage+1)%5;toast('Отдельная заявка ЭБУ: '+ecuStatusName());return}
    if(el.dataset.action==='ecu-online'){state.ecuOnline=!state.ecuOnline;render();return}
    if(el.dataset.action==='demo-stage'){state.stage=(state.stage+1)%5;toast(`Демонстрация этапа: ${statusName()}`);return}
    if(el.dataset.action==='reset-order'){state.stage=0;state.chat=[];state.ecuReferral='none';state.ecuOrderExists=false;state.ecuStage=0;toast('Демонстрационный сценарий начат заново');return}
  });
  document.addEventListener('submit',e=>{
    if(e.target.id==='sos-form'){e.preventDefault();const f=new FormData(e.target);state.location=String(f.get('location')||'').trim();state.description=String(f.get('description')||'').trim();if(!state.location||!state.description){toast('Заполните местоположение и описание');return}state.hasOrder=true;state.stage=0;state.activeNumber='DEMO-1042';state.primarySpec=state.service==='master'?state.masterSpec:'other';state.ecuReferral='none';state.ecuOrderExists=false;navigate('order');return}
    if(e.target.id==='ecu-add-form'){e.preventDefault();const note=String(new FormData(e.target).get('reason')||'').trim();if(note.length<20){toast('Укажите причину дополнительной диагностики');return}state.ecuOrderExists=true;state.ecuReferral='accepted';state.ecuStage=0;navigate('ecu-order');return}
    if(e.target.id==='chat-form'){e.preventDefault();const text=String(new FormData(e.target).get('message')||'').trim();if(!text)return;state.chat.push(text);state.orderTab='chat';render();return}
    if(e.target.id==='air-form'){e.preventDefault();const t=String(new FormData(e.target).get('message')||'').trim();if(!t)return;const r=rooms[Number(state.airRoom)]||rooms[0];(state.airMessages[r[0]]||=[]).push(t);render();return}
  });
  render();
})();
</script></body></html>
