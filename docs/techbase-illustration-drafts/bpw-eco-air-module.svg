<text x="40" y="532" font-size="20" font-weight="700">Назначение и границы применимости</text>
<text x="40" y="559" font-size="17" fill="#d7e2ec">Ось несёт колёса; продольный рычаг направляет её перемещение; пневморессора</text>
<text x="40" y="582" font-size="17" fill="#d7e2ec">поддерживает раму. Показана общая взаимосвязь, а не реальные размеры или крепёж.</text>
<text x="40" y="618" font-size="16" fill="#f0cd87">Черновик · экспертная проверка не пройдена · не руководство по ремонту.</text>
<text x="40" y="642" font-size="15" fill="#afc3d5">Артикул, ревизию, моменты затяжки и применимость сверять по маркировке оси и документации BPW.</text>
