<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d">
<title id="t">BPW ECO Air — модуль пневмоподвески прицепа</title>
<desc id="d">Авторская условная иллюстрация взаимного расположения круглой балки оси, продольного рычага и опоры пневморессоры. Не монтажный чертёж и не подтверждение применимости.</desc>
