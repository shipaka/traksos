xt><rect x="0" y="720" width="1440" height="60" rx="0" fill="#15263e" stroke="none" stroke-width="3"/><text x="720" y="758" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" fill="white">ФУНКЦИОНАЛЬНЫЙ ЧЕРНОВИК • Не руководство по монтажу или ремонту • Требуется проверка</text></svg>