<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img"><title>Endurant XD · Температурные пределы</title><desc>TRIG0960 · стр. 4 · параметры температуры масла; Это ограничения производителя для XD Series, не универсальные диагностические пороги.</desc><metadata>Original TrakSOS editable vector draft. Source: https://www.eatoncummins.com/content/dam/eaton-cummins/products/endurant-xd/endurant-xd-series-automated-transmissions-TRIG0960.pdf. Not OEM drawing. Publication HOLD.</metadata><defs><linearGradient id="metal"><stop offset="0" stop-color="#8da8b8"/><stop offset=".5" stop-color="#f1f6f8"/><stop offset="1" stop-color="#90a9b6"/></linearGradient></defs><g font-family="Arial, sans-serif"><rect width="1200" height="760" fill="#f4f8fa"/><rect width="1200" height="115" fill="#172e3c"/><text x="35" y="46" font-size="31" fill="#fff" font-weight="700" text-anchor="start">Endurant XD · Температурные пределы</text><text x="35" y="82" font-size="18" fill="#c5dce6" font-weight="500" text-anchor="start">TRIG0960 · стр. 4 · параметры температуры масла</text><text x="1165" y="46" font-size="24" fill="#ffb260" font-weight="700" text-anchor="end">TrakSOS</text><rect x="35" y="145" width="1130" height="480" rx="15" fill="#fff" stroke="#d0dfe6" stroke-width="2"/><text x="600" y="191" font-size="25" fill="#243b49" font-weight="600" text-anchor="middle">Масло трансмиссии · °C</text><rect x="120" y="260" width="725" height="65" rx="4" fill="#c9e1d8" stroke="#7ba08f" stroke-width="2"/><rect x="845" y="260" width="126" height="65" rx="2" fill="#f3d7a5" stroke="#c4964d" stroke-width="2"/><rect x="971" y="260" width="99" height="65" rx="2" fill="#e7b7b2" stroke="#b77570" stroke-width="2"/><path d="M845 245V340" fill="none" stroke="#405c6b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="845" y="368" font-size="22" fill="#243b49" font-weight="600" text-anchor="middle">121</text><path d="M971 245V340" fill="none" stroke="#405c6b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="971" y="368" font-size="22" fill="#243b49" font-weight="600" text-anchor="middle">135</text><text x="120" y="235" font-size="21" fill="#366c57" font-weight="700" text-anchor="start">Длительная работа до 121 °C</text><text x="1055" y="235" font-size="20" fill="#9e4039" font-weight="700" text-anchor="end">>135 °C</text><text x="600" y="413" font-size="20" fill="#243b49" font-weight="600" text-anchor="middle">121–135 °C: менее 1% общего времени работы и не более 30 мин подряд.</text><text x="600" y="448" font-size="21" fill="#9e4039" font-weight="700" text-anchor="middle">Выше 135 °C эксплуатация запрещена производителем.</text><rect x="120" y="492" width="950" height="87" rx="8" fill="#e3edf2" stroke="#b4ccd8" stroke-width="2"/><text x="145" y="525" font-size="21" fill="#243b49" font-weight="700" text-anchor="start">Электрические и пневматические компоненты</text><text x="145" y="557" font-size="20" fill="#243b49" font-weight="500" text-anchor="start">Предел 105 °C · отдельное требование к тепловой защите.</text><g opacity=".07" transform="translate(600 414) rotate(-22)"><text x="0" y="0" font-size="90" fill="#172e3c" font-weight="700" text-anchor="middle">TrakSOS</text></g><rect x="30" y="662" width="1140" height="70" rx="9" fill="#fff0dc" stroke="#e4d0b2" stroke-width="2"/><text x="48" y="688" font-size="19" fill="#895410" font-weight="700" text-anchor="start">ЧЕРНОВИК · функциональная иллюстрация</text><text x="48" y="714" font-size="16" fill="#895410" font-weight="500" text-anchor="start">Это ограничения производителя для XD Series, не универсальные диагностические пороги.</text></g></svg>