<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="794" viewBox="0 0 1000 794" role="img" aria-labelledby="t d"><title id="t">Actros — модуляторы EBS передней и задней оси</title><desc id="d">Оригинальная условная функциональная иллюстрация, без монтажных сведений.</desc><rect width="1000" height="794" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="35" y="40" font-size="18" fill="#7dd3fc">TrakSOS · EBS / ABS · Mercedes-Benz</text><text x="35" y="80" font-size="27" font-weight="700">Actros — модуляторы EBS передней и задней оси</text><text x="35" y="111" font-size="17">Actros Euro 5/6 — семейство OM470 / 471 / 473 / 936 по каталогу TRP</text><rect x="35" y="133" width="930" height="323" rx="14" fill="#192f45" stroke="#51677b"/><g transform="translate(0 0)"><rect x="224" y="183" width="552" height="235" rx="22" fill="#253c4d" stroke="#607d92" stroke-width="3"/><path d="M318 183 V146 H424 V183 M278 245 H722 M278 360 H722" stroke="#8ba9ba" stroke-width="13" fill="none"/><g fill="#152b3d" stroke="#9cbdcd" stroke-width="3"><rect x="280" y="210" width="60" height="66" rx="10"/><rect x="280" y="325" width="60" height="66" rx="10"/><rect x="660" y="210" width="60" height="66" rx="10"/><rect x="660" y="325" width="60" height="66" rx="10"/></g><g id="h-K102408N50" data-article="K102408N50"><rect x="365" y="197" width="270" height="85" rx="12" fill="#26465c" stroke="#79a9c1" stroke-width="2"/><text x="500" y="231" text-anchor="middle" font-size="18" font-weight="700">Передний модулятор</text><text x="500" y="257" text-anchor="middle" font-size="15" fill="#b8d4e1">K102408N50</text></g><g id="h-K102407N50" data-article="K102407N50"><rect x="365" y="312" width="270" height="85" rx="12" fill="#26465c" stroke="#79a9c1" stroke-width="2"/><text x="500" y="346" text-anchor="middle" font-size="18" font-weight="700">Задний модулятор</text><text x="500" y="372" text-anchor="middle" font-size="15" fill="#b8d4e1">K102407N50</text></g><text x="500" y="4