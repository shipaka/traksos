ont-size="16">Передаёт запрос торможения; устройство, контакты и пневматические выходы не показаны.</text><text x="35" y="661" font-size="16">Источник: TRP, каталог Mercedes Actros Euro 5/6, страница 3.</text><text x="35" y="693" font-size="16">Не подтверждена комплектация отдельного VIN; артикулы сверить перед заказом.</text><text x="35" y="725" font-size="16" fill="#f1c87e">Черновик · не монтажная схема · экспертная проверка обязательна</text></g></svg>