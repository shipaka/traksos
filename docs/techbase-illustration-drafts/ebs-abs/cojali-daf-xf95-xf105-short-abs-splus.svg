<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="t d"><title id="t">DAF XF 95 / XF 105 — короткий угловой датчик ABS S+</title><desc id="d">Условный оригинальный рисунок кабельного датчика с двумя каталожными вариантами, без точной геометрии разъёма.</desc><rect width="1080" height="750" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="35" y="43" font-size="18" fill="#7dd3fc">TrakSOS · EBS / ABS · DAF</text><text x="35" y="84" font-size="29" font-weight="700">XF 95 / XF 105 — угловой датчик скорости колеса S+</text><text x="35" y="112" font-size="17" fill="#c5d7e3">Также CF 65/75/85 и LF55 IV — согласно каталогу Cojali</text><rect x="35" y="137" width="1010" height="340" rx="14" fill="#1c3348" stroke="#51677b"/><g transform="translate(107 203)"><path d="M135 85 H265 Q305 85 305 125 Q305 170 355 170 H705" stroke="#a8b9c7" stroke-width="13" fill="none" stroke-linecap="round"/><rect x="50" y="82" width="73" height="143" rx="9" fill="#95acbc" stroke="#d8e7ed" stroke-width="3"/><ellipse cx="86.5" cy="225" rx="36" ry="10" fill="#5b7589"/><path d="M45 57 H130 Q150 57 150 77 V102 H45Z" fill="#496579" stroke="#adc5d4" stroke-width="3"/><path d="M710 146 H790 Q807 146 807 163 V188 H710Z" fill="#587284" stroke="#c0d1db" stroke-width="3"/><path d="M86 48 V19 H205" fill="none" stroke="#7dd3fc" stroke-width="2"/><text x="214" y="24" font-size="18">Угловой вывод</text><path d="M340 138 V107 H567" stroke="#7dd3fc" stroke-width="2" fill="none"/><text x="572" y="112" font-size="18">Кабель 230 мм</text><text x="756" y="219" font-size="17" text-anchor="middle">2 контакта*</text><text x="86" y="258" font-size="17" text-anchor="middle">Чувствительный элемент</text></g><g id="h-2260053" data-article="2260053"><rect x="35" y="494" width="493" height="106" rx="12" fill="#243f55" stroke="#688ca2"/><text x="54" y="527" font-size="22" fill="#7dd3fc" font-weight="700">COJALI 2260053</text><text x="54" y="557" font-size="17">Основная ссылка WABCO: 4410328780</text><text x="54" y="581" font-size="17">Каталожный кросс DAF: 1361393</text></g><g id="h-2260038" data-article="2260038"><rect x="545" y="494" width="500" height="106" rx="12" fill="#243f55" stroke="#688ca2"/><text x="564" y="527" font-size="22" fill="#7dd3fc" font-weight="700">COJALI 2260038</text><text x="564" y="557" font-size="17">Основная ссылка WABCO: 4410321720</text><text x="564" y="581" font-size="17">Каталожные кроссы DAF — в карточке</text></g><text x="35" y="632" font-size="17">*Число контактов из каталога; назначение контактов не показано.</text><text x="35" y="660" font-size="17">Рисунок условный. Совпадение параметров не подтверждает взаимозаменяемость.</text><text x="35" y="710" font-size="16" fill="#f1c87e">Черновик · подбор по VIN и экспертная проверка обязательны · не инструкция по ремонту</text></g></svg>