<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="685" viewBox="0 0 1080 685" role="img" aria-labelledby="t d"><title id="t">IVECO / DAF — удлинитель датчика ABS</title><desc id="d">Авторская сравнительная техническая иллюстрация каталожных вариантов, без точной монтажной геометрии.</desc><rect width="1080" height="685" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="35" y="42" font-size="18" fill="#7dd3fc">TrakSOS · EBS / ABS · COJALI</text><text x="35" y="81" font-size="30" font-weight="700">IVECO / DAF — удлинитель датчика ABS</text><text x="35" y="111" font-size="17" fill="#c5d7e3">AD Stralis / AD Trakker · DAF XF 95 / XF 105 / CF 65/75/85</text><rect x="35" y="137" width="1010" height="292" rx="14" fill="#1c3348" stroke="#51677b"/><g id="illustration-cable"><path d="M190 270 H260 C306 270 306 188 360 188 H634 C682 188 682 350 732 350 H792 C830 350 830 270 870 270" stroke="#a8bfce" stroke-width="15" fill="none" stroke-linecap="round"/><rect x="62" y="240" width="128" height="62" rx="11" fill="#4c687d" stroke="#b6cddd" stroke-width="3"/><path d="M62 249 H42 V292 H62" fill="#263d51" stroke="#b6cddd" stroke-width="3"/><rect x="870" y="240" width="128" height="62" rx="11" fill="#4c687d" stroke="#b6cddd" stroke-width="3"/><path d="M998 251 H1017 V291 H998" fill="#96afc1" stroke="#b6cddd" stroke-width="3"/><text x="126" y="219" text-anchor="middle" font-size="18">Гнездо, 2 контакта</text><text x="934" y="219" text-anchor="middle" font-size="18">Штекер, 2 контакта</text><path d="M204 392 H854 M204 382 V402 M854 382 V402" stroke="#7dd3fc" stroke-width="2"/><text x="529" y="383" text-anchor="middle" font-size="20" fill="#7dd3fc">157 15/32″ (около 4 м)</text><text x="529" y="162" text-anchor="middle" font-size="19">Удлинитель цепи датчика скорости</text></g><g id="h-2260117" data-article="2260117"><rect x="35" y="445" width="1010" height="76" rx="10" fill="#20394d" stroke="#597b90"/><text x="53" y="473" font-size="22" font-weight="700" fill="#7dd3fc">COJALI 2260117</text><text x="303" y="472" font-size="17">WABCO 4497120400</text><text x="590" y="472" font-size="17">IVECO 5801110953</text><text x="53" y="501" font-size="16">Удлинитель · гнездо / штекер · 157 15/32 inch · DAF 867636</text></g><text x="35" y="577" font-size="16">Одна карточка для перечисленных применений. Не указаны трассировка кабеля, пины и конкретный VIN.</text><text x="35" y="609" font-size="16">Каталожные номера не подтверждают взаимозаменяемость; подбор по VIN обязателен.</text><text x="35" y="650" font-size="16" fill="#f1c87e">Черновик · не OEM-чертёж · экспертная проверка обязательна</text></g></svg>