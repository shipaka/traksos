<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="855" viewBox="0 0 1080 855" role="img" aria-labelledby="t d"><title id="t">IVECO Stralis — варианты датчиков ABS S+</title><desc id="d">Авторская сравнительная техническая иллюстрация каталожных вариантов, без точной монтажной геометрии.</desc><rect width="1080" height="855" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="35" y="42" font-size="18" fill="#7dd3fc">TrakSOS · EBS / ABS · COJALI</text><text x="35" y="81" font-size="30" font-weight="700">IVECO Stralis — варианты датчиков ABS S+</text><text x="35" y="111" font-size="17" fill="#c5d7e3">Прямые с гнездом и угловой со штекером · отдельные каталожные исполнения</text><rect x="35" y="137" width="1010" height="292" rx="14" fill="#1c3348" stroke="#51677b"/><g transform="translate(55 155)"><text x="15" y="30" font-size="21" font-weight="700">Прямое исполнение</text><rect x="17" y="64" width="138" height="51" rx="15" fill="#9db4c5" stroke="#d1e3ee" stroke-width="3"/><rect x="137" y="57" width="58" height="65" rx="9" fill="#536c81" stroke="#a9c3d3" stroke-width="3"/><path d="M195 89 H262 Q295 89 295 125 Q295 160 331 160 H385" stroke="#b3c3cc" stroke-width="12" fill="none" stroke-linecap="round"/><rect x="385" y="137" width="72" height="47" rx="8" fill="#526e80" stroke="#aac2d1" stroke-width="3"/><path d="M457 148 H476 V173 H457" stroke="#aac2d1" stroke-width="3" fill="#263e51"/><text x="420" y="206" font-size="16" text-anchor="middle">Гнездо*</text><path d="M80 124 V167 H125" stroke="#7dd3fc" stroke-width="2" fill="none"/><text x="130" y="173" font-size="16">98 7/16″</text></g><path d="M540 149 V411" stroke="#6f8a9d" stroke-width="2"/><g transform="translate(555 155)"><text x="15" y="30" font-size="21" font-weight="700">Угловое исполнение</text><rect x="51" y="86" width="57" height="121" rx="10" fill="#9db4c5" stroke="#d1e3ee" stroke-width="3"/><rect x="42" y="64" width="100" height="51" rx="8" fill="#536c81" stroke="#a9c3d3" stroke-width="3"/><path d="M142 89 H230 Q268 89 268 129 Q268 169 309 169 H369" fill="none" stroke="#b3c3cc" stroke-width="12" stroke-linecap="round"/><rect x="369" y="145" width="75" height="48" rx="8" fill="#526e80" stroke="#aac2d1" stroke-width="3"/><path d="M444 154 H467 V183 H444" fill="#89a9bc" stroke="#aac2d1" stroke-width="3"/><text x="411" y="219" text-anchor="middle" font-size="16">Штекер*</text><text x="205" y="210" font-size="16">59 1/16″</text></g><g id="h-2261083" data-article="2261083"><rect x="35" y="445" width="1010" height="76" rx="10" fill="#20394d" stroke="#597b90"/><text x="53" y="473" font-size="22" font-weight="700" fill="#7dd3fc">COJALI 2261083</text><text x="303" y="472" font-size="17">WABCO 4410323310</text><text x="590" y="472" font-size="17">IVECO 41221297</text><text x="53" y="501" font-size="16">Прямой · гнездо · 98 7/16 inch</text></g><g id="h-2261084" data-article="2261084"><rect x="35" y="530" width="1010" height="76" rx="10" fill="#243f55" stroke="#597b90"/><text x="53" y="558" font-size="22" font-weight="700" fill="#7dd3fc">COJALI 2261084</text><text x="303" y="557" font-size="17">WABCO 4410323300</text><text x="590" y="557" font-size="17">IVECO 41221296</text><text x="53" y="586" font-size="16">Прямой · гнездо · 98 7/16 inch</text></g><g id="h-2260022" data-article="2260022"><rect x="35" y="615" width="1010" height="76" rx="10" fill="#20394d" stroke="#597b90"/><text x="53" y="643" font-size="22" font-weight="700" fill="#7dd3fc">COJALI 2260022</text><text x="303" y="642" font-size="17">WABCO 4410359232</text><text x="590" y="642" font-size="17"></text><text x="53" y="671" font-size="16">Угловой · штекер · 59 1/16 inch</text></g><text x="35" y="747" font-size="16">*Разъёмы обозначены условно: форма, расположение контактов и распиновка не воспроизведены.</text><text x="35" y="779" font-size="16">Каталожные номера не подтверждают взаимозаменяемость; подбор по VIN обязателен.</text><text x="35" y="820" font-size="16" fill="#f1c87e">Чернови