"17">Длина кабеля: 119 3/32″ · код A</text><text x="55" y="601" font-size="16">Модели и кроссы — в карточке</text></g><g id="h-2260133" data-article="2260133"><rect x="550" y="481" width="495" height="143" rx="12" fill="#263f55" stroke="#6b91a5"/><text x="570" y="516" font-size="23" font-weight="700" fill="#7dd3fc">COJALI 2260133</text><text x="570" y="548" font-size="17">Каталожный номер: 4410323870</text><text x="570" y="576" font-size="17">Длина кабеля: 119 3/32″ · код B</text><text x="570" y="601" font-size="16">Модели и кроссы — в карточке</text></g><text x="35" y="657" font-size="16">Коды A/B не обозначают подтверждённую взаимозаменяемость.</text><text x="35" y="686" font-size="16">Геометрия корпуса, ось, сторона установки и применимость к VIN не подтверждены.</text><text x="35" y="725" font-size="16" fill="#f1c87e">Черновик · подбор по VIN · экспертная проверка обязательна · не инструкция по ремонту</text></g></svg>