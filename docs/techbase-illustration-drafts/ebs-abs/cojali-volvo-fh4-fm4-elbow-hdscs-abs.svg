<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="t d"><title id="t">Volvo FH (4) / FM (4) — угловой датчик ABS</title><desc id="d">Оригинальная условная иллюстрация формы вывода датчика, с отдельными каталожными вариантами.</desc><rect width="1080" height="760" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="35" y="43" font-size="18" fill="#7dd3fc">TrakSOS · EBS / ABS · Volvo</text><text x="35" y="82" font-size="30" font-weight="700">Volvo FH (4) / FM (4) — угловой датчик ABS</text><text x="35" y="114" font-size="18" fill="#c5d7e3">Tyco HDSCS, 3 позиции (2 задействованы), код A</text><rect x="35" y="137" width="1010" height="327" rx="14" fill="#1c3348" stroke="#51677b"/><g transform="translate(80 170)"><rect x="70" y="75" width="72" height="142" rx="12" fill="#95adbd" stroke="#dce8f0" stroke-width="3"/><path d="M58 54 H170 Q190 54 190 80 V113 H58Z" fill="#405c70" stroke="#9aafbc" stroke-width="3"/><path d="M190 82 H280 Q335 82 335 143 Q335 204 403 204 H614" fill="none" stroke="#a6b6c2" stroke-width="13" stroke-linecap="round"/><rect x="614" y="170" width="140" height="68" rx="10" fill="#496476" stroke="#aabecb" stroke-width="3"/><path d="M754 182 H785 V225 H754" fill="#6e8797" stroke="#b6c8d3" stroke-width="2"/><path d="M110 54 V18 H280" fill="none" stroke="#7dd3fc" stroke-width="2"/><text x="290" y="24" font-size="19">Угловой вывод</text><path d="M683 170 V98 H835" stroke="#7dd3fc" fill="none" stroke-width="2"/><text x="675" y="84" font-size="18">Tyco HDSCS</text><text x="682" y="267" text-anchor="middle" font-size="16">3 позиции, 2 задействованы*</text></g><g id="h-2260845" data-article="2260845"><rect x="35" y="481" width="495" height="143" rx="12" fill="#263f55" stroke="#6b91a5"/><text x="55" y="516" font-size="23" font-weight="700" fill="#7dd3fc">COJALI 2260845</text><text x="55" y="548" font-size="17">Каталожный номер: 21296851</text><text x="55" y="576" font-size="