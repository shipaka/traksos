<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="t d"><title id="t">Scania R — комплект дополнительного света переднего люка кабины</title><desc id="d">Авторская разнесённая схема состава комплекта без монтажных размеров, точек установки и распиновки.</desc><rect width="1000" height="690" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f0f5fb"><text x="36" y="42" font-size="18" fill="#80d8f7">TrakSOS / Электрика / Scania R</text><text x="36" y="83" font-size="28" font-weight="700">Дополнительный свет переднего люка кабины</text><text x="36" y="112" font-size="16" fill="#acc0d2">Вариант R-cab front hatch из каталога Scania Accessories</text><rect x="35" y="140" width="930" height="400" rx="14" fill="#192f45" stroke="#405a71"/><g id="h-bracket" data-article="3246385"><path d="M180 205 L275 190 L303 209 L213 225 L213 300 L180 310Z M730 190 L825 205 L825 310 L792 300 L792 225 L702 209Z" fill="#8499ac" stroke="#bcd0df" stroke-width="3"/><path d="M210 227 L790 227" stroke="#748da3" stroke-width="17"/><text x="500" y="175" text-anchor="middle" font-size="18" font-weight="700">1 · Комплект крепления R-cab</text><text x="500" y="198" text-anchor="middle" font-size="17" fill="#7dd3fc">3246385</text></g><g id="h-lightbar" data-article="3171008"><rect x="228" y="329" width="544" height="80" rx="9" fill="#111c27" stroke="#8198aa" stroke-width="4"/><rect x="249" y="344" width="502" height="50" rx="5" fill="#526778"/><g fill="#b3d8ed" stroke="#d9f4ff" stroke-width="1.5"><ellipse cx="268" cy="369" rx="13" ry="17"/><ellipse cx="303" cy="369" rx="13" ry="17"/><ellipse cx="338" cy="369" rx="13" ry="17"/><ellipse cx="373" cy="369" rx="13" ry="17"/><ellipse cx="408" cy="369" rx="13" ry="17"/><ellipse cx="443" cy="369" rx="13" ry="17"/><ellipse cx="478" cy="369" rx="13" ry="17"/><ellipse cx="513" cy="369" rx="13" ry="17"/><ellipse cx="548" cy="369" rx="13" ry="17"/><ellipse cx="583" cy="369" rx="13" ry="17"/><