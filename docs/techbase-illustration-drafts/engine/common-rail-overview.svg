<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d"><title id="t">Common Rail: общая топливная магистраль</title><desc id="d">Насос создаёт давление, рампа распределяет топливо к форсункам.</desc><metadata>id:common-rail-overview; source:https://www.bosch-mobility.com/en/solutions/powertrain/diesel/modular-common-rail-system/; source_review:page_search_excerpt; status:draft_expert_pending; rights:original_illustration; fitment:not_confirmed</metadata><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64d5ef"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f0ab66"/></marker></defs><rect width="1000" height="660" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="38" y="42" font-size="18" fill="#7dd3fc">TrakSOS · ТехБаза · Двигатель</text><text x="38" y="85" font-size="30" font-weight="700">Common Rail: общая топливная магистраль</text><rect x="38" y="112" width="924" height="370" rx="14" fill="#192e44" stroke="#51677b"/><rect x="70" y="235" width="140" height="125" rx="9" fill="#365a76" stroke="#a8c0d0" stroke-width="2"/><circle cx="300" cy="298" r="47" fill="#456e89" stroke="#aec1d0" stroke-width="3"/><rect x="400" y="190" width="475" height="55" rx="9" fill="#806944" stroke="#a8c0d0" stroke-width="2"/><path d="M210 298 H244" fill="none" stroke="#64d5ef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac)"/><path d="M347 298 H370 V218 H390" fill="none" stroke="#f0ab66" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="140" y="288" fill="#e5eef6" font-size="19" text-anchor="middle">Подача</text><text x="140" y="311" fill="#e5eef6" font-size="19" text-anchor="middle">топлива</text><text x="300" y="382" fill="#e5eef6" font-size="19" text-anchor="middle">ТНВД</text><text x="635" y="170" fill="#f0ab66" font-size="19" text-anchor="middle">Рампа высокого давления</text><path d="M460 245 V315" stroke="#f0ab66" stroke-width="6"/><rect x="435" y="315" width="50" height="65" rx="9" fill="#365a76" stroke="#a8c0d0" stroke-width="2"/><path d="M449 380 L460 411 L471 380Z" fill="#a9c6d5"/><path d="M575 245 V315" stroke="#f0ab66" stroke-width="6"/><rect x="550" y="315" width="50" height="65" rx="9" fill="#365a76" stroke="#a8c0d0" stroke-width="2"/><path d="M564 380 L575 411 L586 380Z" fill="#a9c6d5"/><path d="M690 245 V315" stroke="#f0ab66" stroke-width="6"/><rect x="665" y="315" width="50" height="65" rx="9" fill="#365a76" stroke="#a8c0d0" stroke-width="2"/><path d="M679 380 L690 411 L701 380Z" fill="#a9c6d5"/><path d="M805 245 V315" stroke="#f0ab66" stroke-width="6"/><rect x="780" y="315" width="50" height="65" rx="9" fill="#365a76" stroke="#a8c0d0" stroke-width="2"/><path d="M794 380 L805 411 L816 380Z" fill="#a9c6d5"/><text x="635" y="450" fill="#e5eef6" font-size="19" text-anchor="middle">Форсунки цилиндров (число условно)</text><text x="38" y="521" font-size="19" font-weight="700">Принцип и ограничения</text><text x="38" y="550" font-size="17" fill="#d1e0ee">Насос создаёт давление, рампа распределяет топливо к форсункам.</text><text x="38" y="574" font-size="17" fill="#d1e0ee">Возвратные линии и защитные элементы не показаны; не использовать для подключения.</text><text x="38" y="638" font-size="16" fill="#f1c87e">Учебный черновик · не OEM-схема · экспертная проверка обязательна</text></g></svg>