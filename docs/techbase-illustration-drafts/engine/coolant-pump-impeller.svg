y=".85" transform="rotate(225 487 296)"/><path d="M487 296 l85 31.25 q25 -43.75 -2.5 -70Z" fill="#bacbd6" opacity=".85" transform="rotate(270 487 296)"/><path d="M487 296 l85 31.25 q25 -43.75 -2.5 -70Z" fill="#bacbd6" opacity=".85" transform="rotate(315 487 296)"/><circle cx="487" cy="296" r="10" fill="#293d4e" stroke="#aec1d0" stroke-width="3"/><path d="M487 155 Q700 156 700 295 Q700 436 487 436" fill="none" stroke="#88a6bc" stroke-width="18"/><path d="M85 296 H350" fill="none" stroke="#64d5ef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac)"/><path d="M610 207 H792 V155" fill="none" stroke="#64d5ef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac)"/><text x="193" y="268" fill="#e5eef6" font-size="19" text-anchor="middle">Вход жидкости</text><text x="795" y="142" fill="#e5eef6" font-size="19" text-anchor="middle">Выход потока</text><path d="M547 349 L670 425 H800" fill="none" stroke="#9ab2c5" stroke-width="2"/><text x="805" y="450" fill="#e5eef6" font-size="19" text-anchor="middle">Лопатки</text><circle cx="487" cy="296" r="22" fill="#243c4c" stroke="#aec1d0" stroke-width="3"/><text x="38" y="521" font-size="19" font-weight="700">Принцип и ограничения</text><text x="38" y="550" font-size="17" fill="#d1e0ee">Крыльчатка сообщает жидкости энергию и создаёт поток в контуре.</text><text x="38" y="574" font-size="17" fill="#d1e0ee">Условный принцип центробежного насоса; привод и форма корпуса не подтверждены для модели.</text><text x="38" y="638" font-size="16" fill="#f1c87e">Учебный черновик · не OEM-схема · экспертная проверка обязательна</text></g></svg>