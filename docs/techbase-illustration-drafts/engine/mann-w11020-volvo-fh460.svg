<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">Volvo FH 460 — масляный фильтр</title><desc id="d">Авторская условная иллюстрация каталожных элементов, не монтажная схема.</desc><rect width="1000" height="680" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="35" y="44" font-size="18" fill="#7dd3fc">TrakSOS · Двигатель · MANN-FILTER</text><text x="35" y="84" font-size="29" font-weight="700">Volvo FH 460 — масляный фильтр</text><text x="35" y="114" font-size="17" fill="#bdd0de">FH II (FH13-460), D13C-460 / D13K-460 E6; с 01/2013</text><rect x="35" y="140" width="930" height="375" rx="16" fill="#192f45" stroke="#51677b"/><g id="h-kit" data-article="W 11 020"><rect x="295" y="245" width="186" height="202" rx="12" fill="#5b8290" stroke="#c2d8e0" stroke-width="3"/><ellipse cx="388" cy="245" rx="93" ry="29" fill="#becbd1" stroke="#e4edf0" stroke-width="3"/><ellipse cx="388" cy="245" rx="25" ry="10" fill="#243a4c"/><g fill="#526575"><ellipse cx="448" cy="245" rx="8" ry="4"/><ellipse cx="430.42640687119285" cy="258.4350288425444" rx="8" ry="4"/><ellipse cx="388" cy="264" rx="8" ry="4"/><ellipse cx="345.57359312880715" cy="258.4350288425444" rx="8" ry="4"/><ellipse cx="328" cy="245" rx="8" ry="4"/><ellipse cx="345.57359312880715" cy="231.5649711574556" rx="8" ry="4"/><ellipse cx="388" cy="226" rx="8" ry="4"/><ellipse cx="430.42640687119285" cy="231.5649711574556" rx="8" ry="4"/></g><ellipse cx="388" cy="446" rx="90" ry="20" fill="#476a7a"/><text x="388" y="353" font-size="28" font-weight="700" text-anchor="middle">W 11 020</text><path d="M483 247 L560 205 H806" stroke="#7dd3fc" stroke-width="2" fill="none"/><text x="567" y="195" font-size="18">Присоединение M32×1,5</text><path d="M482 350 H806" stroke="#7dd3fc" stroke-width="2"/><text x="567" y="340" font-size="18">Корпус Ø108 мм</text><path d="M482 445 L565 469 H806" stroke="#7dd3fc" stroke-width="2" fill="none"/><text x="567" y="458" font-size="18">Высота 261 мм</text></g><text x="35" y="552" font-size="19" font-weight="700">Назначение и ограничения</text><text x="35" y="583" font-size="17">Сменный масляный фильтр. Размеры приведены из каталога изготовителя.</text><text x="35" y="608" font-size="17">Для указанного варианта каталог указывает два фильтра; сверить комплектацию.</text><text x="35" y="650" font-size="16" fill="#f1c87e">Черновик · не OEM-чертёж · совместимость с VIN и экспертная проверка обязательны</text></g></svg>