9" fill="none" stroke="#64d5ef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac)"/><path d="M328 336 H80" fill="none" stroke="#64d5ef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac)"/><text x="190" y="202" fill="#f0ab66" font-size="17" text-anchor="middle">Масло, вход</text><text x="810" y="324" fill="#f0ab66" font-size="17" text-anchor="middle">Масло, выход</text><text x="810" y="236" fill="#64d5ef" font-size="17" text-anchor="middle">ОЖ, вход</text><text x="185" y="363" fill="#64d5ef" font-size="17" text-anchor="middle">ОЖ, выход</text><text x="500" y="449" fill="#e5eef6" font-size="19" text-anchor="middle">Разделяющие теплообменные стенки</text><text x="38" y="521" font-size="19" font-weight="700">Принцип и ограничения</text><text x="38" y="550" font-size="17" fill="#d1e0ee">В жидкостном маслоохладителе масло и охлаждающая жидкость не смешиваются.</text><text x="38" y="574" font-size="17" fill="#d1e0ee">Показан обмен теплом, а не фактические патрубки или внутренние каналы конкретной детали.</text><text x="38" y="638" font-size="16" fill="#f1c87e">Учебный черновик · не OEM-схема · экспертная проверка обязательна</text></g></svg>