<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Ford F-MAX Gen2 — тормозные системы"><title>Ford F-MAX Gen2 — тормозные системы</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1764a4"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="106" fill="#14344f"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c6e4fc" font-weight="700">TrakSOS | Техническая база</text><text x="32" y="81" text-anchor="start" font-size="31" fill="white" font-weight="700">Ford F-MAX Gen2 — тормозные системы</text><text x="32" y="144" text-anchor="start" font-size="21" fill="#3a5369" font-weight="500">Разделение рабочего и вспомогательного торможения; не схема трубопроводов</text><rect x="65" y="190" width="510" height="102" rx="14" fill="#edf4fa" stroke="#a6bbce" stroke-width="2"/><text x="320" y="234.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">Рабочая тормозная система</text><text x="320" y="263.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">EBS с ABS и ATC</text><rect x="65" y="340" width="510" height="100" rx="14" fill="#edf4fa" stroke="#a6bbce" stroke-width="2"/><text x="320" y="383.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">Двухконтурная пневмосистема</text><text x="320" y="412.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">Подготовка воздуха с подогревом</text><rect x="65" y="492" width="510" height="102" rx="14" fill="#edf4fa" stroke="#a6bbce" stroke-width="2"/><text x="320" y="536.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">Передние и задние</text><text x="320" y="565.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">дисковые тормоза</text><path d="M320 292V340" stroke="#1764a4" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M320 440V492" stroke="#1764a4" stroke-width="5" fill="none" marker-end="url(#a)"/><rect x="625" y="190" width="510" height="102" rx="14" fill="#edf4fa" stroke="#a6bbce" stroke-width="2"/><text x="880" y="249" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">Вспомогательное торможение</text><rect x="625" y="340" width="510" height="100" rx="14" fill="#e6f3ee" stroke="#a6bbce" stroke-width="2"/><text x="880" y="383.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">Моторный тормоз</text><text x="880" y="412.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">до 320 кВт</text><rect x="625" y="492" width="510" height="102" rx="14" fill="#fff0e9" stroke="#a6bbce" stroke-width="2"/><text x="880" y="536.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">Гидравлический ретардер (опция)</text><text x="880" y="565.5" text-anchor="middle" font-size="22" fill="#193550" font-weight="500">до 450 кВт; длительно 160 кВт</text><path d="M880 292V310H605V543H625" stroke="#1764a4" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M880 310V340" stroke="#1764a4" stroke-width="5" fill="none" marker-end="url(#a)"/><rect x="22" y="642" width="1156" height="55" rx="8" fill="#fff1e8"/><text x="600" y="663" text-anchor="middle" font-size="18" fill="#8d3b29" font-weight="600">Источник: Ford Trucks, Technical Features F-MAX Series, февраль 2025</text><text x="600" y="685" text-anchor="middle" font-size="17" fill="#8d3b29" font-weight="500">Учебная функциональная схема. Не монтажная документация. Проверка по VIN и экспертная оценка ожидаются.</text></g></svg>
