<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Detroit Assurance — сенсоры ABA6"><title>Detroit Assurance — сенсоры ABA6</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#25679e"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b9"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" font-size="22" fill="#c7e2f5" font-weight="700" text-anchor="start">TrakSOS / Freightliner Cascadia • поколение 5</text><text x="32" y="82" font-size="32" fill="white" font-weight="700" text-anchor="start">Detroit Assurance — сенсоры ABA6</text><text x="32" y="147" font-size="21" fill="#4c6578" font-weight="500" text-anchor="start">Состав сенсорной системы: без ложного указания мест крепления</text><rect x="70" y="200" width="495" height="385" rx="18" fill="#eaf2f9" stroke="#a5bccc" stroke-width="2"/><rect x="113" y="248" width="155" height="94" rx="12" fill="#526d80" stroke="#354e60" stroke-width="2"/><circle cx="190" cy="295" r="27" fill="#b5d0e4" stroke="#45677c" stroke-width="2"/><text x="190" y="373" font-size="24" fill="#17354e" font-weight="500" text-anchor="middle">Камера</text><rect x="330" y="248" width="170" height="94" rx="12" fill="#526d80" stroke="#354e60" stroke-width="2"/><path d="M365 270q90 24 0 48" fill="none" stroke="#c5e2f6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M375 280q90 24 0 48" fill="none" stroke="#c5e2f6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M385 290q90 24 0 48" fill="none" stroke="#c5e2f6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="415" y="373" font-size="24" fill="#17354e" font-weight="500" text-anchor="middle">5 радаров</text><text x="315" y="460" font-size="19" fill="#4c6578" font-weight="500" text-anchor="middle">4 ближнего действия</text><text x="315" y="491" font-size="19" fill="#4c6578" font-weight="500" text-anchor="middle">1 дальнего действия</text><rect x="640" y="200" width="490" height="108" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="885" y="247" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">ABA6</text><text x="885" y="275" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Помощь при экстренном торможении</text><rect x="640" y="340" width="490" height="108" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="885" y="387" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Side Guard Assist 2</text><text x="885" y="415" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Обнаружение объектов сбоку</text><rect x="640" y="480" width="490" height="108" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="885" y="527" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Active Lane Assist 2</text><text x="885" y="555" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Опция: удержание в полосе</text><text x="600" y="619" font-size="19" fill="#4c6578" font-weight="500" text-anchor="middle">Состав и оснащение уточнять по комплектации. Не схема калибровки.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" font-size="18" fill="#8b4029" font-weight="600" text-anchor="middle">Источник: официальные материалы Freightliner / Detroit, проверены 26.11.2026</text><text x="600" y="686" font-size="17" fill="#8b4029" font-weight="500" text-anchor="middle">Функциональная иллюстрация. Не монтажная схема. Независимая проверка ожидается.</text></g></svg>
