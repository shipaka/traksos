<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Intelligent Braking Control System"><title>Intelligent Braking Control System</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#25679e"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b9"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" font-size="22" fill="#c7e2f5" font-weight="700" text-anchor="start">TrakSOS / Freightliner Cascadia • поколение 5</text><text x="32" y="82" font-size="32" fill="white" font-weight="700" text-anchor="start">Intelligent Braking Control System</text><text x="32" y="147" font-size="21" fill="#4c6578" font-weight="500" text-anchor="start">Рабочие тормоза с электронным управлением и пневматическим резервом</text><rect x="440" y="190" width="320" height="90" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="600" y="242" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Рабочее торможение</text><rect x="75" y="350" width="445" height="110" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="297.5" y="398" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Brake-by-wire</text><text x="297.5" y="426" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Электронное управление</text><rect x="680" y="350" width="445" height="110" rx="12" fill="#e6f3eb" stroke="#9fb7c9" stroke-width="2"/><text x="902.5" y="412" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Пневматический резерв</text><path d="M600 280V315H297V350" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M600 315H902V350" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><rect x="375" y="530" width="450" height="78" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="600" y="576" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Тормозные механизмы</text><path d="M297 460V495H600V530" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M902 460V495H600" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="600" y="629" font-size="19" fill="#4c6578" font-weight="500" text-anchor="middle">Принцип резервирования, не схема клапанов или контуров.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" font-size="18" fill="#8b4029" font-weight="600" text-anchor="middle">Источник: официальные материалы Freightliner / Detroit, проверены 26.11.2026</text><text x="600" y="686" font-size="17" fill="#8b4029" font-weight="500" text-anchor="middle">Функциональная иллюстрация. Не монтажная схема. Независимая проверка ожидается.</text></g></svg>
