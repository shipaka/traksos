<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="DT12 On-Highway — пневмопривод AMT"><title>DT12 On-Highway — пневмопривод AMT</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#25679e"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b9"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" font-size="22" fill="#c7e2f5" font-weight="700" text-anchor="start">TrakSOS / Freightliner Cascadia • поколение 5</text><text x="32" y="82" font-size="32" fill="white" font-weight="700" text-anchor="start">DT12 On-Highway — пневмопривод AMT</text><text x="32" y="147" font-size="21" fill="#4c6578" font-weight="500" text-anchor="start">Сцепление и переключение механической коробки управляются компьютером</text><rect x="420" y="185" width="360" height="82" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="600" y="233" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Электронное управление</text><rect x="420" y="320" width="360" height="82" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="600" y="368" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Пневматический привод</text><path d="M600 267V320" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><rect x="85" y="480" width="435" height="110" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="302.5" y="528" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Сцепление</text><text x="302.5" y="556" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Без гидротрансформатора</text><rect x="680" y="480" width="435" height="110" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="897.5" y="528" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Механизм переключения</text><text x="897.5" y="556" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">12 передач вперёд</text><path d="M600 402V442H302V480" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M600 442H897V480" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><text x="600" y="620" font-size="19" fill="#4c6578" font-weight="500" text-anchor="middle">Блоки функциональны; клапаны и магистрали не показаны.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" font-size="18" fill="#8b4029" font-weight="600" text-anchor="middle">Источник: официальные материалы Freightliner / Detroit, проверены 26.11.2026</text><text x="600" y="686" font-size="17" fill="#8b4029" font-weight="500" text-anchor="middle">Функциональная иллюстрация. Не монтажная схема. Независимая проверка ожидается.</text></g></svg>
