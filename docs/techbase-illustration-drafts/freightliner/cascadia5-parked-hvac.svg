stroke-width="2"/><text x="997.5" y="300.5" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Кабина</text><text x="997.5" y="328.5" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Воздух</text><path d="M300 307H430" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M745 307H865" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><rect x="430" y="475" width="315" height="82" rx="12" fill="#eaf2f9" stroke="#9fb7c9" stroke-width="2"/><text x="587.5" y="523" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Термостат</text><path d="M587 475V385" fill="none" stroke="#25679e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><text x="600" y="611" font-size="19" fill="#4c6578" font-weight="500" text-anchor="middle">Главный двигатель выключен. Не схема силового подключения.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" font-size="18" fill="#8b4029" font-weight="600" text-anchor="middle">Источник: официальные материалы Freightliner / Detroit, проверены 26.11.2026</text><text x="600" y="686" font-size="17" fill="#8b4029" font-weight="500" text-anchor="middle">Функциональная иллюстрация. Не монтажная схема. Независимая проверка ожидается.</text></g></svg>
