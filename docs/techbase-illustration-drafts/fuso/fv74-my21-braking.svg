<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Тормозные механизмы и моторный тормоз"><title>Тормозные механизмы и моторный тормоз</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2469a0"/></marker><linearGradient id="metal"><stop stop-color="#dbe4eb"/><stop offset=".48" stop-color="#8ea5b5"/><stop offset="1" stop-color="#dce7ef"/></linearGradient></defs><g font-family="Arial, sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#11334e"/><text x="32" y="38" font-size="22" fill="#c2d9ed" font-weight="700" text-anchor="start">TrakSOS  /  FUSO Shogun FV74 510 MY21</text><text x="32" y="82" font-size="32" fill="#fff" font-weight="700" text-anchor="start">Тормозные механизмы и моторный тормоз</text><text x="32" y="146" font-size="20" fill="#496579" font-weight="500" text-anchor="start">Два пневматических контура; размеры по спецификации, схема не монтажная</text><rect x="40" y="190" width="520" height="405" rx="16" fill="#edf4fa" stroke="#aec2d2" stroke-width="2"/><rect x="640" y="190" width="520" height="405" rx="16" fill="#edf4fa" stroke="#aec2d2" stroke-width="2"/><text x="300" y="232" font-size="25" fill="#17324a" font-weight="700" text-anchor="middle">Передний механизм</text><text x="900" y="232" font-size="25" fill="#17324a" font-weight="700" text-anchor="middle">Задний механизм</text><circle cx="300" cy="365" r="111" fill="url(#metal)" stroke="#3e586b" stroke-width="2"/><circle cx="300" cy="365" r="78" fill="#f8fafc" stroke="#3e586b" stroke-width="2"/><path d="M251 315Q188 365 251 415M349 315Q412 365 349 415" stroke="#b07c45" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="365" r="22" fill="#8ea6b7" stroke="#3e586b" stroke-width="2"/><circle cx="900" cy="365" r="111" fill="url(#metal)" stroke="#3e586b" stroke-width="2"/><circle cx="900" cy="365" r="78" fill="#f8fafc" stroke="#3e586b" stroke-width="2"/><path d="M851 315Q788 365 851 415M949 315Q1012 365 949 415" stroke="#b07c45" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="900" cy="365" r="22" fill="#8ea6b7" stroke="#3e586b" stroke-width="2"/><text x="300" y="515" font-size="19" fill="#3e596e" font-weight="500" text-anchor="middle">410 × 150 мм</text><text x="900" y="515" font-size="19" fill="#3e596e" font-weight="500" text-anchor="middle">410 × 200 мм</text><text x="600" y="624" font-size="20" fill="#17324a" font-weight="500" text-anchor="middle">Стояночный: задние пружинные механизмы • Jacobs: 3 ступени замедления</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff2e9" stroke="#edc9b3" stroke-width="2"/><text x="600" y="665" font-size="18" fill="#8b442b" font-weight="600" text-anchor="middle">AU: FV74VJR9VFAA / FV74VJR9VFAB • FUSO, 12.08.2021</text><text x="600" y="686" font-size="17" fill="#8b442b" font-weight="500" text-anchor="middle">Условная функциональная иллюстрация. Не монтажная схема. Экспертная проверка ожидается.</text></g></svg>
