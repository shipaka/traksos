="600" y="586" font-size="18" fill="#243e4c" font-weight="600" text-anchor="middle">Не все исполнения EB+ 4.0 оснащены электронным контролем стояночного тормоза.</text><g opacity=".07" transform="translate(600 416) rotate(-22)"><text x="0" y="0" font-size="90" fill="#172f3d" font-weight="700" text-anchor="middle">TrakSOS</text></g><rect x="30" y="662" width="1140" height="70" rx="9" fill="#fff0dc" stroke="#e3cfb2" stroke-width="2"/><text x="48" y="687" font-size="19" fill="#895410" font-weight="700" text-anchor="start">ЧЕРНОВИК · функциональная иллюстрация</text><text x="48" y="713" font-size="16" fill="#895410" font-weight="500" text-anchor="start">Только разграничение функций. Не схема разблокировки, проводки или управления тормозом.</text></g></svg>