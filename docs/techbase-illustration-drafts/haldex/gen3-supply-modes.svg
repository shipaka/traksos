<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img"><title>Haldex EB+ Gen3 · Варианты питания</title><desc>Руководство 006300018 · 2021 · печатная стр. 66; Не схема разъёмов и не руководство по переделке питания.</desc><metadata>TrakSOS original editable vector; source https://www.haldex.com/globalassets/europe/tag/eb/eb-files/006300018_en.pdf. Draft, publication HOLD; not OEM drawing.</metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#456675"/></marker><linearGradient id="metal"><stop offset="0" stop-color="#7893a2"/><stop offset=".5" stop-color="#e5edf1"/><stop offset="1" stop-color="#829ba8"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="760" fill="#f4f8fa"/><rect width="1200" height="115" fill="#172f3d"/><text x="35" y="48" font-size="30" fill="#fff" font-weight="700" text-anchor="start">Haldex EB+ Gen3 · Варианты питания</text><text x="35" y="83" font-size="18" fill="#c4dce6" font-weight="500" text-anchor="start">Руководство 006300018 · 2021 · печатная стр. 66</text><text x="1160" y="48" font-size="24" fill="#ffb260" font-weight="700" text-anchor="end">TrakSOS</text><rect x="35" y="145" width="1130" height="480" rx="16" fill="#fff" stroke="#d1dfe6" stroke-width="2"/><rect x="65" y="190" width="340" height="350" rx="14" fill="#e6eff3" stroke="#a8c1cf" stroke-width="2"/><circle cx="235" cy="277" r="61" fill="#526e7d" stroke="#547484" stroke-width="2"/><circle cx="235" cy="277" r="45" fill="#d7e5ec" stroke="#547484" stroke-width="2"/><text x="235" y="285" font-size="28" fill="#243e4c" font-weight="600" text-anchor="middle">7</text><text x="235" y="375" font-size="20" fill="#243e4c" font-weight="600" text-anchor="middle">ISO 7638 · 7 контактов</text><text x="235" y="418" font-size="24" fill="#176d85" font-weight="600" text-anchor="middle">Полная функция EBS</text><text x="235" y="465" font-size="18" fill="#243e4c" font-weight="600" text-anchor="middle">CAN предусмотрен</text><rect x="430" y="190" width="340" height="350" rx="14" fill="#e6eff3" stroke="#a8c1cf" stroke-width="2"/><circle cx="600" cy="277" r="61" fill="#526e7d" stroke="#547484" stroke-width="2"/><circle cx="600" cy="277" r="45" fill="#d7e5ec" stroke="#547484" stroke-width="2"/><text x="600" y="285" font-size="28" fill="#243e4c" font-weight="600" text-anchor="middle">5</text><text x="600" y="375" font-size="20" fill="#243e4c" font-weight="600" text-anchor="middle">ISO 7638 · 5 контактов</text><text x="600" y="418" font-size="24" fill="#176d85" font-weight="600" text-anchor="middle">ABS + ELS</text><text x="600" y="465" font-size="18" fill="#243e4c" font-weight="600" text-anchor="middle">Без CAN</text><rect x="795" y="190" width="340" height="350" rx="14" fill="#e6eff3" stroke="#a8c1cf" stroke-width="2"/><circle cx="965" cy="277" r="61" fill="#526e7d" stroke="#547484" stroke-width="2"/><circle cx="965" cy="277" r="45" fill="#d7e5ec" stroke="#547484" stroke-width="2"/><text x="965" y="285" font-size="28" fill="#243e4c" font-weight="600" text-anchor="middle">24N</text><text x="965" y="375" font-size="20" fill="#243e4c" font-weight="600" text-anchor="middle">ISO 12098 / ISO 1185</text><text x="965" y="418" font-size="24" fill="#176d85" font-weight="600" text-anchor="middle">Только ABS</text><text x="965" y="465" font-size="18" fill="#243e4c" font-weight="600" text-anchor="middle">Питание от стоп-сигнала</text><text x="600" y="588" font-size="18" fill="#243e4c" font-weight="600" text-anchor="middle">Функциональные различия, а не разрешение эксплуатировать прицеп при отказе EBS.</text><g opacity=".07" transform="translate(600 416) rotate(-22)"><text x="0" y="0" font-size="90" fill="#172f3d" font-weight="700" text-anchor="middle">TrakSOS</text></g><rect x="30" y="662" width="1140" height="70" rx="9" fill="#fff0dc" stroke="#e3cfb2" stroke-width="2"/><text x="48" y="687" font-size="19" fil