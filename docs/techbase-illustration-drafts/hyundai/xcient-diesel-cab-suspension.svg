<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img"><title>XCIENT · дизельная линейка — Подвеска кабины: функции амортизаторов</title><desc>Упругая опора и амортизатор снижают вертикальные колебания; поперечный амортизатор — боковые. Показаны функции элементов, а не точки крепления на конкретной кабине.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#247aa7"/></marker></defs><rect width="1440" height="800" fill="#f1f5f9"/><rect width="1440" height="155" fill="#15263d"/><text x="40" y="40" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="white" font-weight="650">TrakSOS / ТЕХБАЗА / HYUNDAI</text><text x="40" y="90" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="white" font-weight="700">XCIENT · дизельная линейка</text><text x="40" y="132" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#dce8f3" font-weight="500">Подвеска кабины: функции амортизаторов</text><rect x="55" y="185" width="645" height="380" rx="15" fill="white" stroke="#bfd1e1" stroke-width="2"/><text x="377.5" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#294f70" font-weight="650">Вертикальные колебания</text><rect x="165" y="270" width="420" height="40" rx="12" fill="#91aabc" stroke="#526f87" stroke-width="2"/><rect x="362" y="320" width="32" height="76" rx="6" fill="#7b9aaf" stroke="#426783" stroke-width="2"/><rect x="372" y="396" width="12" height="54" rx="3" fill="#b9cad6" stroke="#426783" stroke-width="2"/><circle cx="378" cy="316" r="8" fill="#e5edf3" stroke="#426783" stroke-width="3"/><circle cx="378" cy="453" r="8" fill="#e5edf3" stroke="#426783" stroke-width="3"/><path d="M340 330q-32 10 0 20t0 20t0 20t0 20t0 20" fill="none" stroke="#b84d4c" stroke-width="7"/><rect x="165" y="477" width="420" height="22" rx="12" fill