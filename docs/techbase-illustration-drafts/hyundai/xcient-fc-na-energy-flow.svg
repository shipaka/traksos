<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img"><title>XCIENT Fuel Cell Tractor · NA 6×4 — Потоки энергии при движении и торможении</title><desc>Стрелки показывают преобразование энергии, не электрическую схему или трассы проводов. Управляющая силовая электроника здесь не детализирована.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#247aa7"/></marker></defs><rect width="1440" height="800" fill="#f1f5f9"/><rect width="1440" height="155" fill="#15263d"/><text x="40" y="40" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="white" font-weight="650">TrakSOS / ТЕХБАЗА / HYUNDAI</text><text x="40" y="90" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="white" font-weight="700">XCIENT Fuel Cell Tractor · NA 6×4</text><text x="40" y="132" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#dce8f3" font-weight="500">Потоки энергии при движении и торможении</text><rect x="55" y="185" width="1330" height="380" rx="15" fill="white" stroke="#bfd1e1" stroke-width="2"/><text x="720" y="227" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#294f70" font-weight="650">Обобщённая функциональная связь</text><rect x="95" y="315" width="220" height="110" rx="12" fill="#e1edf7" stroke="#7194b0" stroke-width="2"/><text x="205" y="363" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#263b50" font-weight="500">Топливные</text><text x="205" y="393" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#263b50" font-weight="500">элементы</text><path d="M315 370L405 370" stroke="#247aa7" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="415" y="315" width="250" height="110" rx="12" fill="#e1edf7" stroke="#7194b0" stroke-width="2"/><text x="540" y=