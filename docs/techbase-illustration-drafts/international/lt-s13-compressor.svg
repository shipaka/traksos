<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="S13 — варианты воздушного компрессора"><title>S13 — варианты воздушного компрессора</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b9d"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b8"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / International LT и RH • S13 Integrated</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">S13 — варианты воздушного компрессора</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#4c6578" font-weight="500">Сравнение трёх заводских вариантов, не схема пневмосистемы</text><rect x="45" y="190" width="330" height="390" rx="18" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="210" y="230" text-anchor="middle" font-size="24" fill="#19364c" font-weight="700">Одноцилиндровый</text><text x="210" y="262" text-anchor="middle" font-size="21" fill="#19364c" font-weight="500">Чугунный</text><rect x="110" y="390" width="200" height="95" rx="15" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><rect x="140" y="300" width="65" height="100" rx="8" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><text x="210" y="530" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Без изображения привода</text><rect x="435" y="190" width="330" height="390" rx="18" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="600" y="230" text-anchor="middle" font-size="24" fill="#19364c" font-weight="700">Двухцилиндровый</text><text x="600" y="262" text-anchor="middle" font-size="21" fill="#19364c" font-weight="500">Алюминиевый</text><rect x="500" y="390" width="200" height="95" rx="15" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><rect x="530" y="300" width="65" height="100" rx="8" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><rect x="610" y="300" width="65" height="100" rx="8" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><text x="600" y="530" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Без изображения привода</text><rect x="825" y="190" width="330" height="390" rx="18" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="990" y="230" text-anchor="middle" font-size="24" fill="#19364c" font-weight="700">Двухцилиндровый</text><text x="990" y="262" text-anchor="middle" font-size="21" fill="#19364c" font-weight="500">Алюминиевый, с муфтой</text><rect x="890" y="390" width="200" height="95" rx="15" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><rect x="920" y="300" width="65" height="100" rx="8" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><rect x="1000" y="300" width="65" height="100" rx="8" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><text x="990" y="530" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Муфта условно</text><circle cx="1080" cy="437" r="39" fill="#7190a5" stroke="#526d80" stroke-width="2"/><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">International LT/RH S13 Spec Sheet • сентябрь 2024</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
