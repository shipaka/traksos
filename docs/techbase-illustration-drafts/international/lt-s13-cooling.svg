<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="S13 — насос и вентиляторы"><title>S13 — насос и вентиляторы</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b9d"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b8"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / International LT и RH • S13 Integrated</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">S13 — насос и вентиляторы</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#4c6578" font-weight="500">Заводские варианты вентиляторов: шесть или девять лопастей</text><circle cx="230" cy="330" r="83" fill="url(#m)" stroke="#526d80" stroke-width="2"/><circle cx="230" cy="330" r="42" fill="#718c9e" stroke="#526d80" stroke-width="2"/><text x="230" y="337" text-anchor="middle" font-size="20" fill="white" font-weight="700">Насос</text><circle cx="615" cy="330" r="114" fill="#e3edf3" stroke="#526d80" stroke-width="2"/><path d="M615 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(0 615 330)"/><path d="M615 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(60 615 330)"/><path d="M615 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(120 615 330)"/><path d="M615 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(180 615 330)"/><path d="M615 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(240 615 330)"/><path d="M615 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(300 615 330)"/><circle cx="615" cy="330" r="26" fill="#4d6a7e" stroke="#526d80" stroke-width="2"/><text x="615" y="478" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">6 лопастей</text><circle cx="980" cy="330" r="114" fill="#e3edf3" stroke="#526d80" stroke-width="2"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(0 980 330)"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(40 980 330)"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(80 980 330)"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(120 980 330)"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(160 980 330)"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(200 980 330)"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(240 980 330)"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(280 980 330)"/><path d="M980 330q-16 -28 10 -96q48 24 10 88Z" fill="#8ba6b7" transform="rotate(320 980 330)"/><circle cx="980" cy="330" r="26" fill="#4d6a7e" stroke="#526d80" stroke-width="2"/><text x="980" y="478" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">9 лопастей</text><text x="230" y="454" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Малый рабочий объём насоса</text><rect x="200" y="520" width="800" height="72" rx="14" fill="#e6f3eb" stroke="#a4bccc" stroke-width="2"/><text x="600" y="564" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Количество лопастей зависит от исполнения; привод и крепления не показаны.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">International LT/RH S13 Spec Sheet • сентябрь 2024</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
