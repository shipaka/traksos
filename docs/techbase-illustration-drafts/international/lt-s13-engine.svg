12" height="31" rx="6" fill="url(#m)" stroke="#566f81" stroke-width="2"/></g><rect x="560" y="200" width="530" height="105" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="825" y="246" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Рядный дизель, 6 цилиндров</text><text x="825" y="275" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Рабочий объём 12,74 л</text><rect x="560" y="335" width="530" height="105" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="825" y="381" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Два верхних распредвала</text><text x="825" y="410" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">4 клапана на цилиндр</text><rect x="560" y="470" width="530" height="105" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="825" y="516" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Степень сжатия 23:1</text><text x="825" y="545" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Турбина с фиксированной геометрией</text><text x="256" y="484" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Условный силуэт двигателя</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">International LT/RH S13 Spec Sheet • сентябрь 2024</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
