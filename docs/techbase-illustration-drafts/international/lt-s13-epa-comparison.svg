<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="S13 — различия EPA 2024 и EPA 2027"><title>S13 — различия EPA 2024 и EPA 2027</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b9d"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b8"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / International LT и RH • S13 Integrated</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">S13 — различия EPA 2024 и EPA 2027</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#4c6578" font-weight="500">EPA 2027 — объявленная конфигурация, не утверждение об установке в нынешнем LT</text><rect x="50" y="185" width="535" height="412" rx="16" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><rect x="615" y="185" width="535" height="412" rx="16" fill="#e6f3eb" stroke="#a4bccc" stroke-width="2"/><text x="317" y="230" text-anchor="middle" font-size="28" fill="#19364c" font-weight="700">EPA 2024</text><text x="882" y="230" text-anchor="middle" font-size="28" fill="#19364c" font-weight="700">EPA 2027 (объявлено)</text><rect x="80" y="260" width="475" height="90" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="317.5" y="298.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Внешняя EGR применяется</text><text x="317.5" y="327.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Охладителя EGR нет</text><rect x="645" y="260" width="475" height="90" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="882.5" y="298.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Внешняя EGR исключена</text><text x="882.5" y="327.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">VVT и VVB</text><rect x="80" y="385" width="475" height="90" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="317.5" y="438" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Двухступенчатая очистка</text><rect x="645" y="385" width="475" height="90" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="882.5" y="423.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Двухступенчатая очистка</text><text x="882.5" y="452.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Без электронагрева катализатора</text><text x="317" y="540" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Не переносить новые узлы на EPA 2024</text><text x="882" y="540" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">24 В: стартер, генератор, контроллеры двигателя</text><text x="600" y="623" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Сверять по году выпуска, нормам выбросов и заводской комплектации.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">International • S13 Integrated, заводское описание</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
