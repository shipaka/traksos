" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">International LT/RH S13 Spec Sheet • сентябрь 2024</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
