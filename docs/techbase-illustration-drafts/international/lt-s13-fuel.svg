<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="S13 — топливная система"><title>S13 — топливная система</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b9d"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b8"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / International LT и RH • S13 Integrated</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">S13 — топливная система</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#4c6578" font-weight="500">Common Rail, номинал системы 1800 бар по спецификации</text><rect x="65" y="265" width="190" height="105" rx="15" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><text x="160" y="328" text-anchor="middle" font-size="24" fill="#19364c" font-weight="500">Дизтопливо</text><rect x="315" y="250" width="180" height="135" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="405" y="311" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Фильтрация</text><text x="405" y="340" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">и подача</text><rect x="550" y="250" width="200" height="135" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="650" y="311" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Создание</text><text x="650" y="340" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">давления</text><rect x="815" y="252" width="330" height="45" rx="8" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><path d="M835 297v85" fill="none" stroke="#246