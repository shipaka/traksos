<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="T14 — электронный привод сцепления"><title>T14 — электронный привод сцепления</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b9d"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b8"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / International LT и RH • S13 Integrated</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">T14 — электронный привод сцепления</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#4c6578" font-weight="500">Управление сцеплением без расхода воздуха из пневмосистемы</text><rect x="55" y="220" width="280" height="120" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="195" y="273.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Электронное</text><text x="195" y="302.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">управление КПП</text><rect x="440" y="220" width="260" height="120" rx="15" fill="url(#m)" stroke="#536b7d" stroke-width="2"/><text x="570" y="275" text-anchor="middle" font-size="32" fill="#17354e" font-weight="700">ECA</text><text x="570" y="310" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Привод сцепления</text><path d="M335 280H440" fill="none" stroke="#246b9d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="820" y="200" width="295" height="160" rx="16" fill="#dbe6ed" stroke="#536b7d" stroke-width="2"/><text x="967" y="287" font-size="24" text-anchor="middle" fill="#19364c">Сцепление</text><path d="M700 280H820" fill="none" stroke="#246b9d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="255" y="460" width="690" height="105" rx="14" fill="#e6f3eb" stroke="#a4bccc" stroke-width="2"/><text x="600" y="506" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Электрическое исполнительное устройство</text><text x="600" y="535" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Не пневматический актуатор</text><text x="600" y="612" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Количество дисков, кинематика и разъёмы не показаны.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">International • S13 Integrated, заводское описание</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
