<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="T14 — управление уровнем масла"><title>T14 — управление уровнем масла</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b9d"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b8"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / International LT и RH • S13 Integrated</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">T14 — управление уровнем масла</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#4c6578" font-weight="500">Верхний резервуар с переменным уровнем, функциональное представление</text><rect x="90" y="220" width="440" height="350" rx="18" fill="#e1ebf2" stroke="#536d80" stroke-width="2"/><rect x="160" y="250" width="300" height="100" rx="14" fill="#e8eff4" stroke="#536d80" stroke-width="2"/><rect x="175" y="294" width="270" height="44" rx="3" fill="#c8a25f" stroke="#a0804b" stroke-width="2"/><text x="310" y="240" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Верхний резервуар</text><path d="M310 350V410" fill="none" stroke="#246b9d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="250" cy="459" r="54" fill="url(#m)" stroke="#526d80" stroke-width="2"/><circle cx="250" cy="459" r="21" fill="#748da0" stroke="#526d80" stroke-width="2"/><circle cx="370" cy="459" r="54" fill="url(#m)" stroke="#526d80" stroke-width="2"/><circle cx="370" cy="459" r="21" fill="#748da0" stroke="#526d80" stroke-width="2"/><rect x="110" y="508" width="400" height="43" rx="6" fill="#d8b875" stroke="#a0804b" stroke-width="2"/><rect x="615" y="220" width="485" height="110" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="857.5" y="268.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Распределение масла</text><text x="857.5" y="297.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">по потребности</text><rect x="615" y="385" width="485" height="110" rx="14" fill="#e6f3eb" stroke="#a4bccc" stroke-width="2"/><text x="857.5" y="433.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Снижение потерь</text><text x="857.5" y="462.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">при работе трансмиссии</text><path d="M857 330V385" fill="none" stroke="#246b9d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="600" y="610" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Без выдуманных клапанов, датчиков, насосов и уровня в миллиметрах.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">International • T14 Transmission, 2026</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
