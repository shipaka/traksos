<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="T14 — планетарный принцип реверса"><title>T14 — планетарный принцип реверса</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246b9d"/></marker><linearGradient id="m"><stop stop-color="#e2e9ef"/><stop offset=".55" stop-color="#92a9b8"/><stop offset="1" stop-color="#d5e2ea"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / International LT и RH • S13 Integrated</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">T14 — планетарный принцип реверса</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#4c6578" font-weight="500">Планетарный механизм позволяет отказаться от отдельных шестерён заднего хода</text><circle cx="325" cy="370" r="152" fill="#c3d4de" stroke="#526d80" stroke-width="2"/><circle cx="325" cy="370" r="121" fill="#f8fafc" stroke="#526d80" stroke-width="2"/><circle cx="325" cy="370" r="34" fill="url(#m)" stroke="#526d80" stroke-width="2"/><circle cx="401" cy="370" r="31" fill="url(#m)" stroke="#526d80" stroke-width="2"/><circle cx="287" cy="435.8179306876174" r="31" fill="url(#m)" stroke="#526d80" stroke-width="2"/><circle cx="286.99999999999994" cy="304.1820693123827" r="31" fill="url(#m)" stroke="#526d80" stroke-width="2"/><text x="325" y="549" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Условный планетарный ряд</text><rect x="615" y="220" width="490" height="108" rx="14" fill="#edf4f8" stroke="#a4bccc" stroke-width="2"/><text x="860" y="267.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">14-ступенчатая AMT</text><text x="860" y="296.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Один промежуточный вал</text><rect x="615" y="375" width="490" height="108" rx="14" fill="#e6f3eb" stroke="#a4bccc" stroke-width="2"/><text x="860" y="422.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Планетарный реверс</text><text x="860" y="451.5" text-anchor="middle" font-size="22" fill="#19364c" font-weight="500">Компактная компоновка</text><path d="M860 328V375" fill="none" stroke="#246b9d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="860" y="559" text-anchor="middle" font-size="18" fill="#4a6376" font-weight="500">Не кинематическая схема T14</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#ebc7b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">International • T14 Transmission, 2026 / LT/RH spec 2024</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
