necap="round"/><path d="M966 292V352" fill="none" stroke="#267e96" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="75" y="490" width="1050" height="98" rx="10" fill="#f0f5f7" stroke="#b7ccd6" stroke-width="2"/> <text x="95" y="521" font-size="18" fill="#253d4c" font-weight="700" text-anchor="start">KKS-U: под полуприцепом — клин с разъёмом, стальная пружина и короб для линий.</text><text x="95" y="554" font-size="18" fill="#253d4c" font-weight="500" text-anchor="start">Клин поворачивается вокруг шкворня; линии проходят в защищённой пружине.</text><g opacity=".07" transform="translate(600 420) rotate(-22)"><text x="0" y="0" font-size="91" fill="#172e3d" font-weight="700" text-anchor="middle">TrakSOS</text></g><rect x="30" y="662" width="1140" height="70" rx="9" fill="#fff0dc" stroke="#e3cfaf" stroke-width="2"/><text x="48" y="688" font-size="19" fill="#895410" font-weight="700" text-anchor="start">ЧЕРНОВИК · функциональная иллюстрация</text><text x="48" y="714" font-size="16" fill="#895410" font-weight="500" text-anchor="start">Функциональные связи, не порядок сцепки, электрическая или пневматическая схема.</text></g></svg>