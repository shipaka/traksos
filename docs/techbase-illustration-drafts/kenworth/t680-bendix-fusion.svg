e">Kenworth • T680, каталог комплектаций</text><text x="600" y="686" font-size="17" fill="#8b4029" font-weight="500" text-anchor="middle">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
