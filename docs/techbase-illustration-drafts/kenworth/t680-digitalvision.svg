<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="DigitalVision — камеры и мониторы"><title>DigitalVision — камеры и мониторы</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" font-size="22" fill="#c7e2f5" font-weight="700" text-anchor="start">TrakSOS / Kenworth T680 Next Gen</text><text x="32" y="82" font-size="32" fill="#ffffff" font-weight="700" text-anchor="start">DigitalVision — камеры и мониторы</text><text x="32" y="147" font-size="20" fill="#466279" font-weight="500" text-anchor="start">Состав системы по сторонам автомобиля; условная схема, не монтажные координаты</text><rect x="50" y="190" width="530" height="405" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><rect x="620" y="190" width="530" height="405" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="315" y="230" font-size="26" fill="#17354e" font-weight="700" text-anchor="middle">Сторона водителя</text><text x="885" y="230" font-size="26" fill="#17354e" font-weight="700" text-anchor="middle">Пассажирская сторона</text><rect x="110" y="275" width="128" height="82" rx="11" fill="#435d70" stroke="#334b5d" stroke-width="2"/><circle cx="174" cy="316" r="25" fill="#b3d4e7" stroke="#526b80" stroke-width="2"/><text x="174" y="383" font-size="18" fill="#466279" font-weight="500" text-anchor="middle">Вид назад</text><rect x="340" y="260" width="165" height="110" rx="10" fill="#435d70" stroke="#334b5d" stroke-width="2"/><rect x="348" y="268" width="149" height="94" rx="4" fill="#cfe4f0" stroke="#90adbf" stroke-width="2"/><text x="422.5" y="321" font-size="20" fill="#17354e" font-weight="500" text-anchor="middle">12,3″</text><path d="M238 316H340" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="670" y="270" width="128" height="82" rx="11" fill="#435d70" stroke="#334b5d" stroke-width="2"/><circle cx="734" cy="311" r="25" fill="#b3d4e7" stroke="#526b80" stroke-width="2"/><rect x="670" y="405" width="128" height="82" rx="11" fill="#435d70" stroke="#334b5d" stroke-width="2"/><circle cx="734" cy="446" r="25" fill="#b3d4e7" stroke="#526b80" stroke-width="2"/><text x="734" y="377" font-size="18" fill="#466279" font-weight="500" text-anchor="middle">Вид назад</text><text x="734" y="512" font-size="18" fill="#466279" font-weight="500" text-anchor="middle">Вид вниз</text><rect x="935" y="310" width="165" height="145" rx="10" fill="#435d70" stroke="#334b5d" stroke-width="2"/><rect x="943" y="318" width="149" height="129" rx="4" fill="#cfe4f0" stroke="#90adbf" stroke-width="2"/><text x="1017.5" y="388.5" font-size="20" fill="#17354e" font-weight="500" text-anchor="middle">15″</text><path d="M798 311H850V382H935" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M798 446H850V382" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="625" font-size="18" fill="#466279" font-weight="500" text-anchor="middle">Мониторы у передних стоек кабины; ИК-режим и отслеживание прицепа — функции комплекта.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" font-size="18" fill="#8b4029" font-weight="600" text-anchor="middle">Kenworth • T680, каталог комплектаций</text><text x="600" y="686" font-size="17" fill="#8b4029" font-weight="500" text-anchor="middle">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
