<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="DX-40 — блокировка дифференциала"><title>DX-40 — блокировка дифференциала</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" font-size="22" fill="#c7e2f5" font-weight="700" text-anchor="start">TrakSOS / Kenworth T680 Next Gen</text><text x="32" y="82" font-size="32" fill="#ffffff" font-weight="700" text-anchor="start">DX-40 — блокировка дифференциала</text><text x="32" y="147" font-size="20" fill="#466279" font-weight="500" text-anchor="start">Управляемая водителем блокировка дифференциала переднего ведущего моста</text><path d="M195 360H525" fill="none" stroke="#647f92" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="360" r="50" fill="url(#metal)" stroke="#526b80" stroke-width="2"/><rect x="181" y="314" width="28" height="92" rx="8" fill="#405664" stroke="#304552" stroke-width="2"/><rect x="511" y="314" width="28" height="92" rx="8" fill="#405664" stroke="#304552" stroke-width="2"/><circle cx="360" cy="360" r="29" fill="#6e899e" stroke="#526b80" stroke-width="2"/><path d="M360 310V230H660" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="660" y="190" width="455" height="95" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="887.5" y="245.5" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Команда водителя</text><rect x="660" y="335" width="455" height="95" rx="13" fill="#e3f1e9" stroke="#a2bbcd" stroke-width="2"/><text x="887.5" y="376" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Блокировка дифференциала</text><text x="887.5" y="405" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">переднего ведущего моста</text><path d="M887 285V335" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="360" y="465" font-size="18" fill="#466279" font-weight="500" text-anchor="middle">Передний мост тандема</text><text x="600" y="590" font-size="18" fill="#466279" font-weight="500" text-anchor="middle">Не схема механизма блокировки, не межосевой дифференциал; без инструкции по включению.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" font-size="18" fill="#8b4029" font-weight="600" text-anchor="middle">PACCAR • DX-40/2025Spec</text><text x="600" y="686" font-size="17" fill="#8b4029" font-weight="500" text-anchor="middle">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
