<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="DX-40 — передача момента в тандеме"><title>DX-40 — передача момента в тандеме</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" font-size="22" fill="#c7e2f5" font-weight="700" text-anchor="start">TrakSOS / Kenworth T680 Next Gen</text><text x="32" y="82" font-size="32" fill="#ffffff" font-weight="700" text-anchor="start">DX-40 — передача момента в тандеме</text><text x="32" y="147" font-size="20" fill="#466279" font-weight="500" text-anchor="start">Ведущая тележка с проходным валом ведущей шестерни (thru-shaft)</text><rect x="55" y="240" width="235" height="100" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="172.5" y="283.5" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">От коробки</text><text x="172.5" y="312.5" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">передач</text><path d="M290 290H465V320" fill="none" stroke="#286a9b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 375H630" fill="none" stroke="#647f92" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><circle cx="465" cy="375" r="50" fill="url(#metal)" stroke="#526b80" stroke-width="2"/><rect x="286" y="329" width="28" height="92" rx="8" fill="#405664" stroke="#304552" stroke-width="2"/><rect x="616" y="329" width="28" height="92" rx="8" fill="#405664" stroke="#304552" stroke-width="2"/><path d="M300 540H630" fill="none" stroke="#647f92" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><circle cx="465" cy="540" r="50" fill="url(#metal)" stroke="#526b80" stroke-width="2"/><rect x="286" y="494" width="28" height="92" rx="8" fill="#405664" stroke="#304552" stroke-width="2"/><rect x="616" y="494" width="28" height="92" rx="8" fill="#405664" stroke="#304552" stroke-width="2"/><path d="M465 425V490" fill="none" stroke="#286a9b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="745" y="230" width="400" height="105" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="945" y="276" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Передний ведущий мост</text><text x="945" y="305" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Проходной вал</text><rect x="745" y="400" width="400" height="105" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="945" y="460.5" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Задний ведущий мост</text><path d="M515 375H675V282H745" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M515 540H675V452H745" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="617" font-size="18" fill="#466279" font-weight="500" text-anchor="middle">Условные силовые связи; геометрия редуктора и межосевого привода не показана.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" font-size="18" fill="#8b4029" font-weight="600" text-anchor="middle">PACCAR • DX-40/2025Spec</text><text x="600" y="686" font-size="17" fill="#8b4029" font-weight="500" text-anchor="middle">Учебная функциональная схема. Не монтажная документация. Экспертная проверка ожидается.</text></g></svg>
