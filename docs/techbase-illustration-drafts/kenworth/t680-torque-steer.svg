<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Torque Assisted Steering"><title>Torque Assisted Steering</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" font-size="22" fill="#c7e2f5" font-weight="700" text-anchor="start">TrakSOS / Kenworth T680 Next Gen</text><text x="32" y="82" font-size="32" fill="#ffffff" font-weight="700" text-anchor="start">Torque Assisted Steering</text><text x="32" y="147" font-size="20" fill="#466279" font-weight="500" text-anchor="start">Электрическая помощь гидравлическому рулевому механизму</text><circle cx="160" cy="330" r="88" fill="#dce7ef" stroke="#526b80" stroke-width="2"/><circle cx="160" cy="330" r="64" fill="#f8fafc" stroke="#526b80" stroke-width="2"/><circle cx="160" cy="330" r="18" fill="#819db1" stroke="#526b80" stroke-width="2"/><path d="M160 348V435H450" fill="none" stroke="#526b80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="450" y="330" width="260" height="140" rx="18" fill="url(#metal)" stroke="#526b80" stroke-width="2"/><text x="580" y="390" font-size="24" fill="#17354e" font-weight="500" text-anchor="middle">Рулевой</text><text x="580" y="423" font-size="24" fill="#17354e" font-weight="500" text-anchor="middle">механизм</text><rect x="450" y="195" width="260" height="85" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="580" y="245.5" font-size="22" fill="#17354e" font-weight="500" text-anchor="middle">Электромотор</text><path d="M580 280V330" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" 