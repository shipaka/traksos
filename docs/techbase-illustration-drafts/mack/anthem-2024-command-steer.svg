<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Command Steer — активное рулевое управление"><title>Command Steer — активное рулевое управление</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2469a0"/></marker><linearGradient id="m"><stop stop-color="#e2eaf0"/><stop offset=".55" stop-color="#93aaba"/><stop offset="1" stop-color="#d2e0e9"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#12334d"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e0f2" font-weight="700">TrakSOS  /  Mack Anthem • 2024</text><text x="32" y="82" text-anchor="start" font-size="32" fill="#ffffff" font-weight="700">Command Steer — активное рулевое управление</text><text x="32" y="147" text-anchor="start" font-size="21" fill="#49647b" font-weight="500">На выставочной комплектации 70″ Sleeper: электромотор дополняет гидравлический механизм</text><circle cx="185" cy="285" r="88" fill="#dce7ee" stroke="#48677d" stroke-width="2"/><circle cx="185" cy="285" r="61" fill="#f8fafc" stroke="#48677d" stroke-width="2"/><circle cx="185" cy="285" r="19" fill="#7894a7" stroke="#48677d" stroke-width="2"/><path d="M185 304V430" stroke="#587486" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="467" text-anchor="middle" font-size="19" fill="#49647b" font-weight="500">Рулевое колесо</text><rect x="490" y="268" width="240" height="140" rx="22" fill="url(#m)" stroke="#546e81" stroke-width="2"/><text x="610" y="322" text-anchor="middle" font-size="25" fill="#18354d" font-weight="500">Рулевой</text><text x="610" y="357" text-anchor="middle" font-size="25" fill="#18354d" font-weight="500">механизм</text><rect x="520" y="188" width="180" height="63" rx="14" fill="#668496" stroke="#39566b" stroke-width="2"/><text x="610" y="226" text-anchor="middle" font-size="22" fill="white" font-weight="700">Электромотор</text><path d="M610 251V268" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M185 430H420V338H490" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="865" y="278" width="280" height="120" rx="14" fill="#edf4fa" stroke="#a5bccc" stroke-width="2"/><text x="1005" y="330.5" text-anchor="middle" font-size="23" fill="#18354d" font-weight="500">Управляемые</text><text x="1005" y="361.5" text-anchor="middle" font-size="23" fill="#18354d" font-weight="500">колёса</text><path d="M730 338H865" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="370" y="500" width="460" height="85" rx="14" fill="#e3f1e9" stroke="#a5bccc" stroke-width="2"/><text x="600" y="550.5" text-anchor="middle" font-size="19" fill="#18354d" font-weight="500">Гидравлическое усиление + электрическая помощь</text><text x="600" y="617" text-anchor="middle" font-size="19" fill="#49647b" font-weight="500">Не схема подключения датчиков, насоса или блока управления.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e8" stroke="#e5c3ae" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8c3f2b" font-weight="600">Mack Trucks: TMC 2024 / Command Steer 2020</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8c3f2b" font-weight="500">Учебная функциональная иллюстрация. Не монтажная схема. Экспертная проверка ожидается.</text></g></svg>
