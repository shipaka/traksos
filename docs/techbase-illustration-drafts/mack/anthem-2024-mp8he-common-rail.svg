<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="MP8HE — система Common Rail"><title>MP8HE — система Common Rail</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2469a0"/></marker><linearGradient id="m"><stop stop-color="#e2eaf0"/><stop offset=".55" stop-color="#93aaba"/><stop offset="1" stop-color="#d2e0e9"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#12334d"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e0f2" font-weight="700">TrakSOS  /  Mack Anthem • 2024</text><text x="32" y="82" text-anchor="start" font-size="32" fill="#ffffff" font-weight="700">MP8HE — система Common Rail</text><text x="32" y="147" text-anchor="start" font-size="21" fill="#49647b" font-weight="500">Управление параметрами прямого впрыска; форма и расположение деталей условны</text><rect x="90" y="255" width="290" height="44" rx="8" fill="url(#m)" stroke="#4f6c80" stroke-width="2"/><path d="M110 299v75" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="374" width="20" height="75" rx="6" fill="url(#m)" stroke="#536c80" stroke-width="2"/><path d="M159 299v75" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="149" y="374" width="20" height="75" rx="6" fill="url(#m)" stroke="#536c80" stroke-width="2"/><path d="M208 299v75" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="198" y="374" width="20" height="75" rx="6" fill="url(#m)" stroke="#536c80" stroke-width="2"/><path d="M257 299v75" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="247" y="374" width="20" height="75" rx="6" fill="url(#m)" stroke="#536c80" stroke-width="2"/><path d="M306 299v75" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="296" y="374" width="20" height="75" rx="6" fill="url(#m)" stroke="#536c80" stroke-width="2"/><path d="M355 299v75" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="345" y="374" width="20" height="75" rx="6" fill="url(#m)" stroke="#536c80" stroke-width="2"/><text x="235" y="480" text-anchor="middle" font-size="19" fill="#49647b" font-weight="500">Условная рампа и 6 форсунок</text><rect x="475" y="250" width="245" height="180" rx="14" fill="#edf4fa" stroke="#a5bccc" stroke-width="2"/><text x="597.5" y="317" text-anchor="middle" font-size="23" fill="#18354d" font-weight="500">Электронное</text><text x="597.5" y="348" text-anchor="middle" font-size="23" fill="#18354d" font-weight="500">управление</text><text x="597.5" y="379" text-anchor="middle" font-size="23" fill="#18354d" font-weight="500">впрыском</text><rect x="815" y="190" width="340" height="100" rx="14" fill="#edf4fa" stroke="#a5bccc" stroke-width="2"/><text x="985" y="248" text-anchor="middle" font-size="23" fill="#18354d" font-weight="500">Давление</text><rect x="815" y="325" width="340" height="100" rx="14" fill="#edf4fa" stroke="#a5bccc" stroke-width="2"/><text x="985" y="383" text-anchor="middle" font-size="23" fill="#18354d" font-weight="500">Момент впрыска</text><rect x="815" y="460" width="340" height="100" rx="14" fill="#edf4fa" stroke="#a5bccc" stroke-width="2"/><text x="985" y="518" text-anchor="middle" font-size="23" fill="#18354d" font-weight="500">Количество топлива</text><path d="M380 277H435V340H475" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/><path d="M720 340H760V240H815" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M720 340H760V375H815" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M760 375V510H815" stroke="#2469a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="600" y="608" text-anchor="middle" font-size="19" fill="#49647b" font-weight="500">Пунктир — функциональная связь, не электрическая распиновка.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e8" stroke="#e5c3ae" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8c3f2b" font-weight="600">Mack Trucks: MP8HE / direct injection</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8c3f2b" font-weight="500">Учебная функциональная иллюстрация. Не монтажная схема. Экспертная проверка ожидается.</text></g></svg>
