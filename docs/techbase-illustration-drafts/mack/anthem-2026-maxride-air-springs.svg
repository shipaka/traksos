56" rx="8" fill="#fff1e8" stroke="#e5c3ae" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8c3f2b" font-weight="600">Mack Trucks: MaxRide / new platform</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8c3f2b" font-weight="500">Учебная функциональная иллюстрация. Не монтажная схема. Экспертная проверка ожидается.</text></g></svg>
