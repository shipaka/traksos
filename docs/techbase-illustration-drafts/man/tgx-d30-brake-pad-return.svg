<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Дисковые тормоза — возврат колодок"><title>Дисковые тормоза — возврат колодок</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / MAN TGX D30 PowerLion • MY2025</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">Дисковые тормоза — возврат колодок</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#466279" font-weight="500">Обновлённая версия для тяжёлых автомобилей MAN от 18 т</text><rect x="50" y="190" width="530" height="405" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><rect x="620" y="190" width="530" height="405" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="315" y="235" text-anchor="middle" font-size="27" fill="#17354e" font-weight="700">Торможение</text><text x="885" y="235" text-anchor="middle" font-size="27" fill="#17354e" font-weight="700">После отпускания</text><rect x="298" y="273" width="34" height="254" rx="4" fill="url(#metal)" stroke="#536b7d" stroke-width="2"/><rect x="238" y="310" width="51" height="180" rx="5" fill="#b58a58" stroke="#856b4f" stroke-width="2"/><rect x="341" y="310" width="51" height="180" rx="5" fill="#b58a58" stroke="#856b4f" stroke-width="2"/><path d="M170 285H460V515H170Z" fill="none" stroke="#526b80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="868" y="273" width="34" height="254" rx="4" fill="url(#metal)" stroke="#536b7d" stroke-width="2"/><rect x="783" y="310" width="51" height="180" rx="5" fill="#b58a58" stroke="#856b4f" stroke-width="2"/><rect x="936" y="310" width="51" height="180" rx="5" fill="#b58a58" stroke="#856b4f" stroke-width="2"/><path d="M740 285H1030V515H740Z" fill="none" stroke="#526b80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M820 400H760" fill="none" stroke="#286a9b" stroke-width="4" marker-end="url(#arrow)"/><path d="M950 400H1010" fill="none" stroke="#286a9b" stroke-width="4" marker-end="url(#arrow)"/><text x="315" y="563" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Условное прижатие колодок</text><text x="885" y="563" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Пружинные элементы отводят колодки</text><text x="600" y="622" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Показан принцип возврата; форма пружин и суппорта не воспроизведена.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">MAN Truck &amp; Bus • IAA 2024, модельный год 2025</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Функциональная иллюстрация. Не монтажная документация. Независимая проверка ожидается.</text></g></svg>
