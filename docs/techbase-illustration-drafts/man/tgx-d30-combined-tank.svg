<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Комбинированный бак — дизель и AdBlue"><title>Комбинированный бак — дизель и AdBlue</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / MAN TGX D30 PowerLion • MY2025</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">Комбинированный бак — дизель и AdBlue</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#466279" font-weight="500">Один из новых вариантов компоновки MY2025; секции разделены</text><rect x="135" y="238" width="930" height="250" rx="34" fill="url(#metal)" stroke="#536b7d" stroke-width="2"/><rect x="160" y="263" width="704" height="200" rx="18" fill="#dce4e8" stroke="#70899b" stroke-width="2"/><rect x="882" y="263" width="158" height="200" rx="18" fill="#b9e0f5" stroke="#70899b" stroke-width="2"/><path d="M873 250V475" fill="none" stroke="#526b80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="512" y="350" text-anchor="middle" font-size="28" fill="#17354e" font-weight="700">Дизель</text><text x="512" y="397" text-anchor="middle" font-size="36" fill="#17354e" font-weight="700">690 л</text><text x="961" y="350" text-anchor="middle" font-size="25" fill="#17354e" font-weight="700">AdBlue</text><text x="961" y="397" text-anchor="middle" font-size="28" fill="#17354e" font-weight="700">165 л</text><text x="600" y="548" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Отсеки отделены друг от друга; пропорции и форма условны.</text><text x="600" y="583" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Не универсальная ёмкость для всех D30 и не чертёж монтажа.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">MAN Truck &amp; Bus • IAA 2024, модельный год 2025</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Функциональная иллюстрация. Не монтажная документация. Независимая проверка ожидается.</text></g></svg>
