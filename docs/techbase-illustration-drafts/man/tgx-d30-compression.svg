<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="D30 и D26 — степень сжатия"><title>D30 и D26 — степень сжатия</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / MAN TGX D30 PowerLion • MY2025</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">D30 и D26 — степень сжатия</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#466279" font-weight="500">Сравнение конструктивного параметра, не измерение давления компрессии</text><rect x="60" y="185" width="520" height="415" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><rect x="620" y="185" width="520" height="415" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="320" y="235" text-anchor="middle" font-size="28" fill="#17354e" font-weight="700">D26</text><text x="880" y="235" text-anchor="middle" font-size="28" fill="#17354e" font-weight="700">D30</text><path d="M230 270V475H410V270" fill="none" stroke="#536b7d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="237" y="315" width="166" height="110" rx="4" fill="url(#metal)" stroke="#536b7d" stroke-width="2"/><path d="M320 425V505" fill="none" stroke="#536b7d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="557" text-anchor="middle" font-size="32" fill="#17354e" font-weight="700">21 : 1</text><path d="M790 270V475H970V270" fill="none" stroke="#536b7d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="797" y="290" width="166" height="110" rx="4" fill="url(#metal)" stroke="#536b7d" stroke-width="2"/><path d="M880 400V505" fill="none" stroke="#536b7d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="880" y="557" text-anchor="middle" font-size="32" fill="#17354e" font-weight="700">23 : 1</text><text x="600" y="626" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Схема не масштабная: ε = полный объём цилиндра / объём камеры сгорания.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">MAN • D30 PowerLion, техническое описание</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Функциональная иллюстрация. Не монтажная документация. Независимая проверка ожидается.</text></g></svg>
