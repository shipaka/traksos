<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="CRB — компрессионный моторный тормоз"><title>CRB — компрессионный моторный тормоз</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / MAN TGX D30 PowerLion • MY2025</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">CRB — компрессионный моторный тормоз</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#466279" font-weight="500">Принцип сброса энергии сжатия в конце такта; опциональная система</text><rect x="65" y="185" width="500" height="415" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><path d="M160 274V524H470V274" fill="none" stroke="#536b7d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="178" y="354" width="274" height="112" rx="5" fill="url(#metal)" stroke="#536b7d" stroke-width="2"/><path d="M315 466V545" fill="none" stroke="#536b7d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M383 220V309" fill="none" stroke="#536b7d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 309H406" fill="none" stroke="#536b7d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 327H480V250" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M236 235L383 235L436 206" fill="none" stroke="#536b7d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="287" cy="235" r="22" fill="url(#metal)" stroke="#526b80" stroke-width="2"/><text x="315" y="576" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Условный клапан и дополнительное коромысло</text><rect x="650" y="215" width="480" height="100" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="890" y="258.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Ближе к ВМТ такта сжатия</text><text x="890" y="287.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Дополнительный подъём клапана</text><rect x="650" y="355" width="480" height="100" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="890" y="398.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Сжатый воздух выходит</text><text x="890" y="427.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Энергия не возвращается поршню</text><path d="M890 315V355" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="650" y="500" width="480" height="90" rx="13" fill="#e3f1e9" stroke="#a2bbcd" stroke-width="2"/><text x="890" y="553" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Тормозная мощность до 355 кВт</text><path d="M890 455V500" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">MAN • D30 PowerLion, техническое описание</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Функциональная иллюстрация. Не монтажная документация. Независимая проверка ожидается.</text></g></svg>
