<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Retarder 47 — отключаемый замедлитель"><title>Retarder 47 — отключаемый замедлитель</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / MAN TGX D30 PowerLion • MY2025</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">Retarder 47 — отключаемый замедлитель</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#466279" font-weight="500">Опция D30; функциональные режимы, не устройство муфты</text><rect x="50" y="190" width="530" height="405" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><rect x="620" y="190" width="530" height="405" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="315" y="235" text-anchor="middle" font-size="28" fill="#17354e" font-weight="700">Движение</text><text x="885" y="235" text-anchor="middle" font-size="28" fill="#17354e" font-weight="700">Замедление</text><path d="M110 350H520" fill="none" stroke="#536b7d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="315" cy="350" r="69" fill="url(#metal)" stroke="#526b80" stroke-width="2"/><circle cx="315" cy="350" r="44" fill="#dbe8f0" stroke="#526b80" stroke-width="2"/><path d="M315 419V438M315 460V475" fill="none" stroke="#536b7d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="165" y="475" width="300" height="69" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="315" y="517.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Замедлитель отсоединён</text><path d="M680 350H1090" fill="none" stroke="#536b7d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="885" cy="350" r="69" fill="url(#metal)" stroke="#526b80" stroke-width="2"/><circle cx="885" cy="350" r="44" fill="#dbe8f0" stroke="#526b80" stroke-width="2"/><path d="M885 419V475" fill="none" stroke="#286a9b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="735" y="475" width="300" height="69" rx="13" fill="#e3f1e9" stroke="#a2bbcd" stroke-width="2"/><text x="885" y="517.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Замедлитель включён</text><text x="600" y="622" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">До 4700 Н·м для Retarder 47. Не суммировать с CRB без заводской спецификации.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">MAN Truck &amp; Bus • IAA 2024, модельный год 2025</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Функциональная иллюстрация. Не монтажная документация. Независимая проверка ожидается.</text></g></svg>
