<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="TipMatic 14 — SmartShifting"><title>TipMatic 14 — SmartShifting</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#286a9b"/></marker><linearGradient id="metal"><stop stop-color="#e6edf2"/><stop offset=".55" stop-color="#97adbd"/><stop offset="1" stop-color="#dce6ee"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="110" fill="#14334e"/><text x="32" y="38" text-anchor="start" font-size="22" fill="#c7e2f5" font-weight="700">TrakSOS / MAN TGX D30 PowerLion • MY2025</text><text x="32" y="82" text-anchor="start" font-size="32" fill="white" font-weight="700">TipMatic 14 — SmartShifting</text><text x="32" y="147" text-anchor="start" font-size="20" fill="#466279" font-weight="500">Согласование частоты вращения двигателя и переключения передач</text><rect x="55" y="210" width="335" height="120" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="222.5" y="263.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Данные датчиков</text><text x="222.5" y="292.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Нагрузка и уклон</text><rect x="450" y="210" width="300" height="120" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="600" y="263.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Стратегия</text><text x="600" y="292.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">переключения</text><rect x="810" y="210" width="335" height="120" rx="13" fill="#eaf2f9" stroke="#a2bbcd" stroke-width="2"/><text x="977.5" y="263.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Коррекция оборотов</text><text x="977.5" y="292.5" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">двигателя</text><path d="M390 270H450" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M750 270H810" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="375" y="460" width="450" height="115" rx="13" fill="#e3f1e9" stroke="#a2bbcd" stroke-width="2"/><text x="600" y="511" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">Автоматическое управление</text><text x="600" y="540" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">сцеплением и передачей</text><path d="M600 330V460" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M977 330V400H825V517" fill="none" stroke="#286a9b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="615" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Логические зависимости, не схема CAN, датчиков или распиновки.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">MAN Truck &amp; Bus • IAA 2024, модельный год 2025</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Функциональная иллюстрация. Не монтажная документация. Независимая проверка ожидается.</text></g></svg>
