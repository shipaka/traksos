" y="352" text-anchor="middle" font-size="24" fill="#17354e" font-weight="700">14</text><text x="1062" y="375" text-anchor="middle" font-size="17" fill="#17354e" font-weight="500">Overdrive</text><text x="600" y="442" text-anchor="middle" font-size="25" fill="#17354e" font-weight="700">Назад</text><rect x="70" y="470" width="123" height="62" rx="13" fill="#e3f1e9" stroke="#8db7a4" stroke-width="2"/><text x="131" y="508" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">R1</text><rect x="203" y="470" width="123" height="62" rx="13" fill="#e3f1e9" stroke="#8db7a4" stroke-width="2"/><text x="264" y="508" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">R2</text><rect x="336" y="470" width="123" height="62" rx="13" fill="#f3f6f8" stroke="#b8c8d3" stroke-width="2"/><text x="397" y="508" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">R3</text><rect x="469" y="470" width="123" height="62" rx="13" fill="#f3f6f8" stroke="#b8c8d3" stroke-width="2"/><text x="530" y="508" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">R4</text><rect x="602" y="470" width="123" height="62" rx="13" fill="#f3f6f8" stroke="#b8c8d3" stroke-width="2"/><text x="663" y="508" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">R5</text><rect x="735" y="470" width="123" height="62" rx="13" fill="#f3f6f8" stroke="#b8c8d3" stroke-width="2"/><text x="796" y="508" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">R6</text><rect x="868" y="470" width="123" height="62" rx="13" fill="#f3f6f8" stroke="#b8c8d3" stroke-width="2"/><text x="929" y="508" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">R7</text><rect x="1001" y="470" width="123" height="62" rx="13" fill="#f3f6f8" stroke="#b8c8d3" stroke-width="2"/><text x="1062" y="508" text-anchor="middle" font-size="22" fill="#17354e" font-weight="500">R8</text><text x="600" y="579" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">R1–R2 штатно; R3–R8 — дополнительная активация MAN Now.</text><text x="600" y="607" text-anchor="middle" font-size="18" fill="#466279" font-weight="500">Это таблица режимов, не кинематическая схема и не числовые передаточные отношения.</text><rect x="22" y="642" width="1156" height="56" rx="8" fill="#fff1e9" stroke="#e9c5b3" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-size="18" fill="#8b4029" font-weight="600">MAN Truck &amp; Bus • IAA 2024, модельный год 2025</text><text x="600" y="686" text-anchor="middle" font-size="17" fill="#8b4029" font-weight="500">Функциональная иллюстрация. Не монтажная документация. Независимая проверка ожидается.</text></g></svg>
