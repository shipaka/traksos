<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">MAN TGX 18.430 — картридж осушителя</title><desc id="d">Авторская условная иллюстрация детали с каталожным артикулом и размерами. Не монтажный чертёж.</desc><rect width="1000" height="680" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="35" y="44" font-size="18" fill="#7dd3fc">TrakSOS · MAN · MANN-FILTER</text><text x="35" y="85" font-size="28" font-weight="700">MAN TGX 18.430 — картридж осушителя</text><text x="35" y="115" font-size="17" fill="#bdd0de">D 2676 · с 2019-01 · TB 1394/16 x</text><rect x="35" y="135" width="930" height="367" rx="16" fill="#192f45" stroke="#51677b"/><g id="h-dryer" data-article="TB 1394/16 x"><rect x="260" y="211" width="268" height="234" rx="22" fill="#91a4af" stroke="#d3e2e9" stroke-width="4"/><ellipse cx="394" cy="211" rx="134" ry="34" fill="#c7d3d9" stroke="#e3edf0" stroke-width="3"/><rect x="270" y="391" width="248" height="33" rx="7" fill="#395364"/><text x="394" y="320" font-size="25" font-weight="700" text-anchor="middle" fill="#152d44">TB 1394/16 x</text><text x="394" y="347" font-size="16" text-anchor="middle" fill="#152d44">Advanced</text></g><g stroke="#7dd3fc" stroke-width="2" fill="none"><path d="M260 169 H528 M260 159 V179 M528 159 V179"/><path d="M554 211 V445 M546 211 H562 M546 445 H562"/></g><text x="394" y="156" font-size="17" text-anchor="middle">Ø136 мм</text><text x="575" y="330" font-size="17">164 мм</text><g transform="translate(712 328)"><circle r="92" fill="#718a9b" stroke="#c6d9e5" stroke-width="3"/><circle r="41" fill="#192f45" stroke="#a3b9c7" stroke-width="5"/><circle r="64" fill="none" stroke="#435d71" stroke-width="4" stroke-dasharray="5 5"/><text y="123" text-anchor="middle" font-size="16">Присоединение M39×1,5</text></g><text x="712" y="211" text-anchor="middle" font-size="16">Вид основания условный</text><text x="35" y="542" font-size="20" font-weight="700">Назначение и ограничения</text><text x="35" y="573" font-size="17">Картридж предназначен для осушения и очистки сжатого воздуха.</text><text x="35" y="598" font-size="17">Исполнение с коалесцентной очисткой для повышенной потребности в воздухе.</text><text x="35" y="647" font-size="16" fill="#f1c87e">Черновик · VIN и экспертная проверка обязательны · не инструкция по ремонту</text></g></svg>