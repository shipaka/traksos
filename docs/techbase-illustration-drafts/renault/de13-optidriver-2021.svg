<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Renault Trucks — Optidriver, обновление 2021"><title>Renault Trucks — Optidriver, обновление 2021</title><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1764a4"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b8492e"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#08775e"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="105" fill="#12304b"/><text x="34" y="42" font-size="23" fill="#d5e8f7" font-weight="700" text-anchor="start">TrakSOS | Техническая база</text><text x="34" y="82" font-size="33" fill="white" font-weight="700" text-anchor="start">Renault Trucks — Optidriver, обновление 2021</text><text x="34" y="143" font-size="22" fill="#405a70" font-weight="500" text-anchor="start">Три изменения управления коробкой передач, заявленные производителем</text><rect x="65" y="205" width="320" height="120" rx="16" fill="#eaf3fb" stroke="#a8bfd4" stroke-width="2"/><text x="225" y="258" font-size="24" fill="#13283d" font-weight="500" text-anchor="middle">Обновлённый</text><text x="225" y="288" font-size="24" fill="#13283d" font-weight="500" text-anchor="middle">контроллер КПП</text><rect x="440" y="205" width="320" height="120" rx="16" fill="#eaf3fb" stroke="#a8bfd4" stroke-width="2"/><text x="600" y="258" font-size="24" fill="#13283d" font-weight="500" text-anchor="middle">Новое ПО</text><text x="600" y="288" font-size="24" fill="#13283d" font-weight="500" text-anchor="middle">управления</text><rect x="815" y="205" width="320" height="120" rx="16" fill="#eaf3fb" stroke="#a8bfd4" stroke-width="2"/><text x="975" y="258" font-size="24" fill="#13283d" font-weight="500" text-anchor="middle">Новый привод</text><text x="975" y="288" font-size="24" fill="#13283d" font-weight="500" text-anchor="middle">сцепления</text><rect x="280" y="465" width="640" height="120" rx="16" fill="#e6f5ed" stroke="#a8bfd4" stroke-width="2"/><text x="600" y="518" font-size="24" fill="#13283d" font-weight="500" text-anchor="middle">Более плавное и быстрое</text><text x="600" y="548" font-size="24" fill="#13283d" font-weight="500" text-anchor="middle">переключение передач</text><path d="M225 325 V385 H420 V465" fill="none" stroke="#1764a4" stroke-width="5" stroke-linecap="round"  marker-end="url(#blue)"/><path d="M600 325 V465" fill="none" stroke="#1764a4" stroke-width="5" stroke-linecap="round"  marker-end="url(#blue)"/><path d="M975 325 V385 H780 V465" fill="none" stroke="#1764a4" stroke-width="5" stroke-linecap="round"  marker-end="url(#blue)"/><text x="600" y="425" font-size="21" fill="#405a70" font-weight="500" text-anchor="middle">Функциональные связи, не электрические соединения</text><rect x="24" y="646" width="1152" height="50" rx="8" fill="#fff0e9"/><text x="600" y="677" font-size="19" fill="#923920" font-weight="600" text-anchor="middle">Учебная функциональная схема • не монтажная документация • экспертная проверка ожидается</text></g></svg>
