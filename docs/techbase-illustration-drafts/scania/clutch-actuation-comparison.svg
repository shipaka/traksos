<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Scania R: сравнение функций привода сцепления</title><desc id="d">Ручной гидравлический и автоматизированный приводы, без утверждения совместимости компонентов.</desc><defs><linearGradient id="m" x2="0" y2="1"><stop stop-color="#e1e8ed"/><stop offset="1" stop-color="#8193a3"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#246a98"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#445566"/></marker></defs><rect width="1200" height="650" rx="16" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#172b3b"><text x="36" y="48" font-size="30" font-weight="bold">SCANIA R · ПРИВОД СЦЕПЛЕНИЯ</text><text x="36" y="78" font-size="17">Сравнение функциональных принципов · не монтажный чертёж</text><rect x="35" y="102" width="1130" height="220" rx="16" fill="#fff" stroke="#bdcbd8"/><text x="58" y="132" font-size="21" font-weight="bold">A · Педальный гидравлический привод</text><g stroke="#445566" stroke-width="5" fill="none"><path d="M105 170L134 245L172 231"/><path d="M82 252L161 252"/></g><rect x="205" y="177" width="150" height="55" rx="16" fill="url(#m)" stroke="#526779"/><rect x="236" y="163" width="50" height="16" rx="5" fill="#cfdae3"/><path d="M174 212H205 M355 204H475" stroke="#246a98" stroke-width="4" marker-end="url(#a)"/><rect x="475" y="168" width="195" height="75" rx="25" fill="url(#m)" stroke="#526779"/><path d="M670 205H820" stroke="#445566" stroke-width="7" marker-end="url(#b)"/><g fill="url(#m)" stroke="#526779" stroke-width="2"><ellipse cx="865" cy="205" rx="30" ry="61"/><ellipse cx="915" cy="205" rx="30" ry="61"/><ellipse cx="965" cy="205" rx="30" ry="61"/></g><g font-size="15" text-anchor="middle"><text x="125" y="285">Педаль</text><text x="280" y="270">Главный цилиндр</text><text x="280" y="291">2556024 · пример</text><text x="572" y="270">Усилитель · варианты</text><text x="572" y="291">2550304 / 2550905</text><text x="915" y="285">Выключение сцепления</text></g><rect x="35" y="340" width="1130" height="180" rx="16" fill="#fff" stroke="#bdcbd8"/><text x="58" y="372" font-size="21" font-weight="bold">B · Автоматизированный привод Opticruise</text><rect x="80" y="400" width="240" height="65" rx="10" fill="#e1edf7" stroke="#246a98"/><text x="200" y="427" text-anchor="middle" font-size="18">Электронное управление</text><text x="200" y="450" text-anchor="middle" font-size="14">точный блок неизвестен</text><path d="M320 433H470" stroke="#246a98" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="470" y="395" width="235" height="75" rx="22" fill="url(#m)" stroke="#526779"/><text x="587" y="425" text-anchor="middle" font-size="17">Исполнительный механизм</text><text x="587" y="448" text-anchor="middle" font-size="14">тип и артикул по КПП</text><path d="M705 433H845" stroke="#445566" stroke-width="6" marker-end="url(#b)"/><g fill="url(#m)" stroke="#526779"><ellipse cx="870" cy="433" rx="22" ry="45"/><ellipse cx="910" cy="433" rx="22" ry="45"/><ellipse cx="950" cy="433" rx="22" ry="45"/></g><text x="910" y="500" text-anchor="middle" font-size="15">Выключение сцепления</text><text x="37" y="555" font-size="16">Артикулы в A — каталожные примеры семейства R, не доказательство совместной установки.</text><text x="37" y="583" font-size="16">B: не переносить артикулы A на автоматизированный привод; геометрия и соединения условны.</text><text x="37" y="617" font-size="14" fill="#64748b">Источники: Cojali Parts; Scania R-series specifications. Экспертная проверка ожидается.</text></g></svg>
