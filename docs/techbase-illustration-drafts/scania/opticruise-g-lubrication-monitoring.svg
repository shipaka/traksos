<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Scania Opticruise G25/G33/G38 — смазка и контроль</title><desc id="d">Функциональная карта смазки и контроля температуры и уровня масла, без монтажных координат.</desc><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#dce4eb"/><stop offset="1" stop-color="#8295a5"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b57422"/></marker></defs><rect width="1200" height="620" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b3b"><text x="38" y="50" font-size="29" font-weight="bold">OPTICRUISE G25 / G33 / G38</text><text x="38" y="78" font-size="18">Смазка и мониторинг · функциональная карта, не разрез КПП</text><g font-size="16" font-weight="bold" text-anchor="middle"><rect x="40" y="102" width="220" height="48" rx="8" fill="#e2e8f0"/><text x="150" y="132">G25 · 2500 Н·м</text><rect x="275" y="102" width="220" height="48" rx="8" fill="#e2e8f0"/><text x="385" y="132">G33 · 3300 Н·м</text><rect x="510" y="102" width="220" height="48" rx="8" fill="#e2e8f0"/><text x="620" y="132">G38 · 3800 Н·м</text></g><rect x="65" y="183" width="650" height="275" rx="40" fill="url(#metal)" stroke="#526979" stroke-width="3"/><path d="M90 385H690V423Q690 435 675 435H110Q90 435 90 416Z" fill="#c79143" opacity=".85"/><text x="390" y="414" font-size="20" text-anchor="middle">Масло КПП · условный резервуар</text><g fill="#f1f5f9" stroke="#475569" stroke-width="4"><circle cx="245" cy="285" r="57"/><circle cx="355" cy="285" r="47"/><circle cx="444" cy="285" r="39"/></g><g fill="none" stroke="#64748b" stroke-width="5"><circle cx="245" cy="285" r="16"/><circle cx="355" cy="285" r="12"/><circle cx="444" cy="285" r="10"/><path d="M184 285H145 M485 285H640"/></g><path d="M190 213H475" stroke="#b57422" stroke-width="7" stroke-linecap="round"/><g stroke="#b57422" stroke-width="3" stroke-dasharray="4 6"><path d="M220 218v37 M300 218v37 M390 218v37 M450 218v27"/></g><text x="350" y="200" font-size="15" text-anchor="middle">Распыление масла</text><text x="350" y="365" font-size="18" text-anchor="middle">Зубчатые передачи (условно)</text><rect x="760" y="177" width="380" height="62" rx="12" fill="#fff1d6" stroke="#b57422"/><text x="950" y="215" font-size="19" text-anchor="middle">Масляный фильтр</text><path d="M715 215H760" stroke="#b57422" stroke-width="3" stroke-dasharray="6 5"/><g fill="#e2f0fb" stroke="#2174a5"><rect x="760" y="265" width="180" height="64" rx="10"/><rect x="960" y="265" width="180" height="64" rx="10"/><rect x="760" y="385" width="380" height="74" rx="10"/></g><g text-anchor="middle" font-size="16"><text x="850" y="302">Датчик уровня</text><text x="1050" y="292">Датчик</text><text x="1050" y="312">температуры</text><text x="950" y="416" font-weight="bold">Контур мониторинга</text><text x="950" y="438">электрические соединения не установлены</text></g><path d="M850 329V365H950V385 M1050 329V365H950" stroke="#2174a5" stroke-width="3" stroke-dasharray="7 5" fill="none"/><path d="M715 409H735V297H760 M735 297V250H1050V265" stroke="#2174a5" stroke-width="2" stroke-dasharray="5 4" fill="none"/><text x="40" y="512" font-size="16">Схема показывает функции, не фактическое положение компонентов и не порядок протока.</text><text x="40" y="543" font-size="16">Артикулы датчиков масла, расположение насоса и распиновка требуют документации по номеру КПП.</text><text x="40" y="580" font-size="14" fill="#64748b">Источник: Scania, Opticruise G25, G33 &amp; G38, стр. 2 и 4. Авторская схема. Экспертная проверка ожидается.</text></g></svg>
