<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Scania Twin SCR — функциональный контур</title><desc id="desc">Две точки дозирования, два катализатора SCR и DPF между ними; не монтажная схема.</desc><defs><linearGradient id="steel" x2="0" y2="1"><stop stop-color="#d8e3ec"/><stop offset=".5" stop-color="#91a5b7"/><stop offset="1" stop-color="#526779"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b45309"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176aaf"/></marker><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0H12V12H0Z M0 0L12 12" fill="none" stroke="#cbd5e1" stroke-width="1"/></pattern></defs><rect width="1200" height="510" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#102638"><text x="40" y="52" font-size="30" font-weight="bold">SCANIA SUPER · TWIN SCR</text><text x="40" y="82" font-size="16">Функциональный обзор по описанию производителя · не монтажный чертёж</text><rect x="75" y="112" width="220" height="68" rx="12" fill="#e1effb" stroke="#176aaf"/><text x="185" y="138" text-anchor="middle" font-size="17" font-weight="bold">AdBlue</text><text x="185" y="160" text-anchor="middle" font-size="14">подача реагента (условно)</text><path d="M295 146H830V235 M345 146V235" stroke="#176aaf" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#b)"/><path d="M70 280H1130" stroke="#b45309" stroke-width="9" fill="none" marker-end="url(#a)"/><g stroke="#526779" stroke-width="2"><rect x="95" y="245" width="145" height="70" rx="20" fill="url(#steel)"/><rect x="400" y="225" width="155" height="110" rx="20" fill="url(#steel)"/><rect x="600" y="225" width="150" height="110" rx="20" fill="url(#steel)"/><rect x="890" y="225" width="155" height="110" rx="20" fill="url(#steel)"/></g><g fill="url(#h)" stroke="#506477"><rect x="425" y="239" width="105" height="82" rx="8"/><rect x="625" y="239" width="100" height="82" rx="8"/><rect x="915" y="239" width="105" height="82" rx="8"/></g><g fill="#176aaf"><path d="M333 239H357L351 267H339Z"/><path d="M818 239H842L836 267H824Z"/></g><g font-size="17" font-weight="bold" text-anchor="middle"><text x="168" y="350">Турбина / выпуск</text><text x="345" y="209">Доза 1</text><text x="477" y="356">SCR 1</text><text x="675" y="356">DPF</text><text x="830" y="209">Доза 2</text><text x="968" y="356">SCR 2</text></g><text x="42" y="410" font-size="15" fill="#b45309">━━ Поток выхлопа</text><text x="260" y="410" font-size="15" fill="#176aaf">┄┄ Подача реагента (условная связь)</text><text x="42" y="446" font-size="15">Точное расположение датчиков NOx, насосов и ЭБУ зависит от исполнения.</text><text x="42" y="475" font-size="14" fill="#64748b">Не использовать для ремонта или определения применяемости по VIN. Экспертная проверка ожидается.</text></g></svg>
