<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img"><title>PRIMA 2830.K · RMC REPTO · BS6 — Рама RMC с поперечинами</title><desc>Специальная рама RMC с клёпаными или болтовыми поперечинами. Вид сверху условный; количество, шаг и крепёж не являются монтажными данными.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#2879a8"/></marker></defs><rect width="1440" height="800" fill="#f2f6fa"/><rect width="1440" height="155" fill="#15263d"/><text x="720" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="650" fill="white">TrakSOS / ТЕХБАЗА / TATA MOTORS</text><text x="720" y="91" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="white">PRIMA 2830.K · RMC REPTO · BS6</text><text x="720" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="500" fill="#dce8f3">Рама RMC с поперечинами</text><rect x="55" y="185" width="1330" height="380" rx="14" fill="white" stroke="#bdd0df" stroke-width="2"/><text x="720" y="224" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="650" fill="#224965">Два лонжерона и поперечные связи</text><rect x="180" y="285" width="1080" height="30" rx="10" fill="#6c8aa3" stroke="#43647c" stroke-width="2"/><rect x="180" y="460" width="1080" height="30" rx="10" fill="#6c8aa3" stroke="#43647c" stroke-width="2"/><rect x="276" y="315" width="28" height="145" rx="10" fill="#a3b7c7" stroke="#4d6d85" stroke-width="2"/><circle cx="290" cy="305" r="6" fill="#e3edf5" stroke="none" stroke-width="3"/><circle cx="290" cy="470" r="6" fill="#e3edf5" stroke="none" stroke-width="3"/><rect x="486" y="315" width="28" height="145" rx="10" fill="#a3b7c7" stroke="#4d6d85" stroke-width="2"/><circle cx="500" cy="305" r="6" fill="#e3edf5" stroke="none" stroke-width="3"/><circ