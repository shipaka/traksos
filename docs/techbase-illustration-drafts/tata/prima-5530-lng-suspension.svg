<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img"><title>PRIMA 5530.S 4×2 · LNG BS6 P2 — Рессорная подвеска 4×2</title><desc>Передняя — параболическая с резиновой втулкой, задняя — полуэллиптическая рессора. Количество листов и размеры рессор не установлены; графика функциональная.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#2879a8"/></marker></defs><rect width="1440" height="800" fill="#f2f6fa"/><rect width="1440" height="155" fill="#15263d"/><text x="720" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="650" fill="white">TrakSOS / ТЕХБАЗА / TATA MOTORS</text><text x="720" y="91" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="white">PRIMA 5530.S 4×2 · LNG BS6 P2</text><text x="720" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="500" fill="#dce8f3">Рессорная подвеска 4×2</text><rect x="55" y="185" width="645" height="380" rx="14" fill="white" stroke="#bdd0df" stroke-width="2"/><text x="377.5" y="224" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="650" fill="#224965">Передняя</text><path d="M145 345 Q377.5 410 610 345" stroke="#567e99" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="145" cy="345" r="12" fill="#354c60" stroke="none" stroke-width="3"/><circle cx="610" cy="345" r="12" fill="#354c60" stroke="none" stroke-width="3"/><text x="377" y="495" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="500" fill="#233c51">Параболическая</text><rect x="740" y="185" width="645" height="380" rx="14" fill="white" stroke="#bdd0df" stroke-width="2"/><text x="1062.5" y="224" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="650" fill="#224965">Задняя</text><path d="M830 320 Q1062.5 385 1295 320" stroke="#567e99" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M840 331 Q1062.5 396 1285 331" stroke="#567e99" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M850 342 Q1062.5 407 1275 342" stroke="#567e99" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M860 353 Q1062.5 418 1265 353" stroke="#567e99" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="830" cy="320" r="12" fill="#354c60" stroke="none" stroke-width="3"/><circle cx="1295" cy="320" r="12" fill="#354c60" stroke="none" stroke-width="3"/><text x="1062" y="495" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="500" fill="#233c51">Полуэллиптическая</text><rect x="45" y="600" width="1350" height="130" rx="10" fill="#e1edf6" stroke="#b8ccdf" stroke-width="2"/><text x="720" y="638" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="500" fill="#233c51">Передняя — параболическая с резиновой втулкой, задняя — полуэллиптическая рессора.</text><text x="720" y="670" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="500" fill="#233c51">Количество листов и размеры рессор не установлены; графика функциональная.</text><text x="720" y="714" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" fill="#48617a">Источник: Tata Motors · evidence.json · PDF: извлечённый текст; скриншот недоступен</text><rect x="0" y="750" width="1440" height="50" fill="#15263d"/><text x="720" y="783" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="white">ФУНКЦИОНАЛЬНЫЙ ЧЕРНОВИК · НЕ МОНТАЖНАЯ СХЕМА · НЕЗАВИСИМАЯ ПРОВЕРКА</text></svg>