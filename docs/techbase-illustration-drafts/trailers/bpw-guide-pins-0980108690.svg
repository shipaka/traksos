<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"><title>BPW 09.801.08.69.0 — Комплект направляющих</title><desc>Авторская условная функциональная иллюстрация. Не монтажный чертёж.</desc><defs><linearGradient id="steel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e4edf2"/><stop offset=".3" stop-color="#a6bac8"/><stop offset=".65" stop-color="#d6e0e6"/><stop offset="1" stop-color="#566e7f"/></linearGradient><linearGradient id="friction" x2="0" y2="1"><stop stop-color="#a2886b"/><stop offset="1" stop-color="#64513c"/></linearGradient><linearGradient id="rub" x2="0" y2="1"><stop stop-color="#657683"/><stop offset="1" stop-color="#172a36"/></linearGradient><pattern id="wm" width="360" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><text x="20" y="85" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#375a73" opacity=".12">TrakSOS</text></pattern></defs><rect width="1400" height="920" fill="#edf2f6"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1400" height="115" fill="#142e49"/><text x="40" y="42" font-size="25" font-weight="bold" fill="white">TrakSOS • ТехБаза</text><text x="40" y="85" font-size="34" font-weight="bold" fill="white">BPW 09.801.08.69.0 — Комплект направляющих</text><rect x="35" y="140" width="840" height="430" rx="15" fill="white" stroke="#bac9d5"/><rect x="895" y="140" width="470" height="430" rx="15" fill="white" stroke="#bac9d5"/><text x="60" y="182" font-size="24" font-weight="bold" fill="#19394f">Компоненты (условная геометрия)</text><g><g transform="translate(90 250)"><rect width="250" height="38" rx="9" fill="url(#steel)" stroke="#536b7b" stroke-width="2"/><ellipse cx="250" cy="19" rx="10" ry="19" fill="#93a7b4" stroke="#536b7b"/><ellipse cx="250" cy="19" rx="5" ry="10" fill="#2c414e"/></g><g transform="translate(90 390)"><rect width="320" height="38" rx="9" fill="url(#steel)" stroke="#536b7b" stroke-width="2"/><ellipse cx="320" cy="19" rx="10" ry="19" fill="#93a7b4" stroke="#536b7b"/><ellipse cx="320" cy="19" rx="5" ry="10" fill="#2c414e"/></g><g transform="translate(455 250)"><rect width="135" height="38" rx="9" fill="url(#steel)" stroke="#536b7b" stroke-width="2"/><ellipse cx="135" cy="19" rx="10" ry="19" fill="#93a7b4" stroke="#536b7b"/><ellipse cx="135" cy="19" rx="5" ry="10" fill="#2c414e"/></g><g transform="translate(455 390)"><rect width="160" height="38" rx="9" fill="url(#steel)" stroke="#536b7b" stroke-width="2"/><ellipse cx="160" cy="19" rx="10" ry="19" fill="#93a7b4" stroke="#536b7b"/><ellipse cx="160" cy="19" rx="5" ry="10" fill="#2c414e"/></g><ellipse cx="690" cy="269" rx="34" ry="32" fill="url(#rub)" stroke="#253a47" stroke-width="3"/><ellipse cx="690" cy="269" rx="17" ry="18" fill="white" stroke="#253a47" stroke-width="2"/><ellipse cx="690" cy="409" rx="34" ry="32" fill="url(#rub)" stroke="#253a47" stroke-width="3"/><ellipse cx="690" cy="409" rx="17" ry="18" fill="white" stroke="#253a47" stroke-width="2"/></g><g font-size="19" font-weight="bold" fill="#19394f"><text x="95" y="230">Направляющие</text><text x="470" y="230">Втулки</text><text x="640" y="230">Уплотнения</text></g><text x="450" y="510" font-size="18" text-anchor="middle" fill="#19394f">Детали показаны раздельно, не в порядке сборки.</text><rect x="36" y="190" width="838" height="345" fill="url(#wm)"/><text x="60" y="550" font-size="16" fill="#526879">Не в масштабе; количество и форма элементов условны.</text><g transform="translate(920 185)" fill="#19394f"><text font-size="24" font-weight="bold">Каталожные сведения</text><rect y="30" width="420" height="54" rx="6" fill="#e3edf4"/><text x="12" y="62" font-size="16">Назначение</text><text x="408" y="62" font-size="16" text-anchor="end" font-weight="bold">Подвижность суппорта</text><rect y="92" width="420" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="124" font-size="16">Тормоз</text><text x="408" y="124" font-size="16" text-anchor="end" font-weight="bold">TS2 3709 / 4309</text><rect y="154" width="420" height="54" rx="6" fill="#e3edf4"/><text x="12" y="186" font-size="16">Элементы</text><text x="408" y="186" font-size="16" text-anchor="end" font-weight="bold">Направляющие, втулки</text><rect y="216" width="420" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="248" font-size="16">Защита</text><text x="408" y="248" font-size="16" text-anchor="end" font-weight="bold">Уплотнения</text><rect y="278" width="420" height="54" rx="6" fill="#e3edf4"/><text x="12" y="310" font-size="16">Размеры</text><text x="408" y="310" font-size="16" text-anchor="end" font-weight="bold">Не подтверждены</text></g><rect x="35" y="590" width="1330" height="235" rx="15" fill="white" stroke="#bac9d5"/><text x="60" y="630" font-size="24" font-weight="bold" fill="#19394f">Функциональная связь — TS2 3709 / 4309</text><rect x="70" y="675" width="380" height="86" rx="10" fill="#e3edf4"/><text x="260" y="727" font-size="19" font-weight="bold" text-anchor="middle" fill="#19394f">Корпус суппорта</text><path d="M455 718H500" stroke="#7892a4" stroke-width="3" stroke-dasharray="6 4"/><rect x="505" y="675" width="380" height="86" rx="10" fill="#183e62"/><text x="695" y="727" font-size="19" font-weight="bold" text-anchor="middle" fill="white">Направляющие</text><path d="M890 718H935" stroke="#7892a4" stroke-width="3" stroke-dasharray="6 4"/><rect x="940" y="675" width="380" height="86" rx="10" fill="#e3edf4"/><text x="1130" y="727" font-size="19" font-weight="bold" text-anchor="middle" fill="#19394f">Скоба / опора</text><text x="60" y="800" font-size="16" fill="#526879">Применимость и точная комплектация определяются по документации на ось и тормоз.</text><rect y="845" width="1400" height="75" fill="#922d36"/><text x="35" y="889" font-size="22" font-weight="bold" fill="white">Учебная схема • не монтажный чертёж • экспертная проверка обязательна</text></g></svg>