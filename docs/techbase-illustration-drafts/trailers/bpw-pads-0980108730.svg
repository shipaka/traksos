<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"><title>BPW 09.801.08.73.0 — Комплект колодок 8201</title><desc>Авторская условная функциональная иллюстрация. Не монтажный чертёж.</desc><defs><linearGradient id="steel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e4edf2"/><stop offset=".3" stop-color="#a6bac8"/><stop offset=".65" stop-color="#d6e0e6"/><stop offset="1" stop-color="#566e7f"/></linearGradient><linearGradient id="friction" x2="0" y2="1"><stop stop-color="#a2886b"/><stop offset="1" stop-color="#64513c"/></linearGradient><linearGradient id="rub" x2="0" y2="1"><stop stop-color="#657683"/><stop offset="1" stop-color="#172a36"/></linearGradient><pattern id="wm" width="360" height="160" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><text x="20" y="85" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#375a73" opacity=".12">TrakSOS</text></pattern></defs><rect width="1400" height="920" fill="#edf2f6"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1400" height="115" fill="#142e49"/><text x="40" y="42" font-size="25" font-weight="bold" fill="white">TrakSOS • ТехБаза</text><text x="40" y="85" font-size="34" font-weight="bold" fill="white">BPW 09.801.08.73.0 — Комплект колодок 8201</text><rect x="35" y="140" width="840" height="430" rx="15" fill="white" stroke="#bac9d5"/><rect x="895" y="140" width="470" height="430" rx="15" fill="white" stroke="#bac9d5"/><text x="60" y="182" font-size="24" font-weight="bold" fill="#19394f">Компоненты (условная геометрия)</text><g transform="translate(95 245)"><path d="M0 32L33 4H260L295 32V155L270 175H24L0 155Z" fill="url(#steel)" stroke="#435969" stroke-width="3"/><path d="M18 42Q145 4 277 42L277 142Q145 171 18 142Z" fill="url(#friction)" stroke="#5c4935" stroke-width="3"/><path d="M147 30V151" stroke="#5b4938" stroke-width="6" opacity=".65"/></g><g transform="translate(465 245)"><path d="M0 32L33 4H260L295 32V155L270 175H24L0 155Z" fill="url(#steel)" stroke="#435969" stroke-width="3"/><path d="M18 42Q145 4 277 42L277 142Q145 171 18 142Z" fill="url(#friction)" stroke="#5c4935" stroke-width="3"/><path d="M147 30V151" stroke="#5b4938" stroke-width="6" opacity=".65"/></g><path d="M140 465Q200 425 260 465T380 465" stroke="#7f909b" stroke-width="13" fill="none"/><path d="M520 455H715" stroke="#788e9d" stroke-width="17" stroke-linecap="round"/><text x="110" y="230" font-size="19" font-weight="bold" fill="#19394f">Фрикционный слой</text><path d="M240 234L245 278" stroke="#2878a7" stroke-width="2"/><text x="525" y="230" font-size="19" font-weight="bold" fill="#19394f">Несущая пластина</text><path d="M640 233L720 250" stroke="#2878a7" stroke-width="2"/><text x="450" y="510" font-size="18" text-anchor="middle" fill="#19394f">Удерживающие элементы (условно)</text><rect x="36" y="190" width="838" height="345" fill="url(#wm)"/><text x="60" y="550" font-size="16" fill="#526879">Не в масштабе; количество и форма элементов условны.</text><g transform="translate(920 185)" fill="#19394f"><text font-size="24" font-weight="bold">Каталожные сведения</text><rect y="30" width="420" height="54" rx="6" fill="#e3edf4"/><text x="12" y="62" font-size="16">Исполнение</text><text x="408" y="62" font-size="16" text-anchor="end" font-weight="bold">TS2 4309</text><rect y="92" width="420" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="124" font-size="16">Накладка</text><text x="408" y="124" font-size="16" text-anchor="end" font-weight="bold">BPW 8201</text><rect y="154" width="420" height="54" rx="6" fill="#e3edf4"/><text x="12" y="186" font-size="16">Комплект</text><text x="408" y="186" font-size="16" text-anchor="end" font-weight="bold">На одну ось</text><rect y="216" width="420" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="248" font-size="16">Накладки в каталоге</text><text x="408" y="248" font-size="16" text-anchor="end" font-weight="bold">05.092.90.25.0 / 26.0</text><rect y="278" width="420" height="54" rx="