<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="t d"><title id="t">SAF 4 177 3035 00 — сайлентблок</title><desc id="d">Авторский учебный рисунок шарнира продольного рычага, геометрия приближённая.</desc><defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eaf1f5"/><stop offset=".26" stop-color="#a9bac5"/><stop offset=".55" stop-color="#d5e0e6"/><stop offset="1" stop-color="#536977"/></linearGradient><linearGradient id="rub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53636e"/><stop offset=".4" stop-color="#273740"/><stop offset="1" stop-color="#101e26"/></linearGradient><radialGradient id="face"><stop stop-color="#5f707a"/><stop offset=".6" stop-color="#34454e"/><stop offset="1" stop-color="#1d2c35"/></radialGradient></defs><rect width="1400" height="950" fill="#edf2f6"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1400" height="120" fill="#142e49"/><text x="40" y="43" font-size="25" font-weight="bold" fill="white">TrakSOS • ТехБаза</text><text x="40" y="90" font-size="35" font-weight="bold" fill="white">SAF 4 177 3035 00 — шарнир рычага</text><rect x="35" y="145" width="850" height="445" rx="16" fill="white" stroke="#bac9d5"/><rect x="905" y="145" width="460" height="445" rx="16" fill="white" stroke="#bac9d5"/><text x="60" y="187" font-size="25" font-weight="bold" fill="#19394f">Общий вид (приближённо)</text><ellipse cx="450" cy="511" rx="260" ry="20" fill="#dbe4ea"/><g transform="translate(240 240)"><path d="M145 0H260C353 0 403 60 403 130S353 260 260 260H145Z" fill="url(#rub)" stroke="#21353e" stroke-width="2"/><ellipse cx="145" cy="130" rx="138" ry="130" fill="url(#face)" stroke="#1b2c35" stroke-width="3"/><path d="M55 63C20 78 18 170 55 198Q77 211 84 187Q47 130 84 76Q77 50 55 63Z" fill="#10212b" stroke="#687780" stroke-width="2"/><path d="M235 63C270 78 272 170 235 198Q213 211 206 187Q243 130 206 76Q213 50 235 63Z" fill="#10212b" stroke="#687780" stroke-width="2"/><ellipse cx="145" cy="130" rx="57" ry="55" fill="url(#metal)" stroke="#536977" stroke-width="2"/><ellipse cx="145" cy="130" rx="36" ry="35" fill="#142630"/><text x="145" y="226" font-size="19" fill="#82929b" font-weight="bold" text-anchor="middle">SAF</text></g><g fill="#19394f" font-size="18" font-weight="bold"><text x="65" y="239">Резиновый корпус</text><path d="M215 246L262 289" stroke="#2878a7" stroke-width="2"/><text x="65" y="440">Центральная втулка</text><path d="M220 433L355 392" stroke="#2878a7" stroke-width="2"/><text x="642" y="232">Упругие полости</text><path d="M634 238L465 319" stroke="#2878a7" stroke-width="2"/></g><text x="60" y="567" font-size="17" fill="#526779">Форма и размеры изображения условны; ориентация установки не задана.</text><g transform="translate(930 188)" fill="#19394f"><text font-size="24" font-weight="bold">Каталожные данные</text><rect y="29" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="61" font-size="17">Семейство</text><text x="398" y="61" font-size="17" text-anchor="end" font-weight="bold">INTRA</text><rect y="91" width="410" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="123" font-size="17">Тип</text><text x="398" y="123" font-size="17" text-anchor="end" font-weight="bold">Heavy Duty</text><rect y="153" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="185" font-size="17">Старый номер</text><text x="398" y="185" font-size="17" text-anchor="end" font-weight="bold">4 177 3028 00</text><rect y="215" width="410" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="247" font-size="17">Комплект</text><text x="398" y="247" font-size="17" text-anchor="end" font-weight="bold">4177303500K</text><rect y="277" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="309" font-size="17">Габариты</text><text x="398" y="309" font-size="17" text-anchor="end" font-weight="bold">Не подтверждены</text></g><rect x="35" y="610" width="1330" height="245" rx="16" fill="white" stroke="#bac9d5"/><text x="60" y="651" font-size="25" font-weight="bold" fill="#19394f">Связь рамы, шарнира и продольного рычага</text><g transform="translate(80 680)"><rect width="610" height="22" rx="3" fill="#637888"/><path d="M50 22V105H150V22" fill="#b2c1ca" stroke="#526779" stroke-width="3"/><path d="M102 90L510 137" stroke="#455b6b" stroke-width="34" stroke-linecap="round"/><circle cx="102" cy="90" r="39" fill="#8b9fae" stroke="#526779" stroke-width="4"/><circle cx="102" cy="90" r="28" fill="#d69735" stroke="#996b28" stroke-width="3"/><circle cx="102" cy="90" r="12" fill="#e0e6e9" stroke="#526779" stroke-width="3"/><circle cx="405" cy="127" r="31" fill="#c2cfd8" stroke="#526779" stroke-width="7"/><path d="M510 27Q485 50 500 74Q485 100 510 120H567Q588 100 575 74Q590 50 567 27Z" fill="url(#rub)" stroke="#263944" stroke-width="2"/><text x="10" y="-7" fill="#526779" font-size="15">Рама</text><text x="155" y="66" fill="#996b28" font-weight="bold" font-size="17">Сайлентблок</text><path d="M152 70L128 80" stroke="#996b28" stroke-width="2"/><text x="215" y="150" font-size="15" fill="#526779">Продольный рычаг</text></g><g transform="translate(750 696)" fill="#19394f"><text font-weight="bold" font-size="22">Упругое соединение</text><text y="38" font-size="18">Связывает рычаг с кронштейном рамы.</text><text y="68" font-size="18">Допускает рабочее перемещение подвески.</text><text y="98" font-size="17">Применимость — по типу и номеру оси.</text></g><rect y="875" width="1400" height="75" fill="#922d36"/><text x="35" y="920" font-size="23" font-weight="bold" fill="white">Учебная схема • не монтажный чертёж • требуется экспертная проверка</text></g></svg>