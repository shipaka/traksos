<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img"><title>SAF / Knorr-Bremse SN7 — суппорт</title><desc>Условная оригинальная функциональная схема, не точная геометрия или монтажная инструкция.</desc><defs><linearGradient id="m" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e4edf2"/><stop offset=".25" stop-color="#a8bac6"/><stop offset=".65" stop-color="#788d9c"/><stop offset="1" stop-color="#344b5b"/></linearGradient><radialGradient id="d"><stop stop-color="#c8d6df"/><stop offset=".7" stop-color="#e3e9ed"/><stop offset="1" stop-color="#718997"/></radialGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2279ad"/></marker></defs><rect width="1400" height="950" fill="#edf2f6"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1400" height="115" fill="#142e49"/><text x="40" y="42" font-size="25" font-weight="bold" fill="white">TrakSOS • ТехБаза</text><text x="40" y="86" font-size="34" font-weight="bold" fill="white">SAF / Knorr-Bremse SN7 — тормозной суппорт</text><rect x="35" y="140" width="820" height="435" rx="16" fill="white" stroke="#bac9d5"/><rect x="875" y="140" width="490" height="435" rx="16" fill="white" stroke="#bac9d5"/><text x="60" y="185" font-size="25" font-weight="bold" fill="#19394f">Функциональный разрез (условно)</text><g transform="translate(150 235)"><ellipse cx="295" cy="260" rx="250" ry="16" fill="#dae3ea"/><path d="M15 95Q5 30 65 15H460Q528 15 535 90V205H448V107H104V205H15Z" fill="url(#m)" stroke="#526878" stroke-width="3"/><path d="M40 30L75 0H483L460 15H65Z" fill="#d0dce4" stroke="#526878"/><rect x="130" y="103" width="300" height="78" rx="8" fill="#576e7d" stroke="#344c5a" stroke-width="2"/><rect x="140" y="180" width="280" height="24" rx="5" fill="#b78a49" stroke="#705932" stroke-width="2"/><rect x="140" y="218" width="280" height="18" rx="3" fill="#a9b9c3" stroke="#526878"/><rect x="140" y="248" width="280" height="21" rx="4" fill="#b78a49" stroke="#705932"/><rect x="105" y="271" width="350" height="19" rx="5" fill="url(#m)" stroke="#526878" stroke-width="2"/><rect x="177" y="40" width="56" height="78" rx="8" fill="#a0b2be" stroke="#526878" stroke-width="2"/><ellipse cx="205" cy="118" rx="37" ry="15" fill="#607786" stroke="#344c5a" stroke-width="2"/><path d="M205 130V165" stroke="#2279ad" stroke-width="4" marker-end="url(#a)"/><rect x="327" y="40" width="56" height="78" rx="8" fill="#a0b2be" stroke="#526878" stroke-width="2"/><ellipse cx="355" cy="118" rx="37" ry="15" fill="#607786" stroke="#344c5a" stroke-width="2"/><path d="M355 130V165" stroke="#2279ad" stroke-width="4" marker-end="url(#a)"/></g><g fill="#19394f" font-size="18" font-weight="bold"><text x="65" y="229">Корпус</text><path d="M133 233L196 272" stroke="#2279ad" stroke-width="2"/><text x="590" y="227">Два нажимных узла</text><path d="M604 232L505 290" stroke="#2279ad" stroke-width="2"/><text x="650" y="439">Колодки</text><path d="M641 433L571 428" stroke="#2279ad" stroke-width="2"/><text x="650" y="478">Диск</text><path d="M643 473L570 462" stroke="#2279ad" stroke-width="2"/></g><text x="60" y="554" font-size="16" fill="#526878">Пропорции и расположение деталей условны; не CAD и не порядок сборки.</text><g transform="translate(900 184)" fill="#19394f"><text font-size="24" font-weight="bold">Артикулы по исполнению</text><rect y="30" width="440" height="54" rx="6" fill="#e3edf4"/><text x="12" y="62" font-size="17">Правый</text><text x="427" y="62" text-anchor="end" font-size="18" font-weight="bold">3 080 0030 01</text><rect y="92" width="440" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="124" font-size="17">Левый</text><text x="427" y="124" text-anchor="end" font-size="18" font-weight="bold">3 080 0031 01</text><rect y="154" width="440" height="54" rx="6" fill="#e3edf4"/><text x="12" y="186" font-size="17">Диск</text><text x="427" y="186" text-anchor="end" font-size="18" font-weight="bold">4 079 0013 01</text><rect y="216" width="440" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="248" font-size="17">Колодки</text><text x="427" y="248" text-anchor="end" font-size="18" font-weight="bold">3 057 0077 00</text><rect y="278" width="440" height="54" rx="6" fill="#e3edf4"/><text x="12" y="310" font-size="17">Нажимных узлов</text><text x="427" y="310" text-anchor="end" font-size="18" font-weight="bold">2</text></g><rect x="35" y="595" width="1330" height="260" rx="16" fill="white" stroke="#bac9d5"/><text x="60" y="637" font-size="25" font-weight="bold" fill="#19394f">Связь с деталями SAF INTRADISC</text><g transform="translate(155 727)"><circle r="48" fill="url(#d)" stroke="#526878" stroke-width="3"/><circle r="21" fill="white" stroke="#526878"/><text y="74" text-anchor="middle" font-size="17" fill="#19394f">Диск 430 мм</text></g><g transform="translate(460 727)"><rect x="-75" y="-35" width="150" height="70" rx="18" fill="#ad854b" stroke="#705932" stroke-width="3"/><text y="74" text-anchor="middle" font-size="17" fill="#19394f">Колодки</text></g><g transform="translate(765 727)"><circle cx="-34" r="29" fill="url(#m)" stroke="#526878" stroke-width="3"/><circle cx="34" r="29" fill="url(#m)" stroke="#526878" stroke-width="3"/><text y="74" text-anchor="middle" font-size="17" fill="#19394f">Нажимные узлы</text></g><g transform="translate(1085 727)"><rect x="-72" y="-19" width="144" height="38" rx="12" fill="url(#m)" stroke="#526878"/><text y="74" text-anchor="middle" font-size="17" fill="#19394f">Направляющие</text></g><text x="60" y="837" font-size="16" fill="#526878">Каталожный контекст: SAF SK RB 9022K. Совместимость с другой осью не предполагается.</text><rect y="875" width="1400" height="75" fill="#922d36"/><text x="35" y="920" font-size="23" font-weight="bold" fill="white">Учебная схема • не монтажный чертёж • требуется экспертная проверка</text></g></svg>