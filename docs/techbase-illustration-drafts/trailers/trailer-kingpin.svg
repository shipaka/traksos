<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Шкворень полуприцепа и седло</title><desc id="desc">Условный разнесённый вид опорной плиты, шкворня и седельно-сцепного устройства.</desc><metadata>id:trailer-kingpin; category:Прицепы; source:https://jostinternational.com/kingpins; checked:2026-11-26; rights:original_illustration; status:draft_expert_pending; fitment:not_confirmed</metadata><rect width="1000" height="660" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="38" y="42" font-size="18" fill="#7dd3fc">TrakSOS · ТехБаза · Прицепы</text><text x="38" y="85" font-size="30" font-weight="700">Шкворень полуприцепа и седло</text><rect x="38" y="112" width="924" height="380" rx="14" fill="#192e44" stroke="#51677b"/><path d="M210 155 L700 155 L810 195 L320 195 Z" fill="#667d91" stroke="#b1c2d0" stroke-width="3"/><ellipse cx="508" cy="195" rx="70" ry="15" fill="#d0a45e" stroke="#f2d295" stroke-width="3"/><path d="M469 200 H547 V238 H532 V281 H547 V305 Q508 324 469 305 V281 H484 V238 H469 Z" fill="#bf9857" stroke="#f0d5a6" stroke-width="3"/><path d="M275 360 Q285 335 360 322 L655 322 Q731 335 740 360 L782 401 Q779 449 697 455 H566 L508 390 L450 455 H320 Q238 449 234 401 Z" fill="#42617a" stroke="#a2b7c9" stroke-width="4"/><path d="M508 319 V356" stroke="#8ed6e7" stroke-width="3" stroke-dasharray="7 6"/><path d="M494 346 L508 361 L522 346" fill="none" stroke="#8ed6e7" stroke-width="3"/><g fill="none" stroke="#92d1e3" stroke-width="2"><path d="M320 169 H135 V207"/><path d="M546 260 H730"/><path d="M755 407 H845"/><path d="M508 389 L390 280 H200"/></g><g font-size="16"><text x="66" y="230">Опорная плита</text><text x="735" y="255">Шкворень</text><text x="793" y="397">Седло</text><text x="78" y="272">Зона замка (условно)</text></g><text x="38" y="535" font-size="18" font-weight="700">Функция и границы применимости</text><text x="38" y="565" font-size="17" fill="#d1e0ee">Шкворень — сопрягаемый элемент соединения полуприцепа с тягачом.</text><text x="38" y="588" font-size="17" fill="#d1e0ee">Седло воспринимает нагрузку через опорную плиту и удерживает шкворень замком.</text><text x="38" y="611" font-size="17" fill="#d1e0ee">Не показаны реальные профили замка, размеры, допустимый износ или процедура сцепки.</text><text x="38" y="639" font-size="16" fill="#f1c87e">Черновик · не монтажный чертёж · проверка специалистом обязательна</text></g></svg>