<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Опорное устройство полуприцепа</title><desc id="desc">Условный вид двух телескопических опор с поперечным валом и рукояткой.</desc><metadata>id:trailer-landing-gear; category:Прицепы; source:https://jostinternational.com/landing-gear; checked:2026-11-26; rights:original_illustration; status:draft_expert_pending; fitment:not_confirmed</metadata><rect width="1000" height="660" rx="20" fill="#102236"/><g font-family="sans-serif" fill="#f1f5f9"><text x="38" y="42" font-size="18" fill="#7dd3fc">TrakSOS · ТехБаза · Прицепы</text><text x="38" y="85" font-size="30" font-weight="700">Опорное устройство полуприцепа</text><rect x="38" y="112" width="924" height="380" rx="14" fill="#192e44" stroke="#51677b"/><path d="M160 154 H840" stroke="#8295a7" stroke-width="18"/><g stroke="#96b0c5" stroke-width="3"><rect x="270" y="174" width="90" height="190" rx="4" fill="#3e6781"/><rect x="292" y="332" width="46" height="91" fill="#729bb2"/><rect x="254" y="423" width="122" height="18" rx="4" fill="#9eafbe"/><rect x="640" y="174" width="90" height="190" rx="4" fill="#3e6781"/><rect x="662" y="332" width="46" height="91" fill="#729bb2"/><rect x="624" y="423" width="122" height="18" rx="4" fill="#9eafbe"/></g><rect x="258" y="203" width="115" height="78" rx="9" fill="#c8944c" stroke="#f2c77b" stroke-width="3"/><path d="M373 240 H640 M258 240 H184 V285 H150" fill="none" stroke="#b3c6d5" stroke-width="11" stroke-linecap="round"/><path d="M150 285 H123" stroke="#d6ab61" stroke-width="18" stroke-linecap="round"/><g stroke="#92d1e3" stroke-width="2" fill="none"><path d="M497 240 V194 H554"/><path d="M730 310 H780"/><path d="M338 387 H422"/><path d="M310 440 L345 467 H450"/><path d="M258 215 H175 V185 H99"/></g><g font-size="16"><text x="556" y="188">Соединительный вал</text><text x="783" y="305">Наружная стойка</text><text x="427" y="383">Выдвижная часть</text><text x="455" y="472">Опорная подошва</text><text x="80" y="178">Редуктор</text><text x="70" y="322">Рукоятка</text></g><text x="38" y="535" font-size="18" font-weight="700">Функция и границы применимости</text><text x="38" y="565" font-size="17" fill="#d1e0ee">Парные опоры удерживают переднюю часть отцепленного полуприцепа.</text><text x="38" y="588" font-size="17" fill="#d1e0ee">Вал передаёт вращение между стойками; исполнение редуктора и подошвы различается.</text><text x="38" y="611" font-size="17" fill="#d1e0ee">Нагрузки, размеры, крепёж и порядок эксплуатации — только по документации изделия.</text><text x="38" y="639" font-size="16" fill="#f1c87e">Черновик · не монтажный чертёж · проверка специалистом обязательна</text></g></svg>