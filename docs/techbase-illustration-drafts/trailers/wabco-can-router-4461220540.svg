ер</text><rect y="80" width="410" height="49" rx="6" fill="#f2f6fa"/><text x="12" y="111" font-size="18">Выход X1</text><text x="398" y="111" text-anchor="end" font-size="18" font-weight="bold">Штекер</text><rect y="135" width="410" height="49" rx="6" fill="#e4edf5"/><text x="12" y="166" font-size="18">Выход X2</text><text x="398" y="166" text-anchor="end" font-size="18" font-weight="bold">Штекер</text><rect y="190" width="410" height="49" rx="6" fill="#f2f6fa"/><text x="12" y="221" font-size="18">Датчик Y</text><text x="398" y="221" text-anchor="end" font-size="18" font-weight="bold">Гнездо</text><rect y="245" width="410" height="49" rx="6" fill="#e4edf5"/><text x="12" y="276" font-size="18">Назначение</text><text x="398" y="276" text-anchor="end" font-size="18" font-weight="bold">2 модулятора</text><rect y="300" width="410" height="49" rx="6" fill="#f2f6fa"/><text x="12" y="331" font-size="18">Артикул</text><text x="398" y="331" text-anchor="end" font-size="18" font-weight="bold">446 122 054 0</text></g><rect x="35" y="595" width="1330" height="260" rx="16" fill="white" stroke="#b7c6d3"/><text x="60" y="636" font-size="25" font-weight="bold" fill="#142e49">Функциональная топология — пример Trailer EBS E1</text><rect x="65" y="660" width="310" height="63" rx="9" fill="#e4edf5"/><rect x="65" y="745" width="310" height="63" rx="9" fill="#e4edf5"/><rect x="485" y="681" width="390" height="110" rx="11" fill="#183e62"/><g fill="#142e49" font-size="20" font-weight="bold" text-anchor="middle"><text x="220" y="699">Тягач • ISO 7638</text><text x="220" y="784">Датчик давления (опция)</text></g><text x="680" y="727" text-anchor="middle" fill="white" font-size="25" font-weight="bold">CAN Router</text><text x="680" y="759" text-anchor="middle" fill="white" font-size="18">446 122 054 0</text><g fill="none" stroke="#236b9b" stroke-width="3" marker-end="url(#a)"><path d="M380 691H430V715H479"/><path d="M380 776H430V760H479"/><path d="M880 736H935V695H989"/><path d="M880 736H935V7