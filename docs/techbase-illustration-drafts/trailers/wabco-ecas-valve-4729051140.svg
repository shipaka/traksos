<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="t d"><title id="t">WABCO 472 905 114 0 — Клапан ECAS / подъёмной оси</title><desc id="d">Авторская функциональная иллюстрация ECAS, условная геометрия, не монтажный чертёж.</desc><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#edf2f5"/><stop offset=".28" stop-color="#a6b4be"/><stop offset=".57" stop-color="#d3dde4"/><stop offset="1" stop-color="#657786"/></linearGradient><linearGradient id="rub" x2="0" y2="1"><stop stop-color="#687887"/><stop offset=".3" stop-color="#36434e"/><stop offset="1" stop-color="#14232e"/></linearGradient><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2378b5"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#168269"/></marker></defs><rect width="1400" height="950" fill="#edf2f7"/><rect width="1400" height="120" fill="#142e49"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="42" font-size="25" font-weight="bold" fill="white">TrakSOS • ТехБаза</text><text x="40" y="89" font-size="35" font-weight="bold" fill="white">WABCO 472 905 114 0 — Клапан ECAS / подъёмной оси</text><rect x="35" y="145" width="850" height="445" rx="16" fill="white" stroke="#b7c6d3"/><rect x="905" y="145" width="460" height="445" rx="16" fill="white" stroke="#b7c6d3"/><text x="60" y="188" font-size="25" font-weight="bold" fill="#142e49">Условный внешний вид компонента</text><ellipse cx="450" cy="510" rx="275" ry="21" fill="#dce4ea"/><g transform="translate(220 245)"><path d="M0 101L55 65H395L448 101V220L395 253H0Z" fill="url(#metal)" stroke="#607383" stroke-width="3"/><path d="M0 101L55 65H395L448 101Z" fill="#c7d3dc" stroke="#607383"/><path d="M395 101L448 65V220L395 253Z" fill="#8fa0ae" stroke="#607383"/><rect x="0" y="101" width="395" height="152" rx="14" fill="url(#metal)" stroke="#607383"/><rect x="35" y="0" width="145" height="110" rx="13" fill="url(#rub)" stroke="#263746" stroke-width="2"/><rect x="205" y="0" width="145" height="110" rx="13" fill="url(#rub)" stroke="#263746" stroke-width="2"/><rect x="76" y="-20" width="63" height="30" rx="7" fill="#344653"/><rect x="246" y="-20" width="63" height="30" rx="7" fill="#344653"/><text x="198" y="184" text-anchor="middle" font-size="27" font-weight="bold" fill="#263746">ECAS</text></g><g font-size="19" fill="#142e49"><text x="60" y="231" font-weight="bold">Электромагнитный блок</text><path d="M250 238L290 273" stroke="#2378b5" stroke-width="2"/><text x="60" y="555">Пневматический блок условный; порты и разъёмы не нанесены.</text></g><g transform="translate(930 188)" fill="#142e49"><text font-size="24" font-weight="bold">Параметры производителя</text><rect y="26" width="410" height="50" rx="6" fill="#e4edf5"/><text x="12" y="58" font-size="18">Питание</text><text x="398" y="58" font-size="18" font-weight="bold" text-anchor="end">24 В</text><rect y="83" width="410" height="50" rx="6" fill="#f2f6fa"/><text x="12" y="115" font-size="18">Габариты</text><text x="398" y="115" font-size="18" font-weight="bold" text-anchor="end">256 × 205 × 139 мм</text><rect y="140" width="410" height="50" rx="6" fill="#e4edf5"/><text x="12" y="172" font-size="18">Масса</text><text x="398" y="172" font-size="18" font-weight="bold" text-anchor="end">4,248 кг</text><rect y="197" width="410" height="50" rx="6" fill="#f2f6fa"/><text x="12" y="229" font-size="18">Температура</text><text x="398" y="229" font-size="18" font-weight="bold" text-anchor="end">−40…+80 °C</text><rect y="254" width="410" height="50" rx="6" fill="#e4edf5"/><text x="12" y="286" font-size="18">Защита</text><text x="398" y="286" font-size="18" font-weight="bold" text-anchor="end">IP6K9K</text><rect y="311" width="410" height="50" rx="6" fill="#f2f6fa"/><text x="12" y="343" font-size="18">Порт 26</text><text x="398" y="343" font-size="18" font-weight="bold" text-anchor="end">Закрыт</text></g><rect x="35" y="610" width="1330" height="245" rx="16" fill="white" stroke="#b7c6d3"/><text x="60" y="650" font-size="25" font-weight="bold" fill="#142e49">Контур регулирования высоты — TEBS E / ECAS</text><rect x="65" y="695" width="280" height="85" rx="10" fill="#e4edf5"/><text x="205" y="728" font-size="19" font-weight="bold" text-anchor="middle" fill="#142e49">Датчик высоты</text><text x="205" y="755" text-anchor="middle" font-size="17" fill="#142e49">441 050 100 0</text><path d="M350 737H386" stroke="#2378b5" stroke-width="4" marker-end="url(#b)"/><rect x="393" y="695" width="280" height="85" rx="10" fill="#e4edf5"/><text x="533" y="728" font-size="19" font-weight="bold" text-anchor="middle" fill="#142e49">ЭБУ TEBS E</text><text x="533" y="755" text-anchor="middle" font-size="17" fill="#142e49">обработка сигнала</text><path d="M678 737H714" stroke="#2378b5" stroke-width="4" marker-end="url(#b)"/><rect x="721" y="695" width="280" height="85" rx="10" fill="#183e62"/><text x="861" y="728" font-size="19" font-weight="bold" text-anchor="middle" fill="white">Клапан ECAS</text><text x="861" y="755" text-anchor="middle" font-size="17" fill="white">472 905 114 0</text><path d="M1006 737H1042" stroke="#168269" stroke-width="4" marker-end="url(#g)"/><rect x="1049" y="695" width="280" height="85" rx="10" fill="#e4edf5"/><text x="1189" y="728" font-size="19" font-weight="bold" text-anchor="middle" fill="#142e49">Пневмоподушки</text><text x="1189" y="755" text-anchor="middle" font-size="17" fill="#142e49">и подъёмная ось</text><path d="M1189 783V815H205V787" stroke="#7d8790" stroke-width="2" stroke-dasharray="7 5" fill="none"/><text x="697" y="838" text-anchor="middle" font-size="16" fill="#536575">Обратная связь: изменение положения подвески. Не схема подключения.</text><rect y="875" width="1400" height="75" fill="#922d36"/><text x="35" y="919" font-size="23" font-weight="bold" fill="white">Учебная схема • геометрия условная • требуется экспертная проверка</text></g></svg>