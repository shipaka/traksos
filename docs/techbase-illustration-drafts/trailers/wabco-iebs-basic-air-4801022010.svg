<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="t d"><title id="t">WABCO iEBS Basic Air 480 102 201 0</title><desc id="d">Авторская функциональная схема двух каналов датчиков и двух каналов торможения. Не заводской чертёж.</desc><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#e7eef3"/><stop offset=".5" stop-color="#a7b5c0"/><stop offset="1" stop-color="#657686"/></linearGradient><linearGradient id="case" x2="0" y2="1"><stop stop-color="#566675"/><stop offset="1" stop-color="#162632"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#236b9b"/></marker></defs><rect width="1400" height="950" fill="#eef3f7"/><rect width="1400" height="120" fill="#142e49"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="42" font-size="25" font-weight="bold" fill="white">TrakSOS • ТехБаза</text><text x="40" y="89" font-size="35" font-weight="bold" fill="white">WABCO iEBS Basic Air — 480 102 201 0</text><rect x="35" y="145" width="850" height="445" rx="16" fill="white" stroke="#b7c6d3"/><rect x="905" y="145" width="460" height="445" rx="16" fill="white" stroke="#b7c6d3"/><text x="60" y="188" font-size="25" font-weight="bold" fill="#142e49">Принципиальное устройство модуля</text><ellipse cx="451" cy="515" rx="265" ry="25" fill="#dce4ea"/><g transform="translate(245 246)"><path d="M0 100L65 64H385L445 100V220L385 254H0Z" fill="url(#metal)" stroke="#536575" stroke-width="2"/><path d="M385 100L445 64V220L385 254Z" fill="#8e9eab" stroke="#536575"/><path d="M0 100L65 64H445L385 100Z" fill="#d4dfe7" stroke="#536575"/><rect x="0" y="0" width="385" height="115" rx="12" fill="url(#case)" stroke="#223647" stroke-width="2"/><path d="M385 12L445 -24V64L385 100Z" fill="#324653" stroke="#223647"/><path d="M0 12L65 -24H430L385 12Z" fill="#617381" stroke="#223647"/><text x="192" y="70" text-anchor="middle" font-size="26" font-weig