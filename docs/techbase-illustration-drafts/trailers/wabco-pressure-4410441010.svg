d="url(#a)"/><rect x="721" y="690" width="280" height="100" rx="10" fill="#e4edf5"/><text x="861" y="730" font-size="20" font-weight="bold" fill="#142e49" text-anchor="middle">Кабель</text><text x="861" y="760" font-size="18" fill="#142e49" text-anchor="middle">449 425 … 0</text><path d="M1006 740H1042" stroke="#236b9b" stroke-width="4" marker-end="url(#a)"/><rect x="1049" y="690" width="280" height="100" rx="10" fill="#183e62"/><text x="1189" y="730" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Модулятор iEBS</text><text x="1189" y="760" font-size="18" fill="white" text-anchor="middle">обработка сигнала</text><text x="65" y="830" font-size="17" fill="#536575">Альтернативный путь сигнала — через CAN Router/Repeater. Не монтажная схема.</text><rect y="875" width="1400" height="75" fill="#922d36"/><text x="35" y="919" font-size="23" font-weight="bold" fill="white">Учебная схема • не монтажный чертёж • требуется экспертная проверка</text></g></svg>