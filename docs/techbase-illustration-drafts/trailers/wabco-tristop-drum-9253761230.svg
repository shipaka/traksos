<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img"><title>WABCO 925 376 123 0 — TRISTOP D — барабанный тормоз</title><desc>Учебное изображение, не точный монтажный чертёж.</desc><defs><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a6b3bc"/><stop offset=".17" stop-color="#e4eaee"/><stop offset=".4" stop-color="#8799a5"/><stop offset=".66" stop-color="#bac8d1"/><stop offset="1" stop-color="#455b6b"/></linearGradient><linearGradient id="dark" x2="0" y2="1"><stop stop-color="#657682"/><stop offset=".25" stop-color="#263640"/><stop offset=".8" stop-color="#17242d"/><stop offset="1" stop-color="#485b67"/></linearGradient><pattern id="wm" width="280" height="145" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><text x="10" y="72" font-family="Arial" font-size="28" font-weight="bold" fill="#385b73" opacity=".17">TrakSOS</text></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#277aaa"/></marker></defs><rect width="1400" height="950" fill="#edf2f6"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1400" height="115" fill="#142e49"/><text x="40" y="42" font-size="25" font-weight="bold" fill="white">TrakSOS • ТехБаза</text><text x="40" y="86" font-size="34" font-weight="bold" fill="white">WABCO 925 376 123 0 — TRISTOP D — барабанный тормоз</text><rect x="35" y="140" width="850" height="440" rx="16" fill="white" stroke="#bac9d5"/><rect x="905" y="140" width="460" height="440" rx="16" fill="white" stroke="#bac9d5"/><text x="60" y="184" font-size="25" font-weight="bold" fill="#19394f">Внешний вид (приближённо)</text><ellipse cx="450" cy="499" rx="325" ry="19" fill="#d7e1e8"/><g transform="translate(100 265)"><g transform="translate(25 0)"><path d="M0 45Q-12 0 55 0H280Q305 0 305 35V175Q305 210 280 210H55Q-12 210 0 165Z" fill="url(#steel)" stroke="#354b5a" stroke-width="3"/><rect x="8" y="7" width="36" height="196" rx="13" fill="url(#dark)" stroke="#344a59" stroke-width="2"/><path d="M55 16H275" stroke="#f0f5f7" stroke-width="4" opacity=".6"/></g><g transform="translate(315 0)"><path d="M0 45Q-12 0 55 0H160Q185 0 185 35V175Q185 210 160 210H55Q-12 210 0 165Z" fill="url(#steel)" stroke="#354b5a" stroke-width="3"/><rect x="8" y="7" width="36" height="196" rx="13" fill="url(#dark)" stroke="#344a59" stroke-width="2"/><path d="M55 16H155" stroke="#f0f5f7" stroke-width="4" opacity=".6"/></g><path d="M492 30H562M492 180H562" stroke="#627988" stroke-width="14" stroke-linecap="round"/><path d="M500 105H695" stroke="#445a68" stroke-width="17" stroke-linecap="round"/><path d="M663 85H714V125H663" fill="none" stroke="#a3b4bf" stroke-width="12"/><circle cx="712" cy="105" r="8" fill="#526779"/><rect x="380" y="-21" width="37" height="29" rx="5" fill="url(#steel)" stroke="#536b7b" stroke-width="2"/><rect x="145" y="-21" width="37" height="29" rx="5" fill="url(#steel)" stroke="#536b7b" stroke-width="2"/><text x="405" y="115" font-size="21" fill="#354b5a" font-weight="bold">WABCO</text></g><g font-size="18" fill="#19394f" font-weight="bold"><text x="60" y="235">Пружинная секция</text><path d="M205 240L240 270" stroke="#277aaa" stroke-width="2"/><text x="420" y="235">Рабочая камера</text><path d="M490 240L475 280" stroke="#277aaa" stroke-width="2"/><text x="690" y="510">Шток и вилка</text></g><rect x="36" y="190" width="848" height="345" fill="url(#wm)"/><text x="60" y="555" font-size="17" fill="#526779">Форма, порты и размеры изображения условны. Не для монтажа.</text><g transform="translate(930 184)" fill="#19394f"><text font-size="24" font-weight="bold">Каталожные сведения</text><rect y="30" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="62" font-size="17">Тип</text><text x="398" y="62" font-size="17" text-anchor="end" font-weight="bold">24/30</text><rect y="93" width="410" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="125" font-size="17">Тормоз</text><text x="398" y="125" font-size="17" text-anchor="end" font-weight="bold">Барабанный</text><rect y="156" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="188" font-size="17">Ход</text><text x="398" y="188" font-size="17" text-anchor="end" font-weight="bold">75 / 75 мм</text><rect y="219" width="410" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="251" font-size="17">Шток с вилкой</text><text x="398" y="251" font-size="17" text-anchor="end" font-weight="bold">190 мм</text><rect y="282" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="314" font-size="17">Давление (макс.)</text><text x="398" y="314" font-size="17" text-anchor="end" font-weight="bold">10,2 / 8,5 бар</text></g><rect x="35" y="600" width="1330" height="255" rx="16" fill="white" stroke="#bac9d5"/><text x="60" y="641" font-size="25" font-weight="bold" fill="#19394f">Функциональная связь контуров (не схема подключения)</text><rect x="65" y="670" width="300" height="66" rx="10" fill="#e3edf4"/><text x="215" y="698" font-size="18" font-weight="bold" text-anchor="middle" fill="#19394f">Модулятор EBS</text><text x="215" y="720" font-size="16" text-anchor="middle" fill="#19394f">Рабочее давление</text><rect x="65" y="751" width="300" height="66" rx="10" fill="#e8e1d5"/><text x="215" y="779" font-size="18" font-weight="bold" text-anchor="middle" fill="#19394f">Стояночный контур</text><text x="215" y="801" font-size="16" text-anchor="middle" fill="#19394f">Воздух удерживает пружину</text><path d="M370 784H460V769H515" fill="none" stroke="#ae803b" stroke-width="4"/><path d="M370 703H515" stroke="#277aaa" stroke-width="4" marker-end="url(#a)"/><rect x="525" y="670" width="330" height="147" rx="12" fill="#183e62"/><text x="690" y="709" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Рабочая мембрана</text><path d="M545 738H835" stroke="#a9c4d6"/><text x="690" y="780" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Силовая пружина</text><path d="M860 744H978" stroke="#277aaa" stroke-width="4" marker-end="url(#a)"/><rect x="990" y="710" width="345" height="68" rx="10" fill="#e3edf4"/><text x="1162" y="750" text-anchor="middle" font-size="19" font-weight="bold" fill="#19394f">Рычаг барабанного тормоза</text><text x="60" y="840" font-size="16" fill="#526779">Маршруты и клапаны зависят от комплектации. Давление в таблице — характеристика детали.</text><rect y="875" width="1400" height="75" fill="#922d36"/><text x="35" y="920" font-size="21" font-weight="bold" fill="white">Опасность: сжатая силовая пружина. Не вскрывать. Требуется экспертная проверка.</text></g></svg>