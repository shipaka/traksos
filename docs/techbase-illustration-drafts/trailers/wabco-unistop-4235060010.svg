<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img"><title>WABCO 423 506 001 0 — UNISTOP — рабочая камера</title><desc>Учебное изображение, не точный монтажный чертёж.</desc><defs><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a6b3bc"/><stop offset=".17" stop-color="#e4eaee"/><stop offset=".4" stop-color="#8799a5"/><stop offset=".66" stop-color="#bac8d1"/><stop offset="1" stop-color="#455b6b"/></linearGradient><linearGradient id="dark" x2="0" y2="1"><stop stop-color="#657682"/><stop offset=".25" stop-color="#263640"/><stop offset=".8" stop-color="#17242d"/><stop offset="1" stop-color="#485b67"/></linearGradient><pattern id="wm" width="280" height="145" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><text x="10" y="72" font-family="Arial" font-size="28" font-weight="bold" fill="#385b73" opacity=".17">TrakSOS</text></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#277aaa"/></marker></defs><rect width="1400" height="950" fill="#edf2f6"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1400" height="115" fill="#142e49"/><text x="40" y="42" font-size="25" font-weight="bold" fill="white">TrakSOS • ТехБаза</text><text x="40" y="86" font-size="34" font-weight="bold" fill="white">WABCO 423 506 001 0 — UNISTOP — рабочая камера</text><rect x="35" y="140" width="850" height="440" rx="16" fill="white" stroke="#bac9d5"/><rect x="905" y="140" width="460" height="440" rx="16" fill="white" stroke="#bac9d5"/><text x="60" y="184" font-size="25" font-weight="bold" fill="#19394f">Внешний вид (приближённо)</text><ellipse cx="450" cy="499" rx="325" ry="19" fill="#d7e1e8"/><g transform="translate(100 265)"><g transform="translate(175 0)"><path d="M0 45Q-12 0 55 0H245Q270 0 270 35V175Q270 210 245 210H55Q-12 210 0 165Z" fill="url(#steel)" stroke="#354b5a" stroke-width="3"/><rect x="8" y="7" width="36" height="196" rx="13" fill="url(#dark)" stroke="#344a59" stroke-width="2"/><path d="M55 16H240" stroke="#f0f5f7" stroke-width="4" opacity=".6"/></g><path d="M437 30H507M437 180H507" stroke="#627988" stroke-width="14" stroke-linecap="round"/><path d="M445 105H500" stroke="#445a68" stroke-width="17" stroke-linecap="round"/><circle cx="500" cy="105" r="10" fill="url(#steel)" stroke="#536b7b"/><rect x="240" y="-21" width="37" height="29" rx="5" fill="url(#steel)" stroke="#536b7b" stroke-width="2"/><text x="265" y="115" font-size="21" fill="#354b5a" font-weight="bold">WABCO</text></g><g font-size="18" fill="#19394f" font-weight="bold"><text x="200" y="235">Рабочая камера</text><path d="M275 240L350 280" stroke="#277aaa" stroke-width="2"/><text x="690" y="510">Шток</text></g><rect x="36" y="190" width="848" height="345" fill="url(#wm)"/><text x="60" y="555" font-size="17" fill="#526779">Форма, порты и размеры изображения условны. Не для монтажа.</text><g transform="translate(930 184)" fill="#19394f"><text font-size="24" font-weight="bold">Каталожные сведения</text><rect y="30" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="62" font-size="17">Тип</text><text x="398" y="62" font-size="17" text-anchor="end" font-weight="bold">24</text><rect y="93" width="410" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="125" font-size="17">Тормоз</text><text x="398" y="125" font-size="17" text-anchor="end" font-weight="bold">Дисковый</text><rect y="156" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="188" font-size="17">Ход</text><text x="398" y="188" font-size="17" text-anchor="end" font-weight="bold">64 мм</text><rect y="219" width="410" height="54" rx="6" fill="#f1f5f7"/><text x="12" y="251" font-size="17">Давление (макс.)</text><text x="398" y="251" font-size="17" text-anchor="end" font-weight="bold">10,2 бар</text><rect y="282" width="410" height="54" rx="6" fill="#e3edf4"/><text x="12" y="314" font-size="17">Масса</text><text x="398" y="314" font-size="17" text-anchor="end" font-weight="bold">3,61 кг</text></g><rect x="35" y="600" width="1330" height="255" rx="16" fill="white" stroke="#bac9d5"/><text x="60" y="641" font-size="25" font-weight="bold" fill="#19394f">Функциональная связь контуров (не схема подключения)</text><rect x="65" y="670" width="300" height="66" rx="10" fill="#e3edf4"/><text x="215" y="698" font-size="18" font-weight="bold" text-anchor="middle" fill="#19394f">Модулятор EBS</text><text x="215" y="720" font-size="16" text-anchor="middle" fill="#19394f">Рабочее давление</text><path d="M370 703H515" stroke="#277aaa" stroke-width="4" marker-end="url(#a)"/><rect x="525" y="670" width="330" height="147" rx="12" fill="#183e62"/><text x="690" y="709" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Рабочая мембрана</text><text x="690" y="766" text-anchor="middle" fill="white" font-size="18">Передача усилия на шток</text><path d="M860 744H978" stroke="#277aaa" stroke-width="4" marker-end="url(#a)"/><rect x="990" y="710" width="345" height="68" rx="10" fill="#e3edf4"/><text x="1162" y="750" text-anchor="middle" font-size="19" font-weight="bold" fill="#19394f">Дисковый тормоз / суппорт</text><text x="60" y="840" font-size="16" fill="#526779">Маршруты и клапаны зависят от комплектации. Давление в таблице — характеристика детали.</text><rect y="875" width="1400" height="75" fill="#922d36"/><text x="35" y="920" font-size="21" font-weight="bold" fill="white">Учебная схема. Не монтажный чертёж. Требуется экспертная проверка.</text></g></svg>