<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Scania P/G/R — варианты рукоятки рычага КПП</title><desc id="d">Условное сравнение трёх каталожных вариантов алюминиевых рукояток, без изображения схемы переключений и геометрии реальной детали.</desc><defs><linearGradient id="metal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b9d1e1"/><stop offset=".55" stop-color="#6d8da7"/><stop offset="1" stop-color="#344e65"/></linearGradient></defs><rect width="1000" height="650" rx="20" fill="#11253a"/><g font-family="sans-serif" fill="#eef5fa"><text x="35" y="42" font-size="17" fill="#8ddaff">TrakSOS · ТехБаза · Трансмиссия</text><text x="35" y="84" font-size="28" font-weight="700">Scania P / G / R — рукоятки рычага КПП</text><text x="35" y="112" font-size="17" fill="#aabfd0">Алюминиевые варианты из каталога производителя</text><g id="knob-range" data-article="1796506"><rect x="35" y="141" width="302" height="363" rx="14" fill="#1d344a" stroke="#516b82"/><g transform="translate(186 177)"><rect x="-17" y="149" width="34" height="115" rx="5" fill="#516d85"/><path d="M-60 25 Q-57 4 -29 0 H29 Q57 4 60 25 L65 77 Q65 108 36 139 L23 156 H-23 L-36 139 Q-65 108 -65 77 Z" fill="url(#metal)" stroke="#d0e4ef" stroke-width="2.5"/><ellipse cx="0" cy="30" rx="44" ry="19" fill="#20354a" stroke="#8cacc1" stroke-width="2"/><text y="35" text-anchor="middle" font-size="12" fill="#d1e8f5">ВАРИАНТ 1</text><path d="M-40 69 Q0 81 40 69" fill="none" stroke="#91acbf" stroke-width="3"/></g><text x="186" y="447" font-size="17" text-anchor="middle" font-weight="700">Range-change 8+1</text><text x="186" y="477" font-size="20" text-anchor="middle" fill="#8ddaff">1796506</text></g><g id="knob-splitter" data-article="1919071"><rect x="349" y="141" width="302" height="363" rx="14" fill="#1d344a" stroke="#516b82"/><g transform="translate(500 177)"><rect x="-17" y="149" width="34" height="115" rx="5" fill="#516d85"/><path d="M-60 25 Q-57 4 -29 0 H29 Q57 4 60 25 L65 77 Q65 108 36 139 L23 156 H-23 L-36 139 Q-65 108 -65 77 Z" fill="url(#metal)" stroke="#d0e4ef" stroke-width="2.5"/><ellipse cx="0" cy="30" rx="44" ry="19" fill="#20354a" stroke="#8cacc1" stroke-width="2"/><text y="35" text-anchor="middle" font-size="12" fill="#d1e8f5">ВАРИАНТ 2</text><path d="M-40 69 Q0 81 40 69" fill="none" stroke="#91acbf" stroke-width="3"/></g><text x="500" y="447" font-size="17" text-anchor="middle" font-weight="700">Range-splitter 12+2</text><text x="500" y="477" font-size="20" text-anchor="middle" fill="#8ddaff">1919071</text></g><g id="knob-transmatic" data-article="1782045"><rect x="663" y="141" width="302" height="363" rx="14" fill="#1d344a" stroke="#516b82"/><g transform="translate(814 177)"><rect x="-17" y="149" width="34" height="115" rx="5" fill="#516d85"/><path d="M-60 25 Q-57 4 -29 0 H29 Q57 4 60 25 L65 77 Q65 108 36 139 L23 156 H-23 L-36 139 Q-65 108 -65 77 Z" fill="url(#metal)" stroke="#d0e4ef" stroke-width="2.5"/><ellipse cx="0" cy="30" rx="44" ry="19" fill="#20354a" stroke="#8cacc1" stroke-width="2"/><text y="35" text-anchor="middle" font-size="12" fill="#d1e8f5">ВАРИАНТ 3</text><path d="M-40 69 Q0 81 40 69" fill="none" stroke="#91acbf" stroke-width="3"/></g><text x="814" y="447" font-size="17" text-anchor="middle" font-weight="700">ZF-Transmatic</text><text x="814" y="477" font-size="20" text-anchor="middle" fill="#8ddaff">1782045</text></g><text x="35" y="548" font-size="17">Сравнение каталожных вариантов, а не схема переключения передач.</text><text x="35" y="577" font-size="17">Выбор по типу КПП и каталогу конкретного автомобиля. VIN не подтверждён.</text><text x="35" y="618" font-size="15" fill="#f6cb83">Условная геометрия · экспертная проверка не пройдена · не монтажный чертёж</text></g></svg>