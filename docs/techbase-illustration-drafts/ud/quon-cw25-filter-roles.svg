dth="405" height="245" rx="14" fill="#edf3f8" stroke="#b1c7d7" stroke-width="2"/><text x="1057" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="650" text-anchor="middle" fill="#244867">На двигателе</text><rect x="1020" y="350" width="75" height="110" rx="14" fill="#b0c7d8" stroke="#4b718e" stroke-width="2"/><rect x="1012" y="336" width="91" height="22" rx="9" fill="#64869f" stroke="none" stroke-width="2"/><text x="1057" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#233b51">Вторичный</text><path d="M585 402L850 402" stroke="#247aa7" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="45" y="605" width="1350" height="140" rx="12" fill="#e2edf6" stroke="#b8ccdf" stroke-width="2"/><text x="720" y="640" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#233b51">Первичный фильтр установлен на шасси, вторичный — на двигателе. Точная позиция, магистрали и артикулы</text><text x="720" y="670" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="500" text-anchor="middle" fill="#233b51">не установлены.</text><text x="720" y="728" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#48617a">Источник: UD Trucks · спецификация 12.2022, стр. 2 · evidence.json</text><rect x="0" y="770" width="1440" height="50" rx="0" fill="#15263d" stroke="none" stroke-width="2"/><text x="720" y="803" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="middle" fill="white">ФУНКЦИОНАЛЬНЫЙ ЧЕРНОВИК · НЕ МОНТАЖНАЯ СХЕМА · НЕЗАВИСИМАЯ ПРОВЕРКА ОБЯЗАТЕЛЬНА</text></svg>