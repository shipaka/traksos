<text x="1040" y="612" font-size="16" font-weight="400" text-anchor="start" fill="#213746">FH12 1993–2005, FH с 2012 г.</text><text x="1040" y="636" font-size="16" font-weight="400" text-anchor="start" fill="#213746">Указаны в каталоге Cojali.</text>
<text x="50" y="714" font-size="17" font-weight="400" text-anchor="start" fill="#213746">ABS-клапан не равен полноценному осевому EBS-модулятору. Цвета линий условные; не схема подключения.</text>
<rect x="24" y="746" width="1392" height="58" rx="13" fill="#fff4dc" stroke="#bacbd5"/><text x="42" y="770" font-size="16" font-weight="400" text-anchor="start" fill="#213746">Разрез условный: количество катушек и геометрия не подтверждены, реальная распиновка и конфигурация не нанесены.</text><text x="42" y="791" font-size="16" font-weight="400" text-anchor="start" fill="#213746">Черновая оригинальная функциональная иллюстрация. Не заводской чертёж, не инструкция ремонта тормозов.</text></g></svg>
