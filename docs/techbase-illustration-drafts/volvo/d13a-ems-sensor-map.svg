<rect x="32" y="659" width="1376" height="130" rx="12" fill="#fff" stroke="#c0ced6"/><text x="54" y="695" class="group" text-anchor="start">Как читать карту</text><text x="54" y="725" class="small" text-anchor="start">Номера соответствуют списку в бюллетене, а не номерам контактов разъёмов. Расположение дано словами.</text><text x="54" y="756" class="small" text-anchor="start">Стрелки — функциональный обмен; иллюстрация двигателя условная. Точную позицию и форму датчика проверять по VIN.</text>
<rect x="24" y="810" width="1392" height="54" rx="8" fill="#fff4dc" stroke="#d0b476"/><text x="42" y="832" class="note" text-anchor="start">Номера 1–12 — позиции перечня; не каталожные номера, не распиновка. Форма агрегатов не подтверждена.</text><text x="42" y="852" class="note" text-anchor="start">Volvo 200 281 01 · 02.2006 · оригинальная функциональная карта, не заводской чертёж.</text></svg>
