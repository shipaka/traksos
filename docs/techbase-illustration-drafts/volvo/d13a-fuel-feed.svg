<rect x="45" y="608" width="1290" height="88" rx="12" fill="#fff" stroke="#c4d1d9"/><text x="65" y="637" text-anchor="start" class="small">Контроль: датчик давления после фильтра; датчик воды в сепараторе; EECU управляет впрыском.</text><text x="65" y="667" text-anchor="start" class="small">Здесь нет общей магистрали высокого давления: давление впрыска создаётся в каждой насос-форсунке.</text>
<text x="42" y="146" text-anchor="start" class="note">Бирюзовый — подача · серый пунктир — возврат и отвод воздуха</text>
