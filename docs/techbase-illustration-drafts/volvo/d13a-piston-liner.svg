<text x="930" y="465" class="note" text-anchor="start">Профили схематичны; не размеры для подбора.</text>
<rect x="907" y="532" width="477" height="230" rx="12" fill="#eef5f8" stroke="#bacbd4"/><text x="930" y="568" class="group" text-anchor="start">Связь с системами</text><text x="930" y="602" class="small" text-anchor="start">ОЖ отводит тепло через стенку гильзы.</text><text x="930" y="635" class="small" text-anchor="start">Масло охлаждает нижнюю часть поршня.</text><text x="930" y="668" class="small" text-anchor="start">Шатун передаёт усилие на коленвал.</text><text x="930" y="710" class="note" text-anchor="start">Янтарный — принцип подачи масла.</text>
<rect x="24" y="810" width="1392" height="54" rx="12" fill="#fff4dc" stroke="#bacbd4"/><text x="42" y="832" class="note" text-anchor="start">Число и типы колец подтверждены. Форма днища, зазоры, размеры и взаимное положение деталей условны.</text><text x="42" y="852" class="note" text-anchor="start">Volvo 200 281 01 · 02.2006 · оригинальный условный разрез, не заводской чертёж.</text></svg>
