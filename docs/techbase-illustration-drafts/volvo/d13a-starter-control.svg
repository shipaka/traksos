<rect x="24" y="810" width="1392" height="54" rx="8" fill="#fff4dc" stroke="#d0b476"/><text x="42" y="832" class="note" text-anchor="start">Не использовать карту для перемыкания реле или поиска конкретных контактов. Нужна схема по VIN, группа 33.</text><text x="42" y="852" class="note" text-anchor="start">Volvo 200 281 01 · 02.2006 · оригинальная функциональная карта, не заводской чертёж.</text></svg>
