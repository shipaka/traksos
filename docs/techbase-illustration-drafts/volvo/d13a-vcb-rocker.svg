<text x="55" y="688" class="note" text-anchor="start">Янтарный — масло · фиолетовый — управляющий сигнал. EPG обеспечивает противодавление отдельно.</text>
<rect x="24" y="733" width="1352" height="52" rx="8" fill="#fff4df" stroke="#d2b77c"/><text x="40" y="754" class="note" text-anchor="start">Разрез условный; регулировочные размеры, момент открытия клапанов и внутренняя геометрия не приводятся.</text><text x="40" y="775" class="note" text-anchor="start">Volvo 200 281 01, 02.2006 · оригинальная функциональная схема · не OEM-чертёж и не ремонтная инструкция.</text></svg>
