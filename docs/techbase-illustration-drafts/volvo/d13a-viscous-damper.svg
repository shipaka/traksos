<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880" role="img"><title>Volvo D13A · вязкостный демпфер коленвала</title><defs><linearGradient id="steel" x1="0" y1="0" x2="0.3" y2="1"><stop stop-color="#e6edf1"/><stop offset=".43" stop-color="#a2b5c0"/><stop offset="1" stop-color="#486474"/></linearGradient><linearGradient id="iron" x2="1" y2="1"><stop stop-color="#91a6b1"/><stop offset="1" stop-color="#364f5e"/></linearGradient><pattern id="section" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#687f8a" stroke-width="1"/></pattern><marker id="oil" markerWidth="8" markerHeight="7" viewBox="0 0 9 7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#b47828"/></marker><marker id="gas" markerWidth="8" markerHeight="7" viewBox="0 0 9 7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#317e91"/></marker><marker id="mech" markerWidth="8" markerHeight="7" viewBox="0 0 9 7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#4d697b"/></marker><marker id="signal" markerWidth="8" markerHeight="7" viewBox="0 0 9 7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#7652a1"/></marker></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#213745}.head{font-size:33px;font-weight:bold;fill:white}.sub{font-size:19px;fill:#dfebf1}.label{font-size:21px;font-weight:bold}.small{font-size:17px}.note{font-size:15px;fill:#4e6370}.group{font-size:24px;font-weight:bold;fill:#245d77}.lead{stroke:#667f8e;stroke-width:2;fill:none}.oil{fill:none;stroke:#b47828;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#oil);}.gas{fill:none;stroke:#317e91;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#gas);}.mech{fill:none;stroke:#4d697b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#mech);}.signal{fill:none;stroke:#7652a1;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#signal);stroke-dasharray:9 7}</style><rect width="1440" height="880" fill="#edf3f6"/><rect width="1440" height="100" fill="#1b3547"/><text x="30" y="44" class="head" text-anchor="start">Volvo D13A · вязкостный демпфер коленвала</text><text x="30" y="76" class="sub" text-anchor="start">Передний торец двигателя · принцип гидравлического гашения крутильных колебаний · стр. 14</text>
