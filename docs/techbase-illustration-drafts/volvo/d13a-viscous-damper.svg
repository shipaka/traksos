<text x="76" y="235" class="small" text-anchor="start">Корпус и шкив</text><path d="M240 230L287 253" class="lead"/><text x="600" y="279" class="small" text-anchor="start">Инерционное кольцо</text><path d="M596 284L565 323" class="lead"/><text x="72" y="688" class="small" text-anchor="start">Силиконовая жидкость</text><path d="M255 680L295 630" class="lead"/><text x="570" y="703" class="small" text-anchor="start">Ступица коленвала</text><path d="M580 681L470 510" class="lead"/>
<rect x="831" y="145" width="557" height="620" rx="14" fill="#f4f8fa" stroke="#bdcdd6"/><text x="854" y="182" class="group" text-anchor="start">Принцип действия</text>
<text x="854" y="227" class="label" text-anchor="start">1. Неравномерные импульсы вращения</text><text x="854" y="256" class="small" text-anchor="start">возникают от рабочих ходов цилиндров.</text>
<path d="M868 318Q891 264 914 318T960 318T1006 318T1052 318T1098 318T1144 318T1190 318T1236 318T1282 318T1328 318" stroke="#526d7c" fill="none" stroke-width="4"/>
<text x="854" y="383" class="label" text-anchor="start">2. Кольцо имеет собственную инерцию</text><text x="854" y="412" class="small" text-anchor="start">и может двигаться относительно корпуса.</text>
<text x="854" y="465" class="label" text-anchor="start">3. Вязкая жидкость рассеивает энергию</text><text x="854" y="494" class="small" text-anchor="start">и снижает амплитуду крутильных колебаний.</text>
<path d="M868 555Q891 536 914 555T960 555T1006 555T1052 555T1098 555T1144 555T1190 555T1236 555T1282 555T1328 555" stroke="#317e91" fill="none" stroke-width="4"/>
<text x="854" y="617" class="small" text-anchor="start">Не резиновый шкив общего типа.</text><text x="854" y="651" class="note" text-anchor="start">Графики условные, без измеренных значений.</text><text x="854" y="695" class="small" text-anchor="start">Расположение: передний фланец коленвала.</text>
<rect x="24" y="810" width="1392" height="54" rx="14" fill="#fff4dc" stroke="#bdcdd6"/><text x="42" y="832" class="note" text-anchor="start">Нельзя использовать рисунок для оценки износа, подбора демпфера, разбора или заправки жидкостью.</text><text x="42" y="852" class="note" text-anchor="start">Volvo 200 281 01 · 02.2006 · оригинальный функциональный черновик; не OEM-чертёж.</text></svg>
