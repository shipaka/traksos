<text x="462" y="375" font-size="17" font-weight="700" text-anchor="end" fill="#203747">Датчик</text><text x="465" y="558" font-size="17" font-weight="400" text-anchor="middle" fill="#203747">Условный вид оси</text>
<rect x="90" y="184" width="232" height="48" rx="12" fill="#e2ecf2" stroke="#bdcbd5"/><text x="206" y="215" font-size="20" font-weight="700" text-anchor="middle" fill="#203747">ЭБУ подвески</text><path d="M467 274V210H322" class="sig"/>
<rect x="532" y="184" width="308" height="48" rx="12" fill="#e2ecf2" stroke="#bdcbd5"/><text x="686" y="215" font-size="20" font-weight="700" text-anchor="middle" fill="#203747">Клапанный блок</text><path d="M322 197H532" class="sig"/><path d="M686 232V240H752V376H733" class="air"/><path d="M532 225H380V376H364" class="air"/>
<text x="67" y="619" font-size="17" font-weight="400" text-anchor="start" fill="#203747">Фиолетовый — логика сигналов; синий — подача воздуха.</text><text x="67" y="650" font-size="16" font-weight="400" text-anchor="start" fill="#203747">Расположение датчика, тяги, клапана и ЭБУ на рисунке условное.</text><text x="67" y="681" font-size="16" font-weight="400" text-anchor="start" fill="#203747">Не определены фактическая ось, разъёмы ЭБУ и трасса жгута.</text>
<rect x="927" y="136" width="466" height="585" rx="12" fill="#f6f9fa" stroke="#bdcbd5"/><text x="949" y="170" font-size="24" font-weight="700" text-anchor="start" fill="#203747">Каталожные различия</text>
<rect x="945" y="192" width="429" height="224" rx="12" fill="#fff" stroke="#bdcbd5"/><text x="964" y="223" font-size="24" font-weight="700" text-anchor="start" fill="#203747">2309101</text><text x="964" y="255" font-size="19" font-weight="400" text-anchor="start" fill="#203747">Knorr-Bremse 0504002112</text><text x="964" y="285" font-size="18" font-weight="400" text-anchor="start" fill="#203747">5 В · потенциометрический</text><text x="964" y="314" font-size="17" font-weight="400" text-anchor="start" fill="#203747">Байонет DIN 72585-3.1, код A</text><text x="964" y="344" font-size="18" font-weight="400" text-anchor="start" fill="#203747">326 г</text><text x="964" y="374" font-size="18" font-weight="700" text-anchor="start" fill="#203747">FH/FM 2005–2012</text><text x="964" y="399" font-size="15" font-weight="400" text-anchor="start" fill="#203747">FH12 1998–2005; FH16 1998–2006</text>
<rect x="945" y="431" width="429" height="224" rx="12" fill="#fff" stroke="#bdcbd5"/><text x="964" y="462" font-size="24" font-weight="700" text-anchor="start" fill="#203747">2880165</text><text x="964" y="494" font-size="19" font-weight="400" text-anchor="start" fill="#203747">Volvo 21643575</text><text x="964" y="524" font-size="18" font-weight="400" text-anchor="start" fill="#203747">5 В · потенциометрический</text><text x="964" y="553" font-size="17" font-weight="400" text-anchor="start" fill="#203747">Байонет DIN 72585-3.1, код A</text><text x="964" y="583" font-size="18" font-weight="400" text-anchor="start" fill="#203747">281 г</text><text x="964" y="613" font-size="18" font-weight="700" text-anchor="start" fill="#203747">FH с 2005 г.; FH16 с 2003 г.</text>
<text x="949" y="687" font-size="15" font-weight="400" text-anchor="start" fill="#203747">Совпадение разъёма не доказывает заменяемость.</text>
<rect x="24" y="765" width="1392" height="58" rx="12" fill="#fff4dc" stroke="#bdcbd5"/><text x="42" y="789" font-size="16" font-weight="400" text-anchor="start" fill="#203747">Каталожные строки Cojali не гарантируют применимость к любому VIN. Нет схемы распиновки или калибровки.</text><text x="42" y="811" font-size="16" font-weight="400" text-anchor="start" fill="#203747">Оригинальная функциональная карта. Не заводской чертёж, не инструкция ремонта.</text></g></svg>
