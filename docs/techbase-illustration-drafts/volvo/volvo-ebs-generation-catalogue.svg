<text x="66" y="695" font-size="16" font-weight="400" text-anchor="start" fill="#233947">K103367K50 — комплект; сервисные номера не означают взаимозаменяемость между поколениями.</text>
<text x="66" y="748" font-size="18" font-weight="700" text-anchor="start" fill="#233947">Не установлен: центральный ЭБУ, двухканальный EPM и конкретная конфигурация тягача FH.</text><text x="66" y="775" font-size="16" font-weight="400" text-anchor="start" fill="#233947">Каталог подтверждает марку Volvo и поколение системы, но не годы FH или точную компоновку.</text>
<rect x="24" y="807" width="1392" height="55" rx="13" fill="#fff4dc" stroke="#bfced8"/><text x="42" y="830" font-size="16" font-weight="400" text-anchor="start" fill="#233947">Не использовать как схему подключения. Номера и поколение проверять по VIN и документации автомобиля.</text><text x="42" y="850" font-size="16" font-weight="400" text-anchor="start" fill="#233947">Оригинальная функциональная иллюстрация; не схема ремонта, не заводской чертёж.</text></g></svg>
