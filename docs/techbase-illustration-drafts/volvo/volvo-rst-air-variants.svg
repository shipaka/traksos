6 155.39999999999998Q89 177.60000000000002 162 155.39999999999998" fill="none" stroke="#59636b" stroke-width="2"/><rect x="20" y="205" width="138" height="17" rx="4" fill="url(#metal)" stroke="#526d7e"/></g><rect x="571" y="501" width="296" height="27" rx="7" fill="url(#metal)" stroke="#526d7d"/><text x="519" y="560" font-size="17" font-weight="400" text-anchor="start" fill="#203747">Тяжёлые перевозки и неровные дороги.</text><text x="519" y="589" font-size="17" font-weight="400" text-anchor="start" fill="#203747">Обязателен при RALIM20.</text><text x="719" y="616" font-size="15" font-weight="400" text-anchor="middle" fill="#203747">Условная геометрия, без масштаба</text><rect x="955" y="137" width="440" height="492" rx="12" fill="#f6f9fa" stroke="#bdcbd5"/><text x="975" y="172" font-size="27" font-weight="700" text-anchor="start" fill="#203747">RST-AIR6</text><text x="975" y="204" font-size="21" font-weight="700" text-anchor="start" fill="#203747">Жаркий климат</text><rect x="1027" y="239" width="296" height="40" rx="5" fill="url(#metal)" stroke="#546d7c"/><g transform="translate(1086 279)"><rect width="178" height="13" rx="5" fill="url(#metal)" stroke="#526d7e"/><path d="M14 13Q-4 66.6 11 142.08Q18 173.16 24 205H154Q160 173.16 167 142.08Q182 66.6 164 13Z" fill="url(#rubber)" stroke="#263944" stroke-width="2"/><path d="M16 155.39999999999998Q89 177.60000000000002 162 155.39999999999998" fill="none" stroke="#59636b" stroke-width="2"/><rect x="20" y="205" width="138" height="17" rx="4" fill="url(#metal)" stroke="#526d7e"/></g><rect x="1027" y="501" width="296" height="27" rx="7" fill="url(#metal)" stroke="#526d7d"/><text x="975" y="560" font-size="17" font-weight="400" text-anchor="start" fill="#203747">Тяжёлые перевозки в тёплых регионах.</text><text x="975" y="589" font-size="17" font-weight="400" text-anchor="start" fill="#203747">Термостойкие материалы.</text><text x="1175" y="616" font-size="15" font-weight="400" text-anchor="middle" fill="#203747">Условная геометрия, без масштаба</text>
<rect x="43" y="643" width="1352" height="84" rx="12" fill="#e6eff4" stroke="#bdcbd5"/><text x="64" y="670" font-size="18" font-weight="700" text-anchor="start" fill="#203747">RST-AIR4: баллоны ведущей оси крупнее баллонов подкатной / поддерживающей оси.</text><text x="64" y="700" font-size="17" font-weight="400" text-anchor="start" fill="#203747">RST-AIR6: крупнее стандартных; при сопоставимой нагрузке давление ниже. Конкретные размеры и OE не подтверждены.</text>
