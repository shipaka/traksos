<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>SACHS ConAct · Пневмопривод сцепления</title><desc>Концентрический цилиндр · функциональные связи; Нет схемы пинов или процедуры калибровки; расположение электроники условно.</desc><metadata>TrakSOS original functional draft; https://aftermarket.zf.com/en/aftermarket-portal/knowledge-hub/calibrating-conact/; no copied OEM artwork; HOLD.</metadata><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486779"/></marker><linearGradient id="metal"><stop offset="0" stop-color="#8ca5b4"/><stop offset=".5" stop-color="#eef4f7"/><stop offset="1" stop-color="#8ca5b4"/></linearGradient></defs><g font-family="Arial,sans-serif"><rect width="1200" height="760" fill="#f4f8fa"/><rect width="1200" height="115" fill="#172f3c"/><text x="35" y="48" font-size="30" fill="#fff" font-weight="700" text-anchor="start">SACHS ConAct · Пневмопривод сцепления</text><text x="35" y="83" font-size="18" fill="#c6dce6" font-weight="500" text-anchor="start">Концентрический цилиндр · функциональные связи</text><text x="1165" y="48" font-size="24" fill="#ffb25f" font-weight="700" text-anchor="end">TrakSOS</text><rect x="35" y="145" width="1130" height="480" rx="15" fill="#fff" stroke="#d3e0e7" stroke-width="2"/><circle cx="310" cy="343" r="120" fill="url(#metal)" stroke="#557888" stroke-width="2"/><circle cx="310" cy="343" r="95" fill="#526d7c" stroke="#557888" stroke-width="2"/><circle cx="310" cy="343" r="65" fill="#c5dce7" stroke="#557888" stroke-width="2"/><circle cx="310" cy="343" r="40" fill="#fff" stroke="#557888" stroke-width="2"/><rect x="430" y="304" width="60" height="76" rx="10" fill="#3a5361" stroke="#7292a2" stroke-width="2"/> <path d="M490 342H570V205" fill="none" stroke="#267d96" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="496" font-size="21" fill="#243d4b" font-weight="600" text-anchor="middle">Цилиндр вокруг первичного вала</text><rect x="650" y="175" width="420" height="78" rx="10" fill="#e0ebf0" stroke="#7292a2" stroke-width="2"/><text x="860" y="211" font-size="21" fill="#243d4b" font-weight="600" text-anchor="middle">Электропневматический клапан</text><text x="860" y="238" font-size="16" fill="#243d4b" font-weight="600" text-anchor="middle">регулирует ход</text><rect x="650" y="289" width="420" height="78" rx="10" fill="#e0ebf0" stroke="#7292a2" stroke-width="2"/><text x="860" y="325" font-size="21" fill="#243d4b" font-weight="600" text-anchor="middle">Датчик перемещения</text><text x="860" y="352" font-size="16" fill="#243d4b" font-weight="600" text-anchor="middle">обратная связь</text><rect x="650" y="405" width="420" height="78" rx="10" fill="#e0ebf0" stroke="#7292a2" stroke-width="2"/><text x="860" y="441" font-size="21" fill="#243d4b" font-weight="600" text-anchor="middle">Электроника трансмиссии</text><text x="860" y="468" font-size="16" fill="#243d4b" font-weight="600" text-anchor="middle">данные CAN и управление</text><path d="M650 214H570" fill="none" stroke="#267d96" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M650 328H570V342" fill="none" stroke="#267d96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M860 367V405" fill="none" stroke="#267d96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="575" font-size="20" fill="#243d4b" font-weight="600" text-anchor="middle">После установки требуется калибровка по документации автомобиля.</text><g opacity=".065" transform="translate(600 415) rotate(-22)"><text x="0" y="0" font-size="90" fill="#172f3c" font-weight="700" text-anchor="middle">TrakSOS</text></g><rect x="30" y="662" width="1140" height="70" rx="9" fill="#fff0dc" stroke="#e4d0b0" stroke-width="2"/><text x="48" y="687" font-size="19" fill="#895410" font-weight="700" text-anchor="start">ЧЕРНОВИ