<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img"><title>EBS: функциональные связи</title><rect width="960" height="510" fill="#f8fafb"/><rect x="18" y="18" width="924" height="474" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="52" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a3510e">TrakSOS / ТехБаза</text><text x="40" y="89" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#183449">EBS: функциональные связи</text><text x="40" y="116" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#183449">Условные блоки • без монтажных соединений</text><rect x="40" y="175" width="245" height="70" rx="8" fill="#e7eff4" stroke="#24475c" stroke-width="2"/><text x="56" y="215" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183449">Запрос водителя</text><rect x="355" y="175" width="245" height="70" rx="8" fill="#e7eff4" stroke="#24475c" stroke-width="2"/><text x="371" y="215" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183449">ЭБУ тормозов</text><rect x="675" y="175" width="245" height="70" rx="8" fill="#e7eff4" stroke="#24475c" stroke-width="2"/><text x="691" y="215" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183449">Модулятор</text><rect x="355" y="320" width="245" height="70" rx="8" fill="#e7eff4" stroke="#24475c" stroke-width="2"/><text x="371" y="360" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183449">Датчики колёс</text><rect x="675" y="320" width="245" height="70" rx="8" fill="#e7eff4" stroke="#24475c" stroke-width="2"/><text x="691" y="360" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183449">Пневмокамера</text><line x1="285" y1="210" x2="355" y2="210" stroke="#347b9c" stroke-width="3" /><line x1="600" y1="210" x2="675" y2="210" stroke="#347b9c" stroke-width="3" /><line x1="475" y1="320" x2="475" y2="245" stroke="#347b9c" stroke-width="3" stroke-dasharray="8 5"/><line x1="795" y1="245" x2="795" y2="320" stroke="#b26e20" stroke-width="3" /><text x="42" y="285" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#347b9c">Синий — обмен сигналами</text><text x="42" y="315" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#a3510e">Оранжевый — подача воздуха</text><text x="42" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#183449">Функциональные связи; не монтажная схема, не номера портов.</text><text x="40" y="468" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a3510e">Справочно • сверять маркировку, комплектацию и документацию</text></svg>