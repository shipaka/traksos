xt x="81" y="461" font-family="Arial, sans-serif" font-size="16" fill="#183449" font-weight="400" text-anchor="start">Воздух</text><line x1="223" y1="455" x2="251" y2="455" stroke="#d47a23" stroke-width="3" /><text x="259" y="461" font-family="Arial, sans-serif" font-size="16" fill="#183449" font-weight="400" text-anchor="start">Сигнал</text><line x1="401" y1="455" x2="429" y2="455" stroke="#a9423c" stroke-width="3" /><text x="437" y="461" font-family="Arial, sans-serif" font-size="16" fill="#183449" font-weight="400" text-anchor="start">Питание</text><line x1="579" y1="455" x2="607" y2="455" stroke="#26856b" stroke-width="3" /><text x="615" y="461" font-family="Arial, sans-serif" font-size="16" fill="#183449" font-weight="400" text-anchor="start">Данные</text><line x1="757" y1="455" x2="785" y2="455" stroke="#5a7080" stroke-width="3" stroke-dasharray="7 5"/><text x="793" y="461" font-family="Arial, sans-serif" font-size="16" fill="#183449" font-weight="400" text-anchor="start">Функция</text><text x="40" y="494" font-family="Arial, sans-serif" font-size="16" fill="#a3510e" font-weight="700" text-anchor="start">Точные контакты, порты и применимость — только по документации.</text></svg>