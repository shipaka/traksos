<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Клин изменения наклона заднего моста</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Ходовая и механика</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="26" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Клин изменения наклона заднего моста</text><text x="40" y="119" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Авторская справочная иллюстрация • не OEM-схема</text><rect x="38" y="164" width="428" height="258" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(48 174) scale(.89)"><rect x="50" y="70" width="350" height="32" rx="8" fill="#e6eff3" stroke="#24475c" stroke-width="2"/><path d="M130 120 L310 105 L310 145 L130 145 Z" stroke="#24475c" stroke-width="3" fill="#eab16d" stroke-linecap="round" stroke-linejoin="round"/><line x1="85" y1="170" x2="365" y2="170" stroke="#24475c" stroke-width="13" stroke-linecap="round"/><circle cx="225" cy="170" r="32" fill="#c7dbe4" stroke="#24475c" stroke-width="2"/><text x="225" y="253" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Клин между сопряжёнными деталями</text></g><rect x="486" y="164" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="192" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="218" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Клин относится к согласованию угла моста и</text><text x="502" y="241" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">рессорной подвески.</text><rect x="486" y="294" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="322" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Угол подбирается расчётом и по</text><text x="502" y="371" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">документации; не менять геометрию по этой</text><text x="502" y="394" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">картинке.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Мосты и оси</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Форма условная; точные параметры и применимость по документации.</text></svg>