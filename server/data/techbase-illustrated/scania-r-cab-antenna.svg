<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Антенный узел кабины: радио и GNSS</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Электрика и ЭБУ</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="26" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Антенный узел кабины: радио и GNSS</text><text x="40" y="119" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Авторская справочная иллюстрация • не OEM-схема</text><rect x="38" y="164" width="428" height="258" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(48 174) scale(.89)"><rect x="80" y="176" width="290" height="34" rx="8" fill="#e6eff3" stroke="#24475c" stroke-width="2"/><path d="M160 176 Q175 125 210 125 Q245 125 260 176 Z" stroke="#24475c" stroke-width="3" fill="#a9c6d4" stroke-linecap="round" stroke-linejoin="round"/><line x1="210" y1="125" x2="210" y2="56" stroke="#24475c" stroke-width="6" stroke-linecap="round"/><path d="M230 68 Q264 92 230 116 M248 52 Q300 91 248 132" stroke="#287eae" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="253" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Антенна / условная зона радиосвязи</text></g><rect x="486" y="164" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="192" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="218" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-