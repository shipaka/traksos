<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Крышный автономный охладитель кабины</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Автономное оборудование</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="26" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Крышный автономный охладитель кабины</text><text x="40" y="119" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Авторская справочная иллюстрация • не OEM-схема</text><rect x="38" y="164" width="428" height="258" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(48 174) scale(.89)"><rect x="60" y="60" width="330" height="146" rx="8" fill="#e6eff3" stroke="#24475c" stroke-width="2"/><circle cx="225" cy="133" r="60" fill="#f2f7f9" stroke="#24475c" stroke-width="2"/><circle cx="225" cy="133" r="12" fill="#6f90a0" stroke="#24475c" stroke-width="2"/><line x1="243" y1="133" x2="275.63283392365713" y2="148.662570953051" stroke="#24475c" stroke-width="12" stroke-linecap="round"/><line x1="234" y1="148.5884572681199" x2="236.75223262791016" y2="184.6806059200111" stroke="#24475c" stroke-width="12" stroke-linecap="round"/><line x1="216" y1="148.5884572681199" x2="186.11939870425306" y2="169.0180349669601" stroke="#24475c" stroke-width="12" stroke-linecap="round"/><line x1="207" y1="133" x2="174.36716607634287" y2="117.33742904694901" stroke="#24475c" stroke-width="12" stroke-linecap="round"/><line x1="216" y1="117.4115427318801" x2="213.2477673720898" y2="81.31939407998892" stroke="#24475c" stroke-width="12" stroke-linecap="round"/><line x1="234" y1="117.4115427318801" x2="263.88060129574694" y2="96.98196503303991" stroke="#24475c" stroke-width="12" stroke-linecap="round"/><text x="225" y="253" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Теплообменник и вентилятор</text></g><rect x="486" y="164" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="192" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="218" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Scania перечисляет несколько крышных</text><text x="502" y="241" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">моделей охладителя.</text><rect x="486" y="294" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="322" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Уточнить модель прибора, способ питания и</text><text x="502" y="371" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">наличие водяного контура.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Климат</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Форма условная; точные параметры и применимость по документации.</text></svg>