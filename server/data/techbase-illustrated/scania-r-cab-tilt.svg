<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Механизм опрокидывания кабины</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="47" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Ходовая и механика</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="27" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Механизм опрокидывания кабины</text><text x="40" y="125" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Справочная авторская иллюстрация • не OEM-схема</text><rect x="38" y="160" width="428" height="260" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(8 22) scale(0.92 0.92)"><path d="M70 284 V185 L120 157 H216 L260 215 V284 Z" stroke="#24475c" stroke-width="3" fill="#adc7d4" stroke-linejoin="round" stroke-linecap="round"/><rect x="260" y="264" width="178" height="24" rx="9" fill="#829daa" stroke="#24475c" stroke-width="2"/><circle cx="144" cy="298" r="42" fill="#536e7d" stroke="#24475c" stroke-width="2"/><circle cx="386" cy="298" r="42" fill="#536e7d" stroke="#24475c" stroke-width="2"/><path d="M171 283 L245 160" stroke="#d47a23" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="400" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Зоны условные, без монтажных координат</text></g><rect x="486" y="160" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="188" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="216" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Руководство описывает ручное и</text><text x="502" y="240" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">электрическое исполнения механизма.</text><rect x="486" y="292" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="320" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Не работать под промежуточно поднятой</text><text x="502" y="372" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">кабиной; нужна штатная фиксация и</text><text x="502" y="396" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">инструкция.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Кабина</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Цвет линий условный; пины, параметры и совместимость не подтверждены.</text></svg>