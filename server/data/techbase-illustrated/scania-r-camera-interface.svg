<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Камера и соединительная коробка</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="47" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Электрика и ЭБУ</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="27" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Камера и соединительная коробка</text><text x="40" y="125" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Справочная авторская иллюстрация • не OEM-схема</text><rect x="38" y="160" width="428" height="260" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(8 22) scale(0.92 0.92)"><rect x="125" y="201" width="141" height="110" rx="9" fill="#abc4d0" stroke="#24475c" stroke-width="2"/><circle cx="195" cy="256" r="37" fill="#29495b" stroke="#24475c" stroke-width="2"/><circle cx="195" cy="256" r="20" fill="#d6e9f3" stroke="#24475c" stroke-width="2"/><path d="M282 222 Q315 256 282 290" stroke="#d47a23" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M307 208 Q343 256 307 304" stroke="#d47a23" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M332 194 Q371 256 332 318" stroke="#d47a23" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="400" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Условный элемент; зона и углы не заданы</text></g><rect x="486" y="160" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="188" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="216" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">В списке оборудования описана</text><text x="502" y="240" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">соединительная коробка камеры с защитой</text><text x="502" y="264" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">объектива.</text><rect x="486" y="292" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="320" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Не путать видеокабель, питание и</text><text x="502" y="372" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">управляющий интерфейс; схема зависит от</text><text x="502" y="396" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">комплектации.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Обзорность</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Цвет линий условный; пины, параметры и совместимость не подтверждены.</text></svg>