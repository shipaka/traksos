<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Контур внешнего жидкостного отопления</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="47" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Двигатель</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="27" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Контур внешнего жидкостного отопления</text><text x="40" y="125" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Справочная авторская иллюстрация • не OEM-схема</text><rect x="38" y="160" width="428" height="260" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(8 22) scale(0.92 0.92)"><rect x="65" y="191" width="131" height="129" rx="9" fill="#adc5d0" stroke="#24475c" stroke-width="2"/><rect x="308" y="191" width="131" height="129" rx="9" fill="#adc5d0" stroke="#24475c" stroke-width="2"/><path d="M196 215 H308 M308 298 H196" stroke="#287eae" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="215" y1="215" x2="288" y2="215" stroke="#287eae" stroke-width="5" stroke-linecap="round"/><path d="M276,208 L288,215 L276,222" stroke="#287eae" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M285 298 L215 298 M225 291 L215 298 L225 305" stroke="#287eae" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="323" y1="205" x2="323" y2="306" stroke="#24475c" stroke-width="3" stroke-linecap="round"/><line x1="347" y1="205" x2="347" y2="306" stroke="#24475c" stroke-width="3" stroke-linecap="round"/><line x1="371" y1="205" x2="371" y2="306" stroke="#24475c" stroke-width="3" stroke-linecap="round"/><line x1="395" y1="205" x2="395" y2="306" stroke="#24475c" stroke-width="3" stroke-linecap="round"/><line x1="419" y1="205" x2="419" y2="306" stroke="#24475c" stroke-width="3" stroke-linecap="round"/><text x="250" y="400" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Условная циркуляция; не номера выводов</text></g><rect x="486" y="160" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="188" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="216" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Для надстройки предусмотрены варианты</text><text x="502" y="240" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">подачи и возврата охлаждающей жидкости.</text><rect x="486" y="292" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="320" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Сверить двигатель и наличие ретардера,</text><text x="502" y="372" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">прежде чем выбирать соединение.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Охлаждение</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Цвет линий условный; пины, параметры и совместимость не подтверждены.</text></svg>