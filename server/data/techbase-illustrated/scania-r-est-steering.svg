<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — EST — гидравлическое управление поддерживающей осью</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Ходовая и механика</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="26" fill="#24475c" font-weight="700" text-anchor="start">Scania R — EST — гидравлическое управление поддерживающей</text><text x="40" y="114" font-family="Arial,sans-serif" font-size="26" fill="#24475c" font-weight="700" text-anchor="start">осью</text><text x="40" y="145" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Авторская справочная иллюстрация • не OEM-схема</text><rect x="38" y="164" width="428" height="258" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(48 174) scale(.89)"><rect x="75" y="70" width="90" height="50" rx="8" fill="#e6eff3" stroke="#24475c" stroke-width="2"/><line x1="165" y1="95" x2="195" y2="95" stroke="#287eae" stroke-width="8" stroke-linecap="round"/><rect x="195" y="70" width="110" height="50" rx="8" fill="#e6eff3" stroke="#24475c" stroke-width="2"/><line x1="250" y1="120" x2="250" y2="166" stroke="#24475c" stroke-width="4" stroke-linecap="round"/><line x1="110" y1="166" x2="350" y2="166" stroke="#24475c" stroke-width="10" stroke-linecap="round"/><circle cx="110" cy="166" r="28" fill="#c7dbe4" stroke="#24475c" stroke-width="2"/><circle cx="350" cy="166" r="28" fill="#c7dbe4" stroke="#24475c" stroke-width="2"/><text x="225" y="253" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Гидроузел / управляемая ось</text></g><rect x="486" y="164" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="192" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="218" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Гидравлический узел EST относится к</text><text x="502" y="241" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">управляемой поддерживающей оси; для него</text><text x="502" y="264" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">предусмотрены соединения шлангов.</text><rect x="486" y="294" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="322" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Сверить тип оси и гидроагрегата; не считать</text><text x="502" y="371" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">EST частью контура пневмоподвески.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Рулевое управление</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Форма условная; точные параметры и применимость по документации.</text></svg>