<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Моторное торможение выпускным тормозом</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="47" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / КПП и ретардер</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="27" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Моторное торможение выпускным тормозом</text><text x="40" y="125" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Справочная авторская иллюстрация • не OEM-схема</text><rect x="38" y="160" width="428" height="260" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(8 22) scale(0.92 0.92)"><rect x="104" y="189" width="292" height="142" rx="9" fill="#abc4d0" stroke="#24475c" stroke-width="2"/><circle cx="183" cy="260" r="47" fill="#e0e8eb" stroke="#24475c" stroke-width="2"/><circle cx="307" cy="260" r="47" fill="#e0e8eb" stroke="#24475c" stroke-width="2"/><circle cx="183" cy="260" r="15" fill="#d5e2e8" stroke="#24475c" stroke-width="2"/><circle cx="307" cy="260" r="15" fill="#d5e2e8" stroke="#24475c" stroke-width="2"/><line x1="230" y1="260" x2="260" y2="260" stroke="#24475c" stroke-width="10" stroke-linecap="round"/><line x1="307" y1="189" x2="307" y2="161" stroke="#d47a23" stroke-width="8" stroke-linecap="round"/><path d="M290 208 L322 196" stroke="#24475c" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="400" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Условный исполнительный элемент</text></g><rect x="486" y="160" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="188" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="216" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">В описаниях двигателей R указаны</text><text x="502" y="240" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">возможности выпускного тормоза.</text><rect x="486" y="292" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="320" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Отличить выпускной тормоз от</text><text x="502" y="372" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">компрессионного CRB и гидравлического</text><text x="502" y="396" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">ретардера; точный клапан по двигателю.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania • Вспомогательное торможение</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Цвет линий условный; пины, параметры и совместимость не подтверждены.</text></svg>