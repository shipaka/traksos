<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Фонарь освещения седельного устройства</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Электрика и ЭБУ</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="26" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Фонарь освещения седельного устройства</text><text x="40" y="119" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Авторская справочная иллюстрация • не OEM-схема</text><rect x="38" y="164" width="428" height="258" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(48 174) scale(.89)"><path d="M85 74 H365 V180 H265 L225 145 L185 180 H85 Z" stroke="#24475c" stroke-width="3" fill="#9cb6c2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="225" cy="112" r="25" fill="#fff" stroke="#24475c" stroke-width="2"/><rect x="340" y="38" width="65" height="40" rx="8" fill="#efcf8b" stroke="#24475c" stroke-width="2"/><path d="M340 78 L286 113" stroke="#d47a23" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="253" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Условное седло и зона освещения</text></g><rect x="486" y="164" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="192" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="218" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">В перечне рабочих фонарей отдельно указан</text><text x="502" y="241" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">светильник для седельного устройства.</text><rect x="486" y="294" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="322" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Сверить цвет исполнения, расположение и</text><text x="502" y="371" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">подключение по опции.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Освещение</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Форма условная; точные параметры и применимость по документации.</text></svg>