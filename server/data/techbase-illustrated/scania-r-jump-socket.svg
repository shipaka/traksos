<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — C377 — предусмотренная точка внешнего питания</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="47" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Электрика и ЭБУ</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="27" fill="#24475c" font-weight="700" text-anchor="start">Scania R — C377 — предусмотренная точка внешнего питания</text><text x="40" y="125" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Справочная авторская иллюстрация • не OEM-схема</text><rect x="38" y="160" width="428" height="260" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(8 22) scale(0.92 0.92)"><rect x="109" y="212" width="282" height="116" rx="9" fill="#a4bbc6" stroke="#24475c" stroke-width="2"/><rect x="147" y="191" width="45" height="21" rx="9" fill="#9c4340" stroke="#24475c" stroke-width="2"/><rect x="307" y="191" width="45" height="21" rx="9" fill="#506573" stroke="#24475c" stroke-width="2"/><text x="170" y="267" font-family="Arial,sans-serif" font-size="40" fill="#ad453d" font-weight="700" text-anchor="middle">+</text><text x="330" y="267" font-family="Arial,sans-serif" font-size="40" fill="#24475c" font-weight="700" text-anchor="middle">−</text><text x="250" y="400" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Полюса / обратная цепь; не монтаж</text></g><rect x="486" y="160" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="188" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="216" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Руководство рекомендует использовать C377</text><text x="502" y="240" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">при наличии штатной точки запуска.</text><rect x="486" y="292" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="320" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Не применять процедуру дизельной машины к</text><text x="502" y="372" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">электромобилю; сверить руководство</text><text x="502" y="396" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">конкретного шасси.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Питание и защита</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Цвет линий условный; пины, параметры и совместимость не подтверждены.</text></svg>