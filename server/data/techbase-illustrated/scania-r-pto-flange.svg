al,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="218" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">В перечне приведены разные типы</text><text x="502" y="241" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">присоединительных фланцев DIN и SAE.</text><rect x="486" y="294" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="322" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Подбор по размеру фланца без допуска по</text><text x="502" y="371" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">моменту и комплектации недостаточен.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • КОМ и гидравлика</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Форма условная; точные параметры и применимость по документации.</text></svg>