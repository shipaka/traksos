<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img"><title>Scania R — Задний фонарь: секционный и LED</title><rect width="960" height="530" fill="#f8fafb"/><rect x="16" y="16" width="928" height="498" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="2"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">TrakSOS / Scania R / Электрика и ЭБУ</text><text x="40" y="86" font-family="Arial,sans-serif" font-size="26" fill="#24475c" font-weight="700" text-anchor="start">Scania R — Задний фонарь: секционный и LED</text><text x="40" y="119" font-family="Arial,sans-serif" font-size="17" fill="#24475c" font-weight="400" text-anchor="start">Авторская справочная иллюстрация • не OEM-схема</text><rect x="38" y="164" width="428" height="258" rx="12" fill="#f3f7f9" stroke="#cad9e1" stroke-width="2"/><g transform="translate(48 174) scale(.89)"><rect x="55" y="90" width="340" height="118" rx="8" fill="#a73e3c" stroke="#24475c" stroke-width="2"/><rect x="72" y="105" width="69" height="88" rx="5" fill="#d86560" stroke="#24475c" stroke-width="2"/><rect x="150" y="105" width="69" height="88" rx="5" fill="#e8b36a" stroke="#24475c" stroke-width="2"/><rect x="228" y="105" width="69" height="88" rx="5" fill="#f4f2e8" stroke="#24475c" stroke-width="2"/><rect x="306" y="105" width="69" height="88" rx="5" fill="#d86560" stroke="#24475c" stroke-width="2"/><text x="225" y="253" font-family="Arial,sans-serif" font-size="15" fill="#24475c" font-weight="700" text-anchor="middle">Условные секции; функции по исполнению</text></g><rect x="486" y="164" width="432" height="120" rx="10" fill="#eef4f7" stroke="#d5e0e5" stroke-width="2"/><text x="502" y="192" font-family="Arial,sans-serif" font-size="20" fill="#24475c" font-weight="700" text-anchor="start">Назначение / данные источника</text><text x="502" y="218" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Различаются секционные и LED исполнения</text><text x="502" y="241" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">задних фонарей, включая асимметрию функций.</text><rect x="486" y="294" width="432" height="128" rx="10" fill="#fff5e6" stroke="#efc48f" stroke-width="2"/><text x="502" y="322" font-family="Arial,sans-serif" font-size="20" fill="#a3510e" font-weight="700" text-anchor="start">Что идентифицировать</text><text x="502" y="348" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Сверить сторону, вариант подсветки номера и</text><text x="502" y="371" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">сигнал заднего хода.</text><text x="40" y="454" font-family="Arial,sans-serif" font-size="16" fill="#24475c" font-weight="400" text-anchor="start">Источник: Scania Bodybuilder • Освещение</text><text x="40" y="485" font-family="Arial,sans-serif" font-size="17" fill="#a3510e" font-weight="700" text-anchor="start">Форма условная; точные параметры и применимость по документации.</text></svg>